<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International News Radio</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #b0b0b0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 16px;
      max-width: 820px;
      margin: 0 auto;
    }

    .header-container {
      margin-bottom: 16px;
      text-align: left;
    }

    .callsign {
      font-size: 14px;
      font-weight: 700;
      color: #888888;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    h1.page-title {
      font-size: 22px;
      font-weight: 700;
      color: #e0e0e0;
      margin-bottom: 12px;
    }

    /* Oscilloscope Scope Panel */
    .scope-container {
      position: relative;
      width: 100%;
      height: 50px;
      background-color: #050b05;
      border: 1px solid #1c3b1c;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.05);
    }

    /* Background Scope Grid Overlay */
    .scope-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 20px 10px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 0, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
      pointer-events: none;
    }

    canvas#oscilloscope {
      display: block;
      width: 100%;
      height: 100%;
    }

    .playlist-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .channel-item {
      display: grid;
      grid-template-columns: 24px minmax(130px, 150px) 1fr;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      width: 100%;
    }

    /* Custom Radio Button UI */
    .radio-dot {
      width: 18px;
      height: 18px;
      border: 2px solid #555555;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }

    .radio-dot::after {
      content: "";
      width: 8px;
      height: 8px;
      background-color: #ff9800;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .channel-item.active .radio-dot {
      border-color: #ff9800;
    }

    .channel-item.active .radio-dot::after {
      opacity: 1;
      transform: scale(1);
    }

    .channel-name {
      font-size: 16px;
      font-weight: 500;
      color: #b0b0b0;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .channel-item.active .channel-name {
      color: #ff9800;
      font-weight: 600;
    }

    /* Retro Classic VU Meter Section */
    .vu-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .channel-item.active .vu-container {
      opacity: 1;
    }

    .led-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #222222;
      flex-shrink: 0;
      transition: background-color 0.05s ease, box-shadow 0.05s ease;
    }

    .vu-meter-panel {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .vu-scale-labels {
      display: flex;
      justify-content: space-between;
      position: relative;
      height: 18px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #cccccc;
      font-weight: 500;
    }

    .scale-mark {
      position: absolute;
      transform: translateX(-50%);
    }

    .scale-mark.zero-db {
      color: #ffffff;
      font-weight: 700;
    }

    .vu-bar-bg {
      position: relative;
      width: 100%;
      height: 9px;
      background-color: #111111;
      border: 1px solid #444444;
      border-radius: 2px;
      overflow: hidden;
    }

    .vu-grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #555555;
      z-index: 2;
    }

    .vu-grid-line.zero-line {
      background-color: #aaaaaa;
    }

    .vu-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, 
        #22c55e 0%, 
        #22c55e 78%, 
        #ff9800 80%, 
        #ef4444 100%);
      transition: width 0.04s ease-out;
      z-index: 1;
    }

    audio, video {
      display: none;
    }

    @media (max-width: 480px) {
      .channel-item {
        grid-template-columns: 22px 110px 1fr;
        gap: 8px;
      }
      .channel-name {
        font-size: 15px;
      }
      .vu-scale-labels {
        font-size: 12px;
        height: 16px;
      }
      .scope-container {
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <div class="callsign">HS1WFK</div>
    <h1 class="page-title">International News</h1>
    
    <!-- Oscilloscope Scope Under Title -->
    <div class="scope-container">
      <div class="scope-grid"></div>
      <canvas id="oscilloscope"></canvas>
    </div>
  </div>

  <div class="playlist-container" id="playlist"></div>

  <video id="media-player" crossorigin="anonymous" playsinline webkit-playsinline></video>

  <script>
    const channels = [
      { name: "Al Jazeera", url: "https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8" },
      { name: "ABC Australia", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { name: "Arirang Korea", url: "https://amdlive-ch02-ctnd-com.akamaized.net/arirang_2ch/smil:arirang_2ch.smil/playlist.m3u8" },
      { name: "BBC News", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8" },
      { name: "Bloomberg", url: "https://bloomberg.com/media-manifest/streams/phoenix-us.m3u8" },
      { name: "CGTN English", url: "https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8" },
      { name: "CNA", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8" },
      { name: "NHK English", url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
      { name: "DW En", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { name: "France 24 En", url: "https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8" },
      { name: "France 24 Fr", url: "https://live.france24.com/hls/live/2037179/F24_FR_HI_HLS/master_5000.m3u8" },
      { name: "GB News", url: "https://cdn-apse1-prod.tsv2.amagi.tv/linear/amg01076-lightningintern-gbnewsnz-samsungnz/playlist.m3u8" },
      { name: "Tagesschau24", url: "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8" },
      { name: "TPTV", url: "https://tv-live.tpchannel.org/live/tv_1080p.m3u8?vhost=tv-live.tpchannel.org" }
    ];

    const dbMarks = [
      { db: "-20", pos: 0 },
      { db: "-10", pos: 35 },
      { db: "-5", pos: 60 },
      { db: "0", pos: 80, isZero: true },
      { db: "+2", pos: 90 },
      { db: "+4", pos: 100 }
    ];

    const playlistContainer = document.getElementById('playlist');
    const player = document.getElementById('media-player');
    const canvas = document.getElementById('oscilloscope');
    const canvasCtx = canvas.getContext('2d');

    let activeIndex = -1;
    let hls = null;

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let animFrameId = null;

    let currentLevel = 0;

    function resizeCanvas() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio || 300;
      canvas.height = canvas.clientHeight * window.devicePixelRatio || 50;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    channels.forEach((channel, index) => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.dataset.index = index;

      let scaleHtml = dbMarks.map(m => 
        `<span class="scale-mark ${m.isZero ? 'zero-db' : ''}" style="left: ${m.pos}%;">${m.db}</span>`
      ).join('');

      let gridHtml = dbMarks.map(m => 
        `<div class="vu-grid-line ${m.isZero ? 'zero-line' : ''}" style="left: ${m.pos}%;"></div>`
      ).join('');

      item.innerHTML = `
        <div class="radio-dot"></div>
        <span class="channel-name">${channel.name}</span>
        <div class="vu-container">
          <div class="led-indicator" id="led-${index}"></div>
          <div class="vu-meter-panel">
            <div class="vu-scale-labels">${scaleHtml}</div>
            <div class="vu-bar-bg">
              ${gridHtml}
              <div class="vu-bar-fill" id="vu-${index}"></div>
            </div>
          </div>
        </div>
      `;

      item.addEventListener('click', () => toggleChannel(index));
      playlistContainer.appendChild(item);
    });

    function initAudioContext() {
      if (!audioCtx) {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          analyser = audioCtx.createAnalyser();
          
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.55; 

          sourceNode = audioCtx.createMediaElementSource(player);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (e) {
          console.log("AudioContext Notice:", e);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleChannel(index) {
      const items = document.querySelectorAll('.channel-item');

      if (activeIndex === index) {
        stopAudio();
        items[index].classList.remove('active');
        resetVU(index);
        activeIndex = -1;
        return;
      }

      if (activeIndex !== -1) {
        items[activeIndex].classList.remove('active');
        resetVU(activeIndex);
      }

      activeIndex = index;
      items[index].classList.add('active');
      playAudio(channels[index].url);
    }

    function playAudio(url) {
      stopAudio(false);

      if (player.canPlayType('application/vnd.apple.mpegurl')) {
        player.src = url;
        player.play().then(() => {
          initAudioContext();
          startVUMeter();
        }).catch(e => console.log("Play error:", e));
      } else if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          player.play().then(() => {
            initAudioContext();
            startVUMeter();
          }).catch(e => console.log("Play error:", e));
        });
      }
    }

    function stopAudio(clearSrc = true) {
      player.pause();
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (hls) { hls.destroy(); hls = null; }
      if (clearSrc) {
        player.removeAttribute('src');
        player.load();
      }
      currentLevel = 0;
      drawScopeFlat();
    }

    // High-Density Compressed Speech Envelope Waveform (Burst Groups)
    function drawScope(timeData, isPlaying) {
      const width = canvas.width;
      const height = canvas.height;
      const centerY = height / 2;

      canvasCtx.clearRect(0, 0, width, height);
      canvasCtx.lineWidth = 1.5 * (window.devicePixelRatio || 1);
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.shadowColor = '#22c55e';
      canvasCtx.shadowBlur = 4;

      if (!isPlaying || activeIndex === -1) {
        // Flat baseline
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, centerY);
        canvasCtx.lineTo(width, centerY);
        canvasCtx.stroke();
      } else if (timeData && timeData.length > 0) {
        // Real Audio Speech Envelope Drawing
        const numBars = 75; // Compressed density
        const barWidth = width / numBars;

        for (let i = 0; i < numBars; i++) {
          const sampleIndex = Math.floor((i / numBars) * timeData.length);
          const v = Math.abs((timeData[sampleIndex] - 128) / 128.0);
          const barHeight = v * (height * 0.85);

          if (barHeight > 1) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY - barHeight / 2);
            canvasCtx.lineTo(i * barWidth, centerY + barHeight / 2);
            canvasCtx.stroke();
          }
        }
      } else {
        // Organic Speech Burst Groups Simulation for iOS
        const time = performance.now() * 0.006;
        const numBars = 75;
        const barWidth = width / numBars;

        for (let i = 0; i < numBars; i++) {
          // Word envelope modulation (Creates distinct speech packets/groups)
          let wordEnvelope = Math.sin(i * 0.18 + time) * Math.sin(i * 0.08 - time * 0.4);
          wordEnvelope = Math.max(0, wordEnvelope); // Cutoff for speech pause spaces

          let voiceDetail = Math.sin(i * 1.5 + time * 3) * 0.5 + 0.5;
          let amp = (currentLevel / 100) * (height * 0.45) * Math.pow(wordEnvelope, 2) * voiceDetail;

          if (amp > 1) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY - amp);
            canvasCtx.lineTo(i * barWidth, centerY + amp);
            canvasCtx.stroke();
          } else {
            // Baseline dot/short segment for quiet interval
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY);
            canvasCtx.lineTo(i * barWidth + 1, centerY);
            canvasCtx.stroke();
          }
        }
      }
    }

    function drawScopeFlat() {
      drawScope(null, false);
    }

    function startVUMeter() {
      const freqData = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
      const timeData = analyser ? new Uint8Array(analyser.fftSize) : null;
      let simPhase = 0;

      function update() {
        let targetLevel = 0;
        let hasRealData = false;

        if (analyser && freqData) {
          analyser.getByteFrequencyData(freqData);
          let sumSquares = 0;
          for (let i = 0; i < freqData.length; i++) {
            let norm = freqData[i] / 255;
            sumSquares += norm * norm;
          }
          let rms = Math.sqrt(sumSquares / freqData.length);

          if (rms > 0.008) {
            hasRealData = true;
            targetLevel = Math.min(100, Math.pow(rms * 2.65, 0.85) * 100);
            if (timeData) analyser.getByteTimeDomainData(timeData);
          }
        }

        // iOS Fallback Dynamics
        if (!hasRealData && !player.paused && player.currentTime > 0) {
          simPhase += 0.12;
          let speechEnvelope = Math.max(0, Math.sin(simPhase) * 35 + Math.sin(simPhase * 2.7) * 25);
          let randomPeak = Math.random() > 0.5 ? Math.random() * 30 : 0;
          targetLevel = Math.min(95, Math.max(0, 18 + speechEnvelope + randomPeak));
        }

        // Fast Response Balancing
        if (targetLevel > currentLevel) {
          currentLevel += (targetLevel - currentLevel) * 0.65;
        } else {
          currentLevel += (targetLevel - currentLevel) * 0.30;
        }

        if (activeIndex !== -1) {
          const vuFill = document.getElementById(`vu-${activeIndex}`);
          const led = document.getElementById(`led-${activeIndex}`);

          if (vuFill) vuFill.style.width = currentLevel.toFixed(1) + '%';

          if (led) {
            if (currentLevel > 10) {
              led.style.backgroundColor = '#22c55e';
              led.style.boxShadow = '0 0 6px #22c55e';
            } else {
              led.style.backgroundColor = '#222222';
              led.style.boxShadow = 'none';
            }
          }

          drawScope(hasRealData ? timeData : null, !player.paused);
        }

        animFrameId = requestAnimationFrame(update);
      }

      update();
    }

    function resetVU(index) {
      const vuFill = document.getElementById(`vu-${index}`);
      const led = document.getElementById(`led-${index}`);
      if (vuFill) vuFill.style.width = '0%';
      if (led) {
        led.style.backgroundColor = '#222222';
        led.style.boxShadow = 'none';
      }
    }

    drawScopeFlat();
  </script>
</body>
</html>
