<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International News V.2</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* Fixed Background Layer (ert92.jpg) */
    body {
      background-color: #050a12;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 16px 16px 16px;
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 100%),
        url('ert92.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    /* Sticky Fixed Header Section */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 10px 8px 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 0 6px 6px;
    }

    .header-container {
      text-align: left;
      padding-left: 2px;
    }

    .callsign {
      font-size: 13px;
      font-weight: 700;
      color: #a0a0a0;
      letter-spacing: 0.5px;
      margin-bottom: 1px;
    }

    h1.page-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95);
    }

    /* Oscilloscope Scope Panel */
    .scope-container {
      position: relative;
      width: 100%;
      height: 42px;
      background-color: rgba(5, 11, 5, 0.92);
      border: 1px solid rgba(28, 59, 28, 0.85);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 8px rgba(0, 255, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .scope-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 18px 9px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 0, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
      pointer-events: none;
    }

    canvas#oscilloscope {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Playlist Container - High Readability & Compact Spacing */
    .playlist-container {
      display: flex;
      flex-direction: column;
      gap: 10px; /* ย่นระยะห่างระหว่างบรรทัด */
      background: rgba(0, 0, 0, 0.68);
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
    }

    .section-divider {
      font-size: 12px;
      font-weight: 700;
      color: #ff9800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 6px 0 2px 2px;
      border-top: 1px dashed rgba(255, 255, 255, 0.2);
      margin-top: 4px;
    }

    .channel-item {
      display: grid;
      grid-template-columns: 20px minmax(130px, 150px) 1fr;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      width: 100%;
    }

    /* Custom Radio Button UI */
    .radio-dot {
      width: 16px;
      height: 16px;
      border: 1.8px solid #777777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }

    .radio-dot::after {
      content: "";
      width: 7px;
      height: 7px;
      background-color: #ff9800;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .channel-item.active .radio-dot {
      border-color: #ff9800;
    }

    .channel-item.active .radio-dot::after {
      opacity: 1;
      transform: scale(1);
    }

    /* คืนค่าขนาด Font 16px ดั้งเดิม */
    .channel-name {
      font-size: 16px;
      font-weight: 500;
      color: #d0d0d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.2s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .channel-item.active .channel-name {
      color: #ff9800;
      font-weight: 600;
    }

    /* Retro Classic VU Meter Section */
    .vu-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .channel-item.active .vu-container {
      opacity: 1;
    }

    .led-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #222222;
      flex-shrink: 0;
      transition: background-color 0.05s ease, box-shadow 0.05s ease;
    }

    .vu-meter-panel {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* คืนค่าขนาด Scale Labels 14px ดั้งเดิม */
    .vu-scale-labels {
      display: flex;
      justify-content: space-between;
      position: relative;
      height: 15px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e0e0;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .scale-mark {
      position: absolute;
      transform: translateX(-50%);
    }

    .scale-mark.zero-db {
      color: #ffffff;
      font-weight: 700;
    }

    .vu-bar-bg {
      position: relative;
      width: 100%;
      height: 8px;
      background-color: rgba(17, 17, 17, 0.95);
      border: 1px solid #555555;
      border-radius: 2px;
      overflow: hidden;
    }

    .vu-grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #555555;
      z-index: 2;
    }

    .vu-grid-line.zero-line {
      background-color: #aaaaaa;
    }

    .vu-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, 
        #22c55e 0%, 
        #22c55e 78%, 
        #ff9800 80%, 
        #ef4444 100%);
      transition: width 0.04s ease-out;
      z-index: 1;
    }

    audio, video {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 0 10px 10px 10px;
      }
      .channel-item {
        grid-template-columns: 18px 115px 1fr;
        gap: 8px;
      }
      .channel-name {
        font-size: 15px;
      }
      .vu-scale-labels {
        font-size: 12px;
        height: 14px;
      }
      .scope-container {
        height: 36px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Fixed Section -->
  <div class="sticky-header">
    <div class="header-container">
      <div class="callsign">HS1WFK</div>
      <h1 class="page-title">International News V.2</h1>
      
      <!-- Oscilloscope Scope Under Title -->
      <div class="scope-container">
        <div class="scope-grid"></div>
        <canvas id="oscilloscope"></canvas>
      </div>
    </div>
  </div>

  <div class="playlist-container" id="playlist"></div>

  <!-- Hidden Media Elements -->
  <video id="video-player" crossorigin="anonymous" playsinline webkit-playsinline></video>
  <audio id="audio-player" playsinline></audio>

  <script>
    const internationalChannels = [
      { name: "Al Jazeera", url: "https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8" },
      { name: "ABC Australia", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { name: "Arirang Korea", url: "https://amdlive-ch02-ctnd-com.akamaized.net/arirang_2ch/smil:arirang_2ch.smil/playlist.m3u8" },
      { name: "BBC News", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8" },
      { name: "Bloomberg", url: "https://bloomberg.com/media-manifest/streams/phoenix-us.m3u8" },
      { name: "CGTN English", url: "https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8" },
      { name: "CNA", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8" },
      { name: "NHK English", url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
      { name: "DW En", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { name: "France 24 En", url: "https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8" },
      { name: "France 24 Fr", url: "https://live.france24.com/hls/live/2037179/F24_FR_HI_HLS/master_5000.m3u8" },
      { name: "GB News", url: "https://cdn-apse1-prod.tsv2.amagi.tv/linear/amg01076-lightningintern-gbnewsnz-samsungnz/playlist.m3u8" },
      { name: "Tagesschau24", url: "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8" },
      { name: "TPTV", url: "https://tv-live.tpchannel.org/live/tv_1080p.m3u8?vhost=tv-live.tpchannel.org" }
    ];

    const radioChannels = [
      { name: "FM 91", url: "http://122.155.16.48:8955/;stream", isAudioOnly: true },
      { name: "บ้านธรรมะ", url: "https://radio10.plathong.net/7238/;stream.mp3", isAudioOnly: true },
      { name: "วัดปากบ่อ", url: "http://radio1.siamlivehost.com:8001/", isAudioOnly: true },
      { name: "วัดนายโรง", url: "http://103.7.56.219:4106/", isAudioOnly: true }
    ];

    const dbMarks = [
      { db: "-20", pos: 0 },
      { db: "-10", pos: 35 },
      { db: "-5", pos: 60 },
      { db: "0", pos: 80, isZero: true },
      { db: "+2", pos: 90 },
      { db: "+4", pos: 100 }
    ];

    const playlistContainer = document.getElementById('playlist');
    const videoPlayer = document.getElementById('video-player');
    const audioPlayer = document.getElementById('audio-player');
    const canvas = document.getElementById('oscilloscope');
    const canvasCtx = canvas.getContext('2d');

    let activeIndex = -1;
    let hls = null;
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let animFrameId = null;

    let currentLevel = 0;

    function resizeCanvas() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio || 300;
      canvas.height = canvas.clientHeight * window.devicePixelRatio || 36;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderChannelItem(channel, index) {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.dataset.index = index;

      let scaleHtml = dbMarks.map(m => 
        `<span class="scale-mark ${m.isZero ? 'zero-db' : ''}" style="left: ${m.pos}%;">${m.db}</span>`
      ).join('');

      let gridHtml = dbMarks.map(m => 
        `<div class="vu-grid-line ${m.isZero ? 'zero-line' : ''}" style="left: ${m.pos}%;"></div>`
      ).join('');

      item.innerHTML = `
        <div class="radio-dot"></div>
        <span class="channel-name">${channel.name}</span>
        <div class="vu-container">
          <div class="led-indicator" id="led-${index}"></div>
          <div class="vu-meter-panel">
            <div class="vu-scale-labels">${scaleHtml}</div>
            <div class="vu-bar-bg">
              ${gridHtml}
              <div class="vu-bar-fill" id="vu-${index}"></div>
            </div>
          </div>
        </div>
      `;

      item.addEventListener('click', () => toggleChannel(index));
      return item;
    }

    const allChannels = [...internationalChannels, ...radioChannels];

    // Render International Channels
    internationalChannels.forEach((ch, idx) => {
      playlistContainer.appendChild(renderChannelItem(ch, idx));
    });

    // Render Section Divider
    const divider = document.createElement('div');
    divider.className = 'section-divider';
    divider.innerText = 'Online Channels';
    playlistContainer.appendChild(divider);

    // Render Radio Channels
    radioChannels.forEach((ch, idx) => {
      playlistContainer.appendChild(renderChannelItem(ch, internationalChannels.length + idx));
    });

    function initAudioContext(mediaElem) {
      if (!audioCtx) {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.55;

          sourceNode = audioCtx.createMediaElementSource(mediaElem);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (e) {
          console.log("AudioContext Notice:", e);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleChannel(index) {
      const items = document.querySelectorAll('.channel-item');

      if (activeIndex === index) {
        stopAll();
        items[index].classList.remove('active');
        resetVU(index);
        activeIndex = -1;
        return;
      }

      if (activeIndex !== -1) {
        items[activeIndex].classList.remove('active');
        resetVU(activeIndex);
      }

      activeIndex = index;
      items[index].classList.add('active');
      playMedia(allChannels[index]);
    }

    function playMedia(channel) {
      stopAll(false);

      if (channel.isAudioOnly) {
        // Direct Audio Stream Engine (No CrossOrigin restriction for HTTP Shoutcast)
        audioPlayer.src = channel.url;
        audioPlayer.play().then(() => {
          startVUMeter(audioPlayer);
        }).catch(e => console.log("Audio play error:", e));
      } else {
        // HLS Video Stream Engine
        if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
          videoPlayer.src = channel.url;
          videoPlayer.play().then(() => {
            initAudioContext(videoPlayer);
            startVUMeter(videoPlayer);
          }).catch(e => console.log("Video play error:", e));
        } else if (Hls.isSupported()) {
          hls = new Hls({ enableWorker: true });
          hls.loadSource(channel.url);
          hls.attachMedia(videoPlayer);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            videoPlayer.play().then(() => {
              initAudioContext(videoPlayer);
              startVUMeter(videoPlayer);
            }).catch(e => console.log("Hls play error:", e));
          });
        }
      }
    }

    function stopAll(clearSrc = true) {
      videoPlayer.pause();
      audioPlayer.pause();
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (hls) { hls.destroy(); hls = null; }

      if (clearSrc) {
        videoPlayer.removeAttribute('src');
        videoPlayer.load();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();
      }
      currentLevel = 0;
      drawScopeFlat();
    }

    function drawScope(timeData, isPlaying) {
      const width = canvas.width;
      const height = canvas.height;
      const centerY = height / 2;

      canvasCtx.clearRect(0, 0, width, height);
      canvasCtx.lineWidth = 1.5 * (window.devicePixelRatio || 1);
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.shadowColor = '#22c55e';
      canvasCtx.shadowBlur = 4;

      if (!isPlaying || activeIndex === -1) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, centerY);
        canvasCtx.lineTo(width, centerY);
        canvasCtx.stroke();
      } else if (timeData && timeData.length > 0) {
        const numBars = 75;
        const barWidth = width / numBars;

        for (let i = 0; i < numBars; i++) {
          const sampleIndex = Math.floor((i / numBars) * timeData.length);
          const v = Math.abs((timeData[sampleIndex] - 128) / 128.0);
          const barHeight = v * (height * 0.85);

          if (barHeight > 1) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY - barHeight / 2);
            canvasCtx.lineTo(i * barWidth, centerY + barHeight / 2);
            canvasCtx.stroke();
          }
        }
      } else {
        const time = performance.now() * 0.006;
        const numBars = 75;
        const barWidth = width / numBars;

        for (let i = 0; i < numBars; i++) {
          let wordEnvelope = Math.sin(i * 0.18 + time) * Math.sin(i * 0.08 - time * 0.4);
          wordEnvelope = Math.max(0, wordEnvelope);

          let voiceDetail = Math.sin(i * 1.5 + time * 3) * 0.5 + 0.5;
          let amp = (currentLevel / 100) * (height * 0.45) * Math.pow(wordEnvelope, 2) * voiceDetail;

          if (amp > 1) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY - amp);
            canvasCtx.lineTo(i * barWidth, centerY + amp);
            canvasCtx.stroke();
          } else {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY);
            canvasCtx.lineTo(i * barWidth + 1, centerY);
            canvasCtx.stroke();
          }
        }
      }
    }

    function drawScopeFlat() {
      drawScope(null, false);
    }

    function startVUMeter(activeMedia) {
      const freqData = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
      const timeData = analyser ? new Uint8Array(analyser.fftSize) : null;
      let simPhase = 0;

      function update() {
        let targetLevel = 0;
        let hasRealData = false;

        if (analyser && freqData) {
          analyser.getByteFrequencyData(freqData);
          let sumSquares = 0;
          for (let i = 0; i < freqData.length; i++) {
            let norm = freqData[i] / 255;
            sumSquares += norm * norm;
          }
          let rms = Math.sqrt(sumSquares / freqData.length);

          if (rms > 0.008) {
            hasRealData = true;
            targetLevel = Math.min(100, Math.pow(rms * 2.65, 0.85) * 100);
            if (timeData) analyser.getByteTimeDomainData(timeData);
          }
        }

        // Fallback for HTTP Audio Streams / iOS CORS Restrictions
        if (!hasRealData && activeMedia && !activeMedia.paused && activeMedia.currentTime > 0) {
          simPhase += 0.12;
          let speechEnvelope = Math.max(0, Math.sin(simPhase) * 35 + Math.sin(simPhase * 2.7) * 25);
          let randomPeak = Math.random() > 0.5 ? Math.random() * 30 : 0;
          targetLevel = Math.min(95, Math.max(0, 18 + speechEnvelope + randomPeak));
        }

        if (targetLevel > currentLevel) {
          currentLevel += (targetLevel - currentLevel) * 0.65;
        } else {
          currentLevel += (targetLevel - currentLevel) * 0.30;
        }

        if (activeIndex !== -1) {
          const vuFill = document.getElementById(`vu-${activeIndex}`);
          const led = document.getElementById(`led-${activeIndex}`);

          if (vuFill) vuFill.style.width = currentLevel.toFixed(1) + '%';

          if (led) {
            if (currentLevel > 10) {
              led.style.backgroundColor = '#22c55e';
              led.style.boxShadow = '0 0 6px #22c55e';
            } else {
              led.style.backgroundColor = '#222222';
              led.style.boxShadow = 'none';
            }
          }

          drawScope(hasRealData ? timeData : null, activeMedia && !activeMedia.paused);
        }

        animFrameId = requestAnimationFrame(update);
      }

      update();
    }

    function resetVU(index) {
      const vuFill = document.getElementById(`vu-${index}`);
      const led = document.getElementById(`led-${index}`);
      if (vuFill) vuFill.style.width = '0%';
      if (led) {
        led.style.backgroundColor = '#222222';
        led.style.boxShadow = 'none';
      }
    }

    drawScopeFlat();
  </script>
</body>
</html>
