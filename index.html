<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International News - Realtime Scope Sync V.1</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050a12;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 20px 20px 20px;
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 100%),
        url('ert92.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    /* Sticky Fixed Header Section */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding-top: 16px;
      padding-bottom: 12px;
      padding-left: 12px;
      padding-right: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 0 8px 8px;
    }

    .header-container {
      text-align: left;
      padding-left: 6px;
    }

    .callsign {
      font-size: 26px;
      font-weight: 700;
      color: #a0a0a0;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    h1.page-title {
      font-size: 40px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      margin: 0;
      line-height: 1.1;
    }

    .utc-time-display {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }

    .station-info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      min-height: 36px;
      visibility: hidden;
      width: 100%;
    }

    .station-location-text {
      font-size: 26px !important;
      font-weight: 700;
      color: #ff9800;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .local-time-display {
      font-size: 26px !important;
      font-weight: 700;
      color: #ff9800;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.2;
    }

    .scope-container {
      position: relative;
      width: 100%;
      height: 50px;
      background-color: rgba(5, 11, 5, 0.92);
      border: 1px solid rgba(28, 59, 28, 0.85);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.7);
      margin-bottom: 6px;
    }

    .scope-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 20px 10px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 0, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
      pointer-events: none;
    }

    canvas#oscilloscope {
      display: block;
      width: 100%;
      height: 100%;
    }

    .audio-content-stats {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: none;
      margin-top: 4px;
      padding-left: 4px;
      transition: display 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      color: #a0a0a0;
    }

    .channels-indicator {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-term {
      transition: color 0.15s ease;
    }

    .stat-term.active-red {
      color: #ef4444 !important;
    }

    .stat-term.disable-gray {
      color: #555555;
    }

    .playlist-container {
      display: flex;
      flex-direction: column;
      gap: 20px; 
      background: rgba(0, 0, 0, 0.65);
      padding: 18px 20px 24px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    }

    .channel-item {
      display: grid;
      grid-template-columns: 24px minmax(130px, 150px) 1fr;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      width: 100%;
      padding-left: 2px;
    }

    .radio-dot {
      width: 18px;
      height: 18px;
      border: 2px solid #777777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }

    .radio-dot::after {
      content: "";
      width: 8px;
      height: 8px;
      background-color: #ff9800;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .channel-item.active .radio-dot {
      border-color: #ff9800;
    }

    .channel-item.active .radio-dot::after {
      opacity: 1;
      transform: scale(1);
    }

    .channel-name {
      font-size: 20px;
      font-weight: 400;
      color: #d0d0d0;
      white-space: nowrap;
      transition: color 0.2s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .channel-item.active .channel-name {
      color: #ff9800;
      font-weight: 700;
    }

    .vu-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .channel-item.active .vu-container {
      opacity: 1;
    }

    .led-indicator {
      width: 8.8px;
      height: 8.8px;
      border-radius: 50%;
      background-color: #222222;
      flex-shrink: 0;
      transition: background-color 0.05s ease, box-shadow 0.05s ease;
    }

    .vu-meter-panel {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .vu-scale-labels {
      display: flex;
      justify-content: space-between;
      position: relative;
      height: 24px;
      font-size: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e0e0;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .scale-mark {
      position: absolute;
      transform: translateX(-50%);
    }

    .scale-mark.zero-db {
      color: #ffffff;
      font-weight: 700;
    }

    .vu-bar-bg {
      position: relative;
      width: 100%;
      height: 9px;
      background-color: rgba(17, 17, 17, 0.95);
      border: 1px solid #555555;
      border-radius: 2px;
      overflow: hidden;
    }

    .vu-grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #555555;
      z-index: 2;
    }

    .vu-grid-line.zero-line {
      background-color: #aaaaaa;
    }

    .vu-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, 
        #22c55e 0%, 
        #22c55e 78%, 
        #ff9800 80%, 
        #ef4444 100%);
      transition: width 0.04s ease-out;
      z-index: 1;
    }

    audio, video {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 0 12px 16px 12px;
      }
      .sticky-header {
        padding-left: 8px;
        padding-right: 8px;
      }
      .callsign {
        font-size: 16px;
      }
      h1.page-title {
        font-size: 21px;
      }
      .utc-time-display {
        font-size: 14px;
      }
      .station-location-text, 
      .local-time-display {
        font-size: 13px !important;
      }
      .channels-indicator {
        font-size: 14px;
      }
      .playlist-container {
        padding: 14px 12px 18px 12px;
      }
      .channel-item {
        grid-template-columns: 22px 110px 1fr;
        gap: 8px;
        padding-left: 0;
      }
      .channel-name {
        font-size: 15px;
      }
      .vu-scale-labels {
        font-size: 12px;
        height: 16px;
      }
      .scope-container {
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Fixed Section -->
  <div class="sticky-header">
    <div class="header-container">
      <div class="callsign">HS1WFK</div>
      
      <!-- Title Row + Realtime UTC Time -->
      <div class="title-row">
        <h1 class="page-title">International News</h1>
        <div class="utc-time-display" id="utc-clock">UTC --:--:--</div>
      </div>

      <!-- Station Location Row + Realtime Local Time -->
      <div class="station-info-row" id="station-info-row">
        <div class="station-location-text" id="station-location-text"></div>
        <div class="local-time-display" id="local-clock">Local Time --:--:--</div>
      </div>

      <!-- Oscilloscope Scope Under Title -->
      <div class="scope-container">
        <div class="scope-grid"></div>
        <canvas id="oscilloscope"></canvas>
      </div>

      <!-- ส่วนแสดงผล Mono | Stereo ใต้ Header Scope -->
      <div class="audio-content-stats" id="audio-content-stats">
        <div class="channels-indicator">
          CH: 
          <span id="stat-mono" class="stat-term disable-gray">Mono</span> 
          | 
          <span id="stat-stereo" class="stat-term disable-gray">Stereo</span>
        </div>
      </div>
    </div>
  </div>

  <div class="playlist-container" id="playlist"></div>

  <video id="media-player" crossorigin="anonymous" playsinline webkit-playsinline></video>

  <script>
    const channels = [
      { name: "Al Jazeera", location: "Doha Qatar", tz: "Asia/Qatar", url: "https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8" },
      { name: "ABC Australia", location: "Sydney Australia", tz: "Australia/Sydney", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { name: "Arirang Korea", location: "Seoul South Korea", tz: "Asia/Seoul", url: "https://amdlive-ch02-ctnd-com.akamaized.net/arirang_2ch/smil:arirang_2ch.smil/playlist.m3u8" },
      { name: "BBC News", location: "London UK", tz: "Europe/London", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8" },
      { name: "Bloomberg", location: "New York USA", tz: "America/New_York", url: "https://bloomberg.com/media-manifest/streams/phoenix-us.m3u8" },
      { name: "CGTN", location: "Beijing China", tz: "Asia/Shanghai", url: "https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8" },
      { name: "CNA", location: "Singapore", tz: "Asia/Singapore", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8" },
      { name: "NHK English", location: "Tokyo Japan", tz: "Asia/Tokyo", url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
      { name: "DW En", location: "Berlin Germany", tz: "Europe/Berlin", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { name: "France 24 En", location: "Paris France", tz: "Europe/Paris", url: "https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8" },
      { name: "France 24 Fr", location: "Paris France", tz: "Europe/Paris", url: "https://live.france24.com/hls/live/2037179/F24_FR_HI_HLS/master_5000.m3u8" },
      { name: "GB News", location: "London UK", tz: "Europe/London", url: "https://cdn-apse1-prod.tsv2.amagi.tv/linear/amg01076-lightningintern-gbnewsnz-samsungnz/playlist.m3u8" },
      { name: "Tagesschau24", location: "Hamburg Germany", tz: "Europe/Berlin", url: "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8" },
      { name: "TPTV", location: "Bangkok Thailand", tz: "Asia/Bangkok", url: "https://tv-live.tpchannel.org/live/tv_1080p.m3u8?vhost=tv-live.tpchannel.org" }
    ];

    const dbMarks = [
      { db: "-20", pos: 0 },
      { db: "-10", pos: 35 },
      { db: "-5", pos: 60 },
      { db: "0", pos: 80, isZero: true },
      { db: "+2", pos: 90 },
      { db: "+4", pos: 100 }
    ];

    const playlistContainer = document.getElementById('playlist');
    const player = document.getElementById('media-player');
    const canvas = document.getElementById('oscilloscope');
    const canvasCtx = canvas.getContext('2d');

    const utcClockElem = document.getElementById('utc-clock');
    const localClockElem = document.getElementById('local-clock');
    const stationInfoRow = document.getElementById('station-info-row');
    const stationLocationText = document.getElementById('station-location-text');

    const statsPanel = document.getElementById('audio-content-stats');
    const statMono = document.getElementById('stat-mono');
    const statStereo = document.getElementById('stat-stereo');

    let activeIndex = -1;
    let hls = null;

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let animFrameId = null;

    let currentLevel = 0;

    function updateClocks() {
      const now = new Date();

      const utcHours = String(now.getUTCHours()).padStart(2, '0');
      const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
      const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
      utcClockElem.innerText = `UTC ${utcHours}:${utcMinutes}:${utcSeconds}`;

      if (activeIndex !== -1 && channels[activeIndex]?.tz) {
        try {
          const options = {
            timeZone: channels[activeIndex].tz,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          };
          const formatter = new Intl.DateTimeFormat('en-GB', options);
          localClockElem.innerText = `Local Time ${formatter.format(now)}`;
        } catch (e) {
          localClockElem.innerText = "Local Time --:--:--";
        }
      }
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    channels.forEach((channel, index) => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.dataset.index = index;

      let scaleHtml = dbMarks.map(m => 
        `<span class="scale-mark ${m.isZero ? 'zero-db' : ''}" style="left: ${m.pos}%;">${m.db}</span>`
      ).join('');

      let gridHtml = dbMarks.map(m => 
        `<div class="vu-grid-line ${m.isZero ? 'zero-line' : ''}" style="left: ${m.pos}%;"></div>`
      ).join('');

      item.innerHTML = `
        <div class="radio-dot"></div>
        <span class="channel-name">${channel.name}</span>
        <div class="vu-container">
          <div class="led-indicator" id="led-${index}"></div>
          <div class="vu-meter-panel">
            <div class="vu-scale-labels">${scaleHtml}</div>
            <div class="vu-bar-bg">
              ${gridHtml}
              <div class="vu-bar-fill" id="vu-${index}"></div>
            </div>
          </div>
        </div>
      `;

      item.addEventListener('click', () => toggleChannel(index));
      playlistContainer.appendChild(item);
    });

    // ปรับปรุงการริเริ่ม AudioContext สำหรับ iOS ให้ปลดล็อก Audio Engine ทันที
    function initAudioContext() {
      if (!audioCtx) {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          analyser = audioCtx.createAnalyser();
          
          analyser.fftSize = 256; // เพิ่มความละเอียดคลื่นสำหรับ Oscilloscope
          analyser.smoothingTimeConstant = 0.3; // ปรับความสมูทในการตอบสนองความถี่

          sourceNode = audioCtx.createMediaElementSource(player);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (e) {
          console.log("AudioContext Notice:", e);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    player.addEventListener('playing', () => {
      if (activeIndex !== -1) {
        const currentChannel = channels[activeIndex];
        stationLocationText.innerText = `${currentChannel.name} - ${currentChannel.location}`;
        stationInfoRow.style.visibility = 'visible';
        updateClocks();
      }
    });

    function toggleChannel(index) {
      // บังคับ Resume AudioContext บน iOS ผ่าน Touch Event สัมผัสปุ่ม
      initAudioContext();

      const items = document.querySelectorAll('.channel-item');

      if (activeIndex === index) {
        stopAudio();
        items[index].classList.remove('active');
        resetVU(index);
        activeIndex = -1;
        return;
      }

      if (activeIndex !== -1) {
        items[activeIndex].classList.remove('active');
        resetVU(activeIndex);
      }

      stationInfoRow.style.visibility = 'hidden';

      activeIndex = index;
      items[index].classList.add('active');
      playAudio(channels[index].url);
    }

    function playAudio(url) {
      stopAudio(false);

      if (player.canPlayType('application/vnd.apple.mpegurl')) {
        player.src = url;
        player.play().then(() => {
          initAudioContext();
          startVUMeter();
        }).catch(e => console.log("Play error:", e));
      } else if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          player.play().then(() => {
            initAudioContext();
            startVUMeter();
          }).catch(e => console.log("Play error:", e));
        });
      }
    }

    function stopAudio(clearSrc = true) {
      player.pause();
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (hls) { hls.destroy(); hls = null; }
      if (clearSrc) {
        player.removeAttribute('src');
        player.load();
      }
      currentLevel = 0;
      drawScopeFlat();

      stationInfoRow.style.visibility = 'hidden';
      if (statsPanel) statsPanel.style.display = 'none';
      statMono.className = 'stat-term disable-gray';
      statStereo.className = 'stat-term disable-gray';
    }

    /* Oscilloscope visualizer Engine ใหม่ - แสดงรูปคลื่นสัญญาณเสียงเวลาจริง (Time-Domain Waveform) */
    function drawScope(timeData, isPlaying) {
      const width = canvas.width;
      const height = canvas.height;
      const centerY = height / 2;

      canvasCtx.clearRect(0, 0, width, height);
      canvasCtx.lineWidth = 2 * (window.devicePixelRatio || 1);
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.shadowColor = '#22c55e';
      canvasCtx.shadowBlur = 6;

      if (!isPlaying || activeIndex === -1) {
        // เส้นระนาบศูนย์เมื่อปิดเสียง
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, centerY);
        canvasCtx.lineTo(width, centerY);
        canvasCtx.stroke();
      } else if (timeData && timeData.length > 0) {
        // วาดเส้นคลื่นสัญญาณเสียงเวลาจริงตาม Time Domain Data 2x Amplitude
        canvasCtx.beginPath();
        const bufferLength = timeData.length;
        const sliceWidth = width / bufferLength;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const v = timeData[i] / 128.0; // ปกติ = 1.0 (ช่วง 0 ถึง 2)
          // ขยายความสูงรูปคลื่นขึ้น 2 เท่า (2x) โดยรักษากรอบ Canvas
          const y = centerY + (v - 1.0) * centerY * 1.85;

          if (i === 0) {
            canvasCtx.moveTo(x, y);
          } else {
            canvasCtx.lineTo(x, y);
          }
          x += sliceWidth;
        }
        canvasCtx.stroke();
      } else {
        // โหมดสแกนคลื่นจำลองความเร็วต่ำนุ่มนวล
        const time = performance.now() * 0.002;
        canvasCtx.beginPath();
        const points = 120;
        const sliceWidth = width / points;
        let x = 0;

        for (let i = 0; i < points; i++) {
          let wordEnvelope = Math.sin(i * 0.15 + time) * Math.sin(i * 0.05 - time * 0.5);
          wordEnvelope = Math.max(0, wordEnvelope);

          let voiceDetail = Math.sin(i * 0.8 + time * 2) * 0.5;
          let amp = (currentLevel / 100) * (centerY * 0.90) * Math.pow(wordEnvelope, 2) * voiceDetail;

          const y = centerY + Math.sin(i * 0.4 + time * 3) * amp;

          if (i === 0) {
            canvasCtx.moveTo(x, y);
          } else {
            canvasCtx.lineTo(x, y);
          }
          x += sliceWidth;
        }
        canvasCtx.stroke();
      }
    }

    function drawScopeFlat() {
      drawScope(null, false);
    }

    function startVUMeter() {
      const freqData = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
      const timeData = analyser ? new Uint8Array(analyser.fftSize) : null;

      function update() {
        let targetLevel = 0;
        let hasRealData = false;

        if (analyser && freqData) {
          analyser.getByteFrequencyData(freqData);
          let sumSquares = 0;
          for (let i = 0; i < freqData.length; i++) {
            let norm = freqData[i] / 255;
            sumSquares += norm * norm;
          }
          let rms = Math.sqrt(sumSquares / freqData.length);

          if (rms > 0.005) {
            hasRealData = true;
            targetLevel = Math.min(100, Math.pow(rms * 2.65, 0.85) * 100);
            if (timeData) analyser.getByteTimeDomainData(timeData);
          }
        }

        if (targetLevel > currentLevel) {
          currentLevel += (targetLevel - currentLevel) * 0.65;
        } else {
          currentLevel += (targetLevel - currentLevel) * 0.30;
        }

        if (activeIndex !== -1) {
          const vuFill = document.getElementById(`vu-${activeIndex}`);
          const led = document.getElementById(`led-${activeIndex}`);

          if (vuFill) vuFill.style.width = currentLevel.toFixed(1) + '%';

          if (led) {
            if (currentLevel > 10) {
              led.style.backgroundColor = '#22c55e';
              led.style.boxShadow = '0 0 6px #22c55e';
            } else {
              led.style.backgroundColor = '#222222';
              led.style.boxShadow = 'none';
            }
          }

          if (statsPanel && analyser) {
            statsPanel.style.display = 'block';

            const channelCount = analyser.channelCount;

            if (channelCount >= 2) {
              statStereo.className = 'stat-term active-red';
              statMono.className = 'stat-term disable-gray';
            } else {
              statMono.className = 'stat-term active-red';
              statStereo.className = 'stat-term disable-gray';
            }
          }

          drawScope(hasRealData ? timeData : null, !player.paused);
        }

        animFrameId = requestAnimationFrame(update);
      }

      update();
    }

    function resetVU(index) {
      const vuFill = document.getElementById(`vu-${index}`);
      const led = document.getElementById(`led-${index}`);

      if (vuFill) vuFill.style.width = '0%';
      if (led) {
        led.style.backgroundColor = '#222222';
        led.style.boxShadow = 'none';
      }
    }

    drawScopeFlat();
  </script>
</body>
</html>
