<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International News - Segment Meter V.1.3.5</title>
  <!-- HLS.js Library (pinned to major version 1) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050a12;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 20px 20px 20px;
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image:
        linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 100%),
        url('ert92.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding-top: 16px;
      padding-bottom: 12px;
      padding-left: 12px;
      padding-right: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 0 8px 8px;
    }

    .header-container {
      text-align: left;
      padding-left: 6px;
    }

    .callsign {
      font-size: 26px;
      font-weight: 700;
      color: #a0a0a0;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    h1.page-title {
      font-size: 40px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      margin: 0;
      line-height: 1.1;
    }

    .utc-time-display {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }

    .station-info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      min-height: 36px;
      visibility: hidden;
      width: 100%;
    }

    .station-location-text {
      font-size: 26px !important;
      font-weight: 700;
      color: #ff9800;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .local-time-display {
      font-size: 26px !important;
      font-weight: 700;
      color: #ff9800;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.2;
    }

    .scope-container {
      position: relative;
      width: 100%;
      height: 50px;
      background-color: rgba(5, 11, 5, 0.92);
      border: 1px solid rgba(28, 59, 28, 0.85);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.7);
      margin-bottom: 6px;
    }

    .scope-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 20px 10px;
      background-image:
        linear-gradient(to right, rgba(0, 255, 0, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
      pointer-events: none;
    }

    canvas#oscilloscope {
      display: block;
      width: 100%;
      height: 100%;
    }

    .audio-content-stats {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: none;
      margin-top: 4px;
      padding-left: 4px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      color: #a0a0a0;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .channels-indicator {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .meter-note {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ff9800;
      white-space: nowrap;
    }

    .debug-line {
      display: none;
      margin-top: 4px;
      font-size: 11px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      color: #8ab4ff;
      word-break: break-all;
    }

    .stat-term {
      transition: color 0.15s ease;
    }

    .stat-term.active-red {
      color: #ef4444 !important;
    }

    .stat-term.disable-gray {
      color: #555555;
    }

    .playlist-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: rgba(0, 0, 0, 0.65);
      padding: 18px 20px 24px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    }

    .channel-item {
      display: grid;
      grid-template-columns: 24px minmax(130px, 150px) 1fr;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      width: 100%;
      padding-left: 2px;
    }

    .radio-dot {
      width: 18px;
      height: 18px;
      border: 2px solid #777777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }

    .radio-dot::after {
      content: "";
      width: 8px;
      height: 8px;
      background-color: #ff9800;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .channel-item.active .radio-dot {
      border-color: #ff9800;
    }

    .channel-item.active .radio-dot::after {
      opacity: 1;
      transform: scale(1);
    }

    .channel-name {
      font-size: 20px;
      font-weight: 400;
      color: #d0d0d0;
      white-space: nowrap;
      transition: color 0.2s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .channel-item.active .channel-name {
      color: #ff9800;
      font-weight: 700;
    }

    .vu-container {
      --bar-h: 19px;            /* ความสูงแถบ VU (เดสก์ท็อป: ลดจาก 20px ลง 5%) */
      --label-h: 24px;          /* ความสูงแถวตัวเลขสเกล dB */
      /* ยกทั้งชุด (สเกล + แถบ + จุด LED) ขึ้น เพื่อให้แถบอยู่ระดับเดียวกับชื่อสถานี */
      transform: translateY(calc(-1 * (var(--label-h) + 4px) / 2));
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .channel-item.active .vu-container {
      opacity: 1;
    }

    .led-indicator {
      width: 8.8px;
      height: 8.8px;
      border-radius: 50%;
      background-color: #222222;
      flex-shrink: 0;
      align-self: flex-end;     /* ชิดล่างของแถว เพื่อไปอยู่ระดับเดียวกับแถบ VU */
      margin-bottom: calc((var(--bar-h) - 8.8px) / 2);  /* จัดกึ่งกลางแนวตั้งของแถบ */
      transition: background-color 0.05s ease, box-shadow 0.05s ease;
    }

    .vu-meter-panel {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .vu-scale-labels {
      display: flex;
      justify-content: space-between;
      position: relative;
      height: var(--label-h);
      font-size: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e0e0;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .scale-mark {
      position: absolute;
      transform: translateX(-50%);
    }

    .scale-mark.zero-db {
      color: #ffffff;
      font-weight: 700;
    }

    .vu-bar-bg {
      position: relative;
      width: 100%;
      height: var(--bar-h);
      background-color: rgba(17, 17, 17, 0.95);
      border: 1px solid #555555;
      border-radius: 2px;
      overflow: hidden;
    }

    .vu-grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: #555555;
      z-index: 2;
    }

    .vu-grid-line.zero-line {
      background-color: #aaaaaa;
    }

    .vu-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg,
        #22c55e 0%,
        #22c55e 78%,
        #ff9800 80%,
        #ef4444 100%);
      transition: width 0.04s ease-out;
      z-index: 1;
    }

    .page-version-footer {
      text-align: center;
      font-size: 12px;
      color: #666666;
      margin-top: 18px;
      letter-spacing: 0.5px;
    }

    audio, video {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 0 12px 16px 12px;
      }
      .sticky-header {
        padding-left: 8px;
        padding-right: 8px;
      }
      .callsign {
        font-size: 16px;
      }
      h1.page-title {
        font-size: 25px;
      }
      .utc-time-display {
        font-size: 16px;
      }
      .station-location-text,
      .local-time-display {
        font-size: 16px !important;
      }
      .channels-indicator {
        font-size: 14px;
      }
      .meter-note {
        font-size: 11px;
      }
      .playlist-container {
        padding: 14px 12px 18px 12px;
      }
      .channel-item {
        grid-template-columns: 22px 110px 1fr;
        gap: 8px;
        padding-left: 0;
      }
      .channel-name {
        font-size: 15px;
      }
      .vu-container {
        --bar-h: 14.25px;       /* มือถือ: ลดจาก 15px ลง 5% */
        --label-h: 16px;
      }
      .vu-scale-labels {
        font-size: 12px;
      }
      .scope-container {
        height: 40px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Fixed Section -->
  <div class="sticky-header">
    <div class="header-container">
      <div class="callsign">HS1WFK</div>

      <!-- Title Row + Realtime UTC Time -->
      <div class="title-row">
        <h1 class="page-title">International News</h1>
        <div class="utc-time-display" id="utc-clock">UTC --:--:--</div>
      </div>

      <!-- Station Location Row + Realtime Local Time -->
      <div class="station-info-row" id="station-info-row">
        <div class="station-location-text" id="station-location-text"></div>
        <div class="local-time-display" id="local-clock">Local Time --:--:--</div>
      </div>

      <!-- Oscilloscope Scope Under Title -->
      <div class="scope-container">
        <div class="scope-grid"></div>
        <canvas id="oscilloscope"></canvas>
      </div>

      <!-- Mono | Stereo + meter status -->
      <div class="audio-content-stats" id="audio-content-stats">
        <div class="stats-row">
          <div class="channels-indicator">
            CH:
            <span id="stat-mono" class="stat-term disable-gray">Mono</span>
            |
            <span id="stat-stereo" class="stat-term disable-gray">Stereo</span>
          </div>
          <div class="meter-note" id="meter-note"></div>
        </div>
        <div class="debug-line" id="debug-line"></div>
      </div>
    </div>
  </div>

  <div class="playlist-container" id="playlist"></div>

  <!-- Footer Version Text -->
  <div class="page-version-footer">ver.1.3.5</div>

  <video id="media-player" crossorigin="anonymous" playsinline webkit-playsinline></video>

  <script>
    const channels = [
      { name: "Al Jazeera", location: "Doha Qatar", tz: "Asia/Qatar", url: "https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8" },
      { name: "ABC Australia", location: "Sydney Australia", tz: "Australia/Sydney", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { name: "Arirang Korea", location: "Seoul South Korea", tz: "Asia/Seoul", url: "https://amdlive-ch02-ctnd-com.akamaized.net/arirang_2ch/smil:arirang_2ch.smil/playlist.m3u8" },
      { name: "BBC News", location: "London UK", tz: "Europe/London", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8" },
      { name: "CGTN", location: "Beijing China", tz: "Asia/Shanghai", url: "https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8" },
      { name: "CNA", location: "Singapore", tz: "Asia/Singapore", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8" },
      { name: "NHK English", location: "Tokyo Japan", tz: "Asia/Tokyo", url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
      { name: "DW En", location: "Berlin Germany", tz: "Europe/Berlin", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { name: "France 24 En", location: "Paris France", tz: "Europe/Paris", url: "https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8" },
      { name: "France 24 Fr", location: "Paris France", tz: "Europe/Paris", url: "https://live.france24.com/hls/live/2037179/F24_FR_HI_HLS/master_5000.m3u8" },
      { name: "GB News", location: "London UK", tz: "Europe/London", url: "https://cdn-apse1-prod.tsv2.amagi.tv/linear/amg01076-lightningintern-gbnewsnz-samsungnz/playlist.m3u8" },
      { name: "Tagesschau24", location: "Hamburg Germany", tz: "Europe/Berlin", url: "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8" },
      { name: "TPTV", location: "Bangkok Thailand", tz: "Asia/Bangkok", url: "https://tv-live.tpchannel.org/live/tv_1080p.m3u8?vhost=tv-live.tpchannel.org" }
    ];

    // สเกลบนหน้าจอ: db = ค่า VU, pos = ตำแหน่งเป็น % ของความกว้างแถบ
    const dbMarks = [
      { db: "-20", pos: 0 },
      { db: "-10", pos: 35 },
      { db: "-5", pos: 60 },
      { db: "0", pos: 80, isZero: true },
      { db: "+2", pos: 90 },
      { db: "+4", pos: 100 }
    ];

    /* ===== ค่าที่ปรับได้ ===== */
    const VU_REF_DBFS = -18;        // ระดับ dBFS ที่ถือเป็น 0 VU (ยิ่งต่ำ แถบยิ่งขึ้นง่าย)
    const SIGNAL_PEAK_MIN = 0.0005; // peak ต่ำกว่านี้ = ไม่มีสัญญาณเข้า analyser
    const SCOPE_GAIN = 2.5;         // ขยายความสูงคลื่นบน scope (เฉพาะการแสดงผล)
    const VU_WINDOW_SEC = 0.3;      // ช่วงเวลาเฉลี่ย RMS แบบ VU มาตรฐาน 300 ms
    const METER_OFFSET_SEC = 0;     // เลื่อนจังหวะมิเตอร์ (วินาที) ถ้าเห็นว่าเร็ว/ช้ากว่าเสียง
    const LOWEST_QUALITY = true;    // จำกัดให้ดึงสตรีมคุณภาพต่ำสุด ประหยัดข้อมูล เหมาะกับการฟังเป็นวิทยุ
    const SEG_KEEP_SEC = 20;        // เก็บข้อมูลมิเตอร์ย้อนหลังกี่วินาที
    const AUTO_SWITCH_MS = 4000;    // ถ้า analyser เงียบนานเท่านี้ ให้สลับไปโหมด segment
    const NOTE_DELAY_MS = 6000;     // รอกี่ ms ก่อนขึ้น NO METER DATA
    const DEBUG = /[?&]debug/.test(location.search);  // เปิดหน้าด้วย ?debug เพื่อดูสถานะมิเตอร์

    // ใส่ URL ของ proxy (Cloudflare Worker) เช่น 'https://news-proxy.yourname.workers.dev/'
    // ถ้าเว้นว่างไว้ จะเล่นทุกช่องโดยตรงเหมือนเดิม ช่องที่ตั้ง proxy: true จะผ่าน proxy เมื่อมีค่านี้เท่านั้น
    const PROXY_BASE = '';

    const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const playlistContainer = document.getElementById('playlist');
    const player = document.getElementById('media-player');
    const canvas = document.getElementById('oscilloscope');
    const canvasCtx = canvas.getContext('2d');

    const utcClockElem = document.getElementById('utc-clock');
    const localClockElem = document.getElementById('local-clock');
    const stationInfoRow = document.getElementById('station-info-row');
    const stationLocationText = document.getElementById('station-location-text');

    const statsPanel = document.getElementById('audio-content-stats');
    const statMono = document.getElementById('stat-mono');
    const statStereo = document.getElementById('stat-stereo');
    const meterNote = document.getElementById('meter-note');
    const debugLine = document.getElementById('debug-line');
    if (DEBUG) debugLine.style.display = 'block';

    let activeIndex = -1;
    let hls = null;
    let usingNative = false;

    let audioCtx = null;
    let analyser = null;     // สัญญาณรวม (โหมด analyser)
    let analyserL = null;    // ช่องซ้าย สำหรับตรวจ Mono/Stereo
    let analyserR = null;    // ช่องขวา
    let splitter = null;
    let sourceNode = null;
    let animFrameId = null;

    let currentLevel = 0;
    let stereoRatio = 0;

    // โหมดมิเตอร์: 'analyser' = Web Audio อ่านจาก element (Chrome/Firefox)
    //              'segments' = ถอดรหัสเสียงจากชิ้นสตรีมที่ hls.js ดึงมา (iOS / Safari)
    //              'none'     = วัดไม่ได้
    let meterMode = 'none';
    let sessionId = 0;
    let playStartedAt = 0;
    let silentSince = 0;

    // ข้อมูลโหมด segment
    let segEntries = [];
    let initSegs = {};
    let offlineCtx = null;
    let decodeQueue = 0;
    let decodeOk = 0;
    let decodeFail = 0;
    let lastError = '';
    let streamError = '';    // ข้อความแจ้งเมื่อโหลดสตรีมไม่ได้
    let streamDetail = '';   // รายละเอียด error จาก hls.js (ดูได้ใน ?debug)
    let netRetries = 0;
    const segTimeB = new Uint8Array(2048);

    function updateClocks() {
      const now = new Date();

      const utcHours = String(now.getUTCHours()).padStart(2, '0');
      const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
      const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
      utcClockElem.innerText = `UTC ${utcHours}:${utcMinutes}:${utcSeconds}`;

      if (activeIndex !== -1 && channels[activeIndex]?.tz) {
        try {
          const options = {
            timeZone: channels[activeIndex].tz,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          };
          const formatter = new Intl.DateTimeFormat('en-GB', options);
          localClockElem.innerText = `Local Time ${formatter.format(now)}`;
        } catch (e) {
          localClockElem.innerText = "Local Time --:--:--";
        }
      }
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    function resizeCanvas() {
      canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
      canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    channels.forEach((channel, index) => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.dataset.index = index;

      let scaleHtml = dbMarks.map(m =>
        `<span class="scale-mark ${m.isZero ? 'zero-db' : ''}" style="left: ${m.pos}%;">${m.db}</span>`
      ).join('');

      let gridHtml = dbMarks.map(m =>
        `<div class="vu-grid-line ${m.isZero ? 'zero-line' : ''}" style="left: ${m.pos}%;"></div>`
      ).join('');

      item.innerHTML = `
        <div class="radio-dot"></div>
        <span class="channel-name">${channel.name}</span>
        <div class="vu-container">
          <div class="led-indicator" id="led-${index}"></div>
          <div class="vu-meter-panel">
            <div class="vu-scale-labels">${scaleHtml}</div>
            <div class="vu-bar-bg">
              ${gridHtml}
              <div class="vu-bar-fill" id="vu-${index}"></div>
            </div>
          </div>
        </div>
      `;

      item.addEventListener('click', () => toggleChannel(index));
      playlistContainer.appendChild(item);
    });

    /* บน iOS ไม่ต่อ element เข้า Web Audio เลย เพราะ WebKit ส่งค่าศูนย์ให้ analyser เมื่อเล่น HLS
       (ทั้งแบบ native และแบบ hls.js + ManagedMediaSource) เสียงจึงเล่นตรงตามปกติ ไม่ผ่าน Web Audio */
    function initAudioContext() {
      if (IS_IOS) return;

      if (!audioCtx) {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();

          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0;

          analyserL = audioCtx.createAnalyser();
          analyserL.fftSize = 2048;
          analyserR = audioCtx.createAnalyser();
          analyserR.fftSize = 2048;

          splitter = audioCtx.createChannelSplitter(2);

          sourceNode = audioCtx.createMediaElementSource(player);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);

          sourceNode.connect(splitter);
          splitter.connect(analyserL, 0);
          splitter.connect(analyserR, 1);
        } catch (e) {
          console.log("AudioContext Notice:", e);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    player.addEventListener('playing', () => {
      if (activeIndex !== -1) {
        const currentChannel = channels[activeIndex];
        stationLocationText.innerText = `${currentChannel.name} - ${currentChannel.location}`;
        stationInfoRow.style.visibility = 'visible';
        updateClocks();
      }
    });

    function toggleChannel(index) {
      initAudioContext();

      const items = document.querySelectorAll('.channel-item');

      if (activeIndex === index) {
        stopAudio();
        items[index].classList.remove('active');
        resetVU(index);
        activeIndex = -1;
        return;
      }

      if (activeIndex !== -1) {
        items[activeIndex].classList.remove('active');
        resetVU(activeIndex);
      }

      stationInfoRow.style.visibility = 'hidden';

      activeIndex = index;
      items[index].classList.add('active');
      playAudio(resolveStreamUrl(channels[index]));
    }

    function resolveStreamUrl(ch) {
      if (ch.proxy && PROXY_BASE) {
        return PROXY_BASE + '?url=' + encodeURIComponent(ch.url);
      }
      return ch.url;
    }

    function showStreamError() {
      if (statsPanel) statsPanel.style.display = 'block';
      if (meterNote) meterNote.innerText = streamError;
      if (DEBUG && debugLine) debugLine.innerText = 'hls=' + streamDetail;
    }

    function onPlayStarted() {
      initAudioContext();
      playStartedAt = performance.now();
      silentSince = 0;
      startVUMeter();
    }

    /* ===== โหมด segment: ถอดรหัสเสียงจากชิ้นสตรีมที่ hls.js ส่งเข้า buffer ===== */

    function getOfflineCtx() {
      if (!offlineCtx) {
        const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        offlineCtx = new OAC(2, 1, 44100);
      }
      return offlineCtx;
    }

    function decodeBuffer(arrayBuffer) {
      return new Promise((resolve, reject) => {
        const p = getOfflineCtx().decodeAudioData(arrayBuffer, resolve, reject);
        if (p && typeof p.catch === 'function') p.catch(() => {});
      });
    }

    async function ingestSegment(sid, init, media, start) {
      if (decodeQueue >= 4) return;
      decodeQueue++;
      try {
        const joined = new Uint8Array(init.length + media.length);
        joined.set(init, 0);
        joined.set(media, init.length);

        const audio = await decodeBuffer(joined.buffer);
        if (sid !== sessionId) return;

        const n = audio.length;
        const rate = audio.sampleRate;
        const L = audio.getChannelData(0);
        const R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : null;
        const mono = new Float32Array(n);
        let sumDiff = 0, sumTotal = 0;
        for (let i = 0; i < n; i++) {
          const l = L[i];
          const r = R ? R[i] : l;
          mono[i] = (l + r) * 0.5;
          const d = l - r;
          sumDiff += d * d;
          sumTotal += l * l + r * r;
        }
        const stereo = R ? (sumDiff / (sumTotal + 1e-12) > 0.02) : false;

        segEntries.push({ start: start, end: start + n / rate, rate: rate, mono: mono, stereo: stereo });
        const cutoff = player.currentTime - SEG_KEEP_SEC;
        segEntries = segEntries.filter(e => e.end > cutoff).slice(-12);
        decodeOk++;
      } catch (e) {
        decodeFail++;
        lastError = ((e && e.name) ? e.name + ': ' : '') + ((e && e.message) ? e.message : String(e));
      } finally {
        decodeQueue--;
      }
    }

    function handleBufferAppending(sid, d) {
      if (sid !== sessionId) return;
      if (!d || !d.data || d.type === 'video') return;

      const u8 = (d.data instanceof Uint8Array) ? d.data : new Uint8Array(d.data);
      if (u8.length < 12) return;

      const tag = String.fromCharCode(u8[4], u8[5], u8[6], u8[7]);

      // init segment: เก็บไว้เสมอ เผื่อสลับเข้าโหมด segment ภายหลัง
      if (tag === 'ftyp' || tag === 'moov') {
        initSegs[d.type] = u8.slice();
        return;
      }

      if (meterMode !== 'segments') return;
      const init = initSegs[d.type];
      if (!init || !d.frag) return;

      const start = Number.isFinite(d.frag.startPTS) ? d.frag.startPTS : d.frag.start;
      if (!Number.isFinite(start)) return;

      ingestSegment(sid, init, u8.slice(), start);
    }

    function findSegEntry(t) {
      for (let i = segEntries.length - 1; i >= 0; i--) {
        const e = segEntries[i];
        if (t >= e.start && t < e.end) return e;
      }
      return null;
    }

    // คืนค่า { rms, stereo } ของเวลาที่กำลังเล่น พร้อมเติม segTimeB สำหรับ scope
    function segmentFrame() {
      const t = player.currentTime + METER_OFFSET_SEC;
      const e = findSegEntry(t);
      if (!e) return null;

      const idx = Math.min(e.mono.length - 1, Math.max(0, Math.floor((t - e.start) * e.rate)));
      const nVU = Math.max(1, Math.floor(VU_WINDOW_SEC * e.rate));
      const a = Math.max(0, idx - nVU);

      let sum = 0;
      for (let i = a; i <= idx; i++) {
        const v = e.mono[i];
        sum += v * v;
      }
      const rms = Math.sqrt(sum / (idx - a + 1));

      const N = segTimeB.length;
      for (let k = 0; k < N; k++) {
        const src = idx - N + 1 + k;
        const v = src >= 0 ? e.mono[src] : 0;
        segTimeB[k] = Math.max(0, Math.min(255, Math.round(128 + v * 127)));
      }
      return { rms: rms, stereo: e.stereo };
    }

    function resetSegmentMeter() {
      segEntries = [];
      initSegs = {};
      decodeQueue = 0;
      decodeOk = 0;
      decodeFail = 0;
      lastError = '';
      streamError = '';
      streamDetail = '';
      netRetries = 0;
    }

    /* ===== การเล่น ===== */

    function playAudio(url) {
      stopAudio(false);
      player.disableRemotePlayback = true;   // จำเป็นสำหรับ ManagedMediaSource บน iOS

      const sid = sessionId;

      if (window.Hls && Hls.isSupported()) {
        usingNative = false;
        meterMode = IS_IOS ? 'segments' : 'analyser';

        hls = new Hls({ enableWorker: true, startLevel: 0 });
        hls.loadSource(url);
        hls.attachMedia(player);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (LOWEST_QUALITY) hls.autoLevelCapping = 0;
          player.play().then(onPlayStarted)
            .catch(e => console.log("Play error:", e));
        });
        hls.on(Hls.Events.BUFFER_APPENDING, (event, data) => handleBufferAppending(sid, data));
        hls.on(Hls.Events.FRAG_LOADED, () => {
          if (sid !== sessionId) return;
          if (streamError) {
            streamError = '';
            streamDetail = '';
            if (meterNote) meterNote.innerText = '';
          }
          netRetries = 0;
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (sid !== sessionId) return;
          const code = (data.response && data.response.code) ? data.response.code : 0;
          if (data.fatal) {
            streamDetail = (data.details || data.type) + ' code=' + code;
            streamError = 'STREAM ERROR' + (code ? ' (HTTP ' + code + ')' : ' (CORS/NETWORK)');
            console.log("HLS error:", data);
          }
          if (!data.fatal) return;

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            if (++netRetries <= 3) {
              hls.startLoad();
            } else {
              hls.stopLoad();
              showStreamError();
            }
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
          } else {
            showStreamError();
          }
        });
      } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
        usingNative = true;   // เสียงออกได้ แต่มิเตอร์วัดไม่ได้บน iOS
        meterMode = IS_IOS ? 'none' : 'analyser';
        player.src = url;
        player.play().then(onPlayStarted)
          .catch(e => console.log("Play error:", e));
      }
    }

    function stopAudio(clearSrc = true) {
      sessionId++;
      player.pause();
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (hls) { hls.destroy(); hls = null; }
      if (clearSrc) {
        player.removeAttribute('src');
        player.load();
      }
      resetSegmentMeter();
      meterMode = 'none';
      silentSince = 0;
      currentLevel = 0;
      stereoRatio = 0;
      drawScopeFlat();

      stationInfoRow.style.visibility = 'hidden';
      if (statsPanel) statsPanel.style.display = 'none';
      if (meterNote) meterNote.innerText = '';
      if (debugLine) debugLine.innerText = '';
      statMono.className = 'stat-term disable-gray';
      statStereo.className = 'stat-term disable-gray';
    }

    /* แปลงค่า VU (dB) เป็นเปอร์เซ็นต์ตามสเกลที่วาดบนจอ */
    function vuToPercent(vu) {
      const first = parseFloat(dbMarks[0].db);
      const last = parseFloat(dbMarks[dbMarks.length - 1].db);
      if (vu <= first) return 0;
      if (vu >= last) return 100;
      for (let i = 1; i < dbMarks.length; i++) {
        const d1 = parseFloat(dbMarks[i].db);
        if (vu <= d1) {
          const d0 = parseFloat(dbMarks[i - 1].db);
          const p0 = dbMarks[i - 1].pos;
          const p1 = dbMarks[i].pos;
          return p0 + (vu - d0) / (d1 - d0) * (p1 - p0);
        }
      }
      return 100;
    }

    /* Oscilloscope: ใช้ค่าสูงสุดต่อแท่ง ไม่มีคลื่นจำลอง ถ้าไม่มีข้อมูลจริงวาดเส้นแบน */
    function drawScope(timeData, isPlaying) {
      const width = canvas.width;
      const height = canvas.height;
      const centerY = height / 2;

      canvasCtx.clearRect(0, 0, width, height);
      canvasCtx.lineWidth = 1.5 * (window.devicePixelRatio || 1);
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.shadowColor = '#22c55e';
      canvasCtx.shadowBlur = 4;

      if (!isPlaying || activeIndex === -1 || !timeData || timeData.length === 0) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, centerY);
        canvasCtx.lineTo(width, centerY);
        canvasCtx.stroke();
        return;
      }

      const numBars = 75;
      const barWidth = width / numBars;
      const step = Math.max(1, Math.floor(timeData.length / numBars));

      for (let i = 0; i < numBars; i++) {
        let peak = 0;
        for (let j = 0; j < step; j++) {
          const v = Math.abs((timeData[i * step + j] - 128) / 128.0);
          if (v > peak) peak = v;
        }
        const barHeight = Math.min(peak * SCOPE_GAIN, 1) * (height * 0.85);

        if (barHeight > 1) {
          canvasCtx.beginPath();
          canvasCtx.moveTo(i * barWidth, centerY - barHeight / 2);
          canvasCtx.lineTo(i * barWidth, centerY + barHeight / 2);
          canvasCtx.stroke();
        } else {
          canvasCtx.beginPath();
          canvasCtx.moveTo(i * barWidth, centerY);
          canvasCtx.lineTo(i * barWidth + 1, centerY);
          canvasCtx.stroke();
        }
      }
    }

    function drawScopeFlat() {
      drawScope(null, false);
    }

    /* ===== VU Meter + Scope ===== */
    function startVUMeter() {
      if (animFrameId) cancelAnimationFrame(animFrameId);

      const timeF = analyser ? new Float32Array(analyser.fftSize) : null;
      const timeB = analyser ? new Uint8Array(analyser.fftSize) : null;
      const bufL = analyserL ? new Float32Array(analyserL.fftSize) : null;
      const bufR = analyserR ? new Float32Array(analyserR.fftSize) : null;

      function update() {
        const nowMs = performance.now();
        const playing = !player.paused;
        let targetLevel = 0;
        let hasRealData = false;
        let scopeData = null;
        let stereoState = null;   // true / false / null (ไม่ทราบ)
        let peak = 0;

        if (meterMode === 'analyser' && analyser && timeF) {
          analyser.getFloatTimeDomainData(timeF);
          let sum = 0;
          for (let i = 0; i < timeF.length; i++) {
            const v = timeF[i];
            sum += v * v;
            const a = Math.abs(v);
            if (a > peak) peak = a;
          }
          hasRealData = peak > SIGNAL_PEAK_MIN;

          if (hasRealData) {
            const rms = Math.sqrt(sum / timeF.length);
            const vu = 20 * Math.log10(rms + 1e-9) - VU_REF_DBFS;
            targetLevel = vuToPercent(vu);
            analyser.getByteTimeDomainData(timeB);
            scopeData = timeB;

            if (bufL && bufR) {
              analyserL.getFloatTimeDomainData(bufL);
              analyserR.getFloatTimeDomainData(bufR);
              let sumDiff = 0, sumTotal = 0;
              for (let i = 0; i < bufL.length; i++) {
                const d = bufL[i] - bufR[i];
                sumDiff += d * d;
                sumTotal += bufL[i] * bufL[i] + bufR[i] * bufR[i];
              }
              stereoRatio = stereoRatio * 0.97 + (sumDiff / (sumTotal + 1e-12)) * 0.03;
              stereoState = stereoRatio > 0.02;
            }
          }

          // ถ้า analyser เงียบต่อเนื่อง (เช่น Safari บน Mac) ให้สลับไปโหมด segment เมื่อมี hls.js
          if (playing && hls && nowMs - playStartedAt > 2000) {
            if (hasRealData) {
              silentSince = 0;
            } else if (!silentSince) {
              silentSince = nowMs;
            } else if (nowMs - silentSince > AUTO_SWITCH_MS) {
              meterMode = 'segments';
              silentSince = 0;
            }
          }
        } else if (meterMode === 'segments') {
          const f = segmentFrame();
          if (f) {
            peak = 1;
            hasRealData = true;
            const vu = 20 * Math.log10(f.rms + 1e-9) - VU_REF_DBFS;
            targetLevel = vuToPercent(vu);
            scopeData = segTimeB;
            stereoState = f.stereo;
          }
        }

        // ballistics: ขึ้นเร็ว ลงช้า
        currentLevel += (targetLevel - currentLevel) * (targetLevel > currentLevel ? 0.5 : 0.08);

        if (activeIndex !== -1) {
          const vuFill = document.getElementById(`vu-${activeIndex}`);
          const led = document.getElementById(`led-${activeIndex}`);
          const noData = playing && !hasRealData && (nowMs - playStartedAt > NOTE_DELAY_MS);

          if (vuFill) vuFill.style.width = currentLevel.toFixed(1) + '%';

          if (led) {
            if (noData) {
              led.style.backgroundColor = '#ff9800';
              led.style.boxShadow = '0 0 6px #ff9800';
            } else if (currentLevel > 10) {
              led.style.backgroundColor = '#22c55e';
              led.style.boxShadow = '0 0 6px #22c55e';
            } else {
              led.style.backgroundColor = '#222222';
              led.style.boxShadow = 'none';
            }
          }

          if (statsPanel) {
            statsPanel.style.display = 'block';

            if (streamError) {
              meterNote.innerText = streamError;
            } else if (noData) {
              meterNote.innerText = usingNative ? 'NO METER DATA (native HLS)' : 'NO METER DATA';
            } else {
              meterNote.innerText = '';
            }

            if (stereoState === true) {
              statStereo.className = 'stat-term active-red';
              statMono.className = 'stat-term disable-gray';
            } else if (stereoState === false) {
              statMono.className = 'stat-term active-red';
              statStereo.className = 'stat-term disable-gray';
            } else if (!hasRealData) {
              statMono.className = 'stat-term disable-gray';
              statStereo.className = 'stat-term disable-gray';
            }

            if (DEBUG) {
              debugLine.innerText =
                `mode=${meterMode} ios=${IS_IOS} native=${usingNative} t=${player.currentTime.toFixed(1)} ` +
                `entries=${segEntries.length} ok=${decodeOk} fail=${decodeFail} peak=${peak.toFixed(4)} ` +
                `init=${Object.keys(initSegs).join(',') || '-'} err=${lastError || '-'} hls=${streamDetail || '-'}`;
            }
          }

          drawScope(hasRealData ? scopeData : null, playing);
        }

        animFrameId = requestAnimationFrame(update);
      }

      update();
    }

    function resetVU(index) {
      const vuFill = document.getElementById(`vu-${index}`);
      const led = document.getElementById(`led-${index}`);

      if (vuFill) vuFill.style.width = '0%';
      if (led) {
        led.style.backgroundColor = '#222222';
        led.style.boxShadow = 'none';
      }
    }

    drawScopeFlat();
  </script>
</body>
</html>
