      display: flex; 
      flex-direction: column;
      align-items: flex-start; 
      background: linear-gradient(145deg, #1f242d, #161a22); 
      padding: 8px 14px; 
      border-radius: 8px; 
      border: 1px solid #2d3748; 
      margin-bottom: 8px; 
      gap: 4px; 
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4), 0 2px 4px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 100;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    /* Left-aligned Title & Drop-shadow */
    .app-title { 
      font-size: 31px; 
      font-weight: bold; 
      color: #00d2ff; 
      cursor: pointer; 
      user-select: none; 
      text-shadow: 0 2px 8px rgba(0, 210, 255, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-title:active { opacity: 0.7; }

    /* Right-aligned UTC Clock on PC/iPad */
    .pc-utc-container {
      display: block;
      margin-left: auto;
      padding-right: 1ch;
    }

    .utc-clock { 
      font-size: 20px; 
      font-weight: bold; 
      color: #ffffff; 
      font-family: monospace; 
      white-space: nowrap; 
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      cursor: pointer;
      user-select: none;
      transition: color 0.3s ease;
    }
    .utc-clock.dimmed {
      color: #2e7d32 !important;
      text-shadow: none;
    }

    /* Sub-row containing WX Left-aligned (PC/iPad) */
    .header-sub-row {
      display: flex;
      align-items: center;
      font-size: 20px;
      white-space: nowrap;
      width: 100%;
      font-family: monospace;
    }

    /* Styling Gray Labels vs Dynamic Data Values */
    .wx-label { color: #a0aec0; }
    .wx-val { font-weight: 600; }
    .wx-sep { color: #a0aec0; margin: 0 2px; }

    /* White Trend Arrows matching UTC Color */
    .arrow-trend { color: #ffffff; font-size: 0.85em; margin-left: 1px; font-weight: normal; }

    .mobile-weather-row { display: none; }

    /* Table Container Default (iPad / PC) */
    .table-container { 
      width: 100%; 
      overflow-x: auto; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      max-height: calc(100vh - 100px); 
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .market-table { width: 100%; border-collapse: collapse; background: #181818; border-radius: 8px; overflow: hidden; }
    
    .market-table th, .market-table td { padding: 5px 10px; text-align: left; border-bottom: 1px solid #2a2a2a; vertical-align: middle; }

    .market-table th a { color: #888; }

    .zone-header { background: #1f2d3d !important; color: #00d2ff !important; font-weight: bold; font-size: 23px; text-transform: uppercase; padding: 5px 10px !important; }
    .zone-header a { color: #00d2ff !important; }

    .ex-name { font-weight: bold; font-size: 25px; }
    .ex-time { font-size: 23px; color: #aaa; font-weight: 500; }
    .blinking-name { animation: blink-red 1s infinite; color: #ff5252 !important; }

    .candle-counter { font-size: 23px; color: #aaa; font-weight: 500; margin-left: 8px; display: inline-block; }

    .led-dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .led-green { background-color: #4caf50; box-shadow: 0 0 8px #4caf50; }
    .led-red { background-color: #f44336; box-shadow: 0 0 8px #f44336; }
    .led-orange { background-color: #ff9800; box-shadow: 0 0 8px #ff9800; }

    .ib-container { position: relative; width: 100%; height: 38px; background-color: #2a2a2a; border-radius: 4px; overflow: hidden; }
    .ib-fill { height: 100%; background-color: #00d2ff; width: 0%; -webkit-transition: width 0.5s linear; transition: width 0.5s linear; }
    .ib-fill.ib-gray { background-color: #808080 !important; }
    .ib-fill.warning { background-color: #ff9800 !important; }
    
    .ib-overlay-text { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: flex-start; 
      padding-left: 12px; 
      font-size: 25px; 
      font-weight: bold; 
      color: #ffffff; 
      mix-blend-mode: difference; 
      white-space: nowrap; 
      z-index: 2; 
    }

    .status-close { color: #f44336; font-weight: bold; font-size: 25px; }
    .status-close-dark { color: #7f1d1d; font-weight: bold; font-size: 20px; }

    .tomorrow-close { color: #f44336; font-weight: bold; font-size: 20px; }

    .name-full { display: inline; }
    .name-short { display: none; }

      display: none;
      position: relative;
      width: 100%;
      height: calc(100vh - 100px);
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.8);
    }

    #videoPlayer {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

      const dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      return dirs[Math.round(deg / 45) % 8];
    }

    // Helper: Temperature Color Code (5 Standard Ranges)
    function getTempColor(temp) {
      if (temp === null || isNaN(temp)) return "#00d2ff";
      if (temp <= 1) return "#78909c";      // <= 1°C: Blue-Gray
      if (temp <= 11) return "#4dd0e1";     // 2-11°C: Cyan-Gray
      if (temp <= 21) return "#ffeb3b";     // 12-21°C: Yellow
      if (temp <= 31) return "#ff9800";     // 22-31°C: Orange
      return "#ff1744";                     // >= 32°C: Red
    }

    // Helper: UV Hazard Color Code (5 Standard Tiers)
    function getUvColor(uv) {
      if (uv === null || isNaN(uv)) return "#00d2ff";
      if (uv <= 2) return "#00e676";        // 0-2 Low: Green
      if (uv <= 5) return "#ffeb3b";        // 3-5 Moderate: Yellow
      if (uv <= 7) return "#ff6b00";        // 6-7 High: Bright Orange
      if (uv <= 10) return "#ff1744";       // 8-10 Very High: Bright Red
      return "#e040fb";                     // 11+ Extreme: Bright Purple
    }

    // Helper: White Arrow Trend HTML Generator
    function getTrendArrowHtml(curr, prev) {
      if (curr === null || prev === null || isNaN(curr) || isNaN(prev) || curr === prev) return "";
      if (curr > prev) return `<span class="arrow-trend">⬆︎</span>`;
      return `<span class="arrow-trend">⬇︎</span>`;
    }

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {

            weatherLon = pos.coords.longitude.toFixed(4);
            fetchWeather();
          },
          () => fetchWeather(),
          { timeout: 5000 }
        );
      } else {

      setInterval(fetchWeather, 300000);

    async function fetchWeather() {
      const pcElem = document.getElementById('weatherPC');
      const mobileElem = document.getElementById('weatherMobile');
      if (pcElem) pcElem.innerHTML = `<span class="wx-label">⏳ WX: Refreshing...</span>`;
      if (mobileElem) mobileElem.innerHTML = `<span>⏳</span> <span class="wx-label">WX: Refreshing...</span>`;

      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${weatherLat}&longitude=${weatherLon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,surface_pressure,wind_speed_10m,wind_direction_10m&hourly=uv_index&timezone=auto`;
        const res = await fetch(url);
        if (!res.ok) return;
        const data = await res.json();
        
        const c = data.current;
        const wInfo = wmoMap[c.weather_code] || { text: `Code ${c.weather_code}`, iconDay: "🌤", iconNight: "🌙" };
        const isDay = c.is_day === 1;

        let uvVal = null;
        if (data.hourly && data.hourly.uv_index) {
          const h = new Date().getHours();
          uvVal = data.hourly.uv_index[h] !== undefined ? data.hourly.uv_index[h] : null;
        }

        if (currentWxState.temp !== null) {
          prevWxState = { ...currentWxState };
        }

        currentWxState = {
          temp: c.temperature_2m,
          humidity: c.relative_humidity_2m,
          windSpeed: c.wind_speed_10m,
          windDir: c.wind_direction_10m,
          windCardinal: degreesToCardinal(c.wind_direction_10m),
          pressure: c.surface_pressure,
          uv: uvVal,
          condition: wInfo.text,
          icon: isDay ? wInfo.iconDay : wInfo.iconNight
        };

        renderWeatherUI();
      } catch (e) {
        console.error("Weather fetch failed", e);
      }
    }

    function speakText(text, pauseBeforeMs = 0) {

    function triggerScanReport() {
      const now = new Date();
      const optionsDay = { weekday: 'long' };
      const optionsDate = { month: 'long', day: 'numeric', year: 'numeric' };
      
      const dayStr = now.toLocaleDateString('en-US', optionsDay);
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });

      let openMarkets = [];

      markets.forEach(m => {
        const p = getZonedParts(now, m.timezone);
        const localMin = parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10);
        const dateStrIso = p.year + '-' + p.month + '-' + p.day;
        
        const thP = getZonedParts(now, "Asia/Bangkok");
        const thDay = thP.weekday;
        const isBkkWeekend = (thDay === 'Sat' || thDay === 'Sun');
        const isWeekend = m.isFutures ? isBkkWeekend : (p.weekday === 'Sat' || p.weekday === 'Sun');
        const isHoliday = m.holidays.indexOf(dateStrIso) !== -1;

        if (!isWeekend && !isHoliday) {
          const openMin = timeToMin(m.open);
          const closeMin = timeToMin(m.close);
          let isTrading = false;

          if (closeMin > openMin) {
            isTrading = (localMin >= openMin && localMin < closeMin);
          } else {
            isTrading = (localMin >= openMin || localMin < closeMin);
          }

          if (m.hasLunch) {
            const lStart = timeToMin(m.lunchStart);
            const lEnd = timeToMin(m.lunchEnd);
            if (localMin >= lStart && localMin < lEnd) isTrading = false;
          }

          if (isTrading) {

    function playMorsePattern(patternString, callback) {
      initAudioContext();
      if (!audioCtx || audioCtx.state !== 'running') {
        if (callback) callback();
        return;
      }

      const dotDuration = 0.12;
      const dashDuration = dotDuration * 3;
      const elementSpace = dotDuration;
      const charSpace = dotDuration * 3;

      let currentTime = audioCtx.currentTime + 0.05;

      for (let i = 0; i < patternString.length; i++) {
        const symbol = patternString[i];
        if (symbol === '.') {
          scheduleTone(currentTime, dotDuration);
          currentTime += dotDuration + elementSpace;
        } else if (symbol === '-') {
          scheduleTone(currentTime, dashDuration);
          currentTime += dashDuration + elementSpace;
        } else if (symbol === ' ') {
          currentTime += charSpace;
        }
      }

      if (callback) {
        const totalDuration = (currentTime - audioCtx.currentTime) * 1000;
        setTimeout(callback, totalDuration);
      }
    }

    function scheduleTone(startTime, duration) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 580; 
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      } catch (e) { console.error(e); }
    }

    function getZonedParts(date, timeZone) {
      try {
        const formatter = new Intl.DateTimeFormat('en-US', {
          timeZone: timeZone,
          hour12: false,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          weekday: 'short'
        });
        const parts = {};
        formatter.formatToParts(date).forEach(p => parts[p.type] = p.value);
        return parts;
      } catch(e) {
        return {
          hour: String(date.getHours()).padStart(2, '0'),
          minute: String(date.getMinutes()).padStart(2, '0'),
          second: String(date.getSeconds()).padStart(2, '0'),
          year: date.getFullYear(),
          month: String(date.getMonth() + 1).padStart(2, '0'),
          day: String(date.getDate()).padStart(2, '0'),
          weekday: 'Mon'
        };
      }
    }

    function timeToMin(timeStr) {
      const parts = timeStr.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

      const h = Math.floor(totalMinutes / 60);

    }

    function checkScheduledSpeechAnnouncements(now) {
      const thP = getZonedParts(now, "Asia/Bangkok");
      const currentHour = parseInt(thP.hour, 10);
      const currentMin = parseInt(thP.minute, 10);
      const currentSec = parseInt(thP.second, 10);
      const isWeekend = (thP.weekday === 'Sat' || thP.weekday === 'Sun');

      if (currentSec !== 55) return;

      let shouldAnnounce = false;
      let targetHour = currentHour;
      let targetMin = currentMin + 1;

      if (targetMin === 60) {
        targetMin = 0;
        targetHour = (targetHour + 1) % 24;
      }

      if (!isWeekend) {
        if (currentHour >= 9 && currentHour < 17) {
          if (currentMin === 14 || currentMin === 29 || currentMin === 44 || currentMin === 59) {
            shouldAnnounce = true;
          }
        } else if (currentHour >= 17 && currentHour < 20) {
          if (currentMin === 59) {
            shouldAnnounce = true;
          }
        }
      } else {
        if (currentHour >= 9 && currentHour < 20) {
          if (currentMin === 59) {
            shouldAnnounce = true;
          }
        }
      }

      if (shouldAnnounce) {
        const announceKey = `${targetHour}:${targetMin}`;
        if (lastTimeAnnouncedKey !== announceKey) {
          lastTimeAnnouncedKey = announceKey;
          
          playMorsePattern('-', () => {
            const hStr = String(targetHour).padStart(2, '0');
            const mStr = String(targetMin).padStart(2, '0');

          });
        }

    function updateEngine() {
      const now = new Date();
      const isMobile = window.innerWidth <= 600;

      const utcHM = now.toISOString().substr(11, 8);
      const utcText = 'UTC ' + utcHM;

      const utcHeaderElem = document.getElementById('utcClockHeader');
      utcHeaderElem.innerText = utcText;

      checkScheduledSpeechAnnouncements(now);

      const thP = getZonedParts(now, "Asia/Bangkok");
      const thMin = parseInt(thP.hour, 10) * 60 + parseInt(thP.minute, 10);
      const thDateStr = thP.year + '-' + thP.month + '-' + thP.day;
      const isThWeekend = (thP.weekday === 'Sat' || thP.weekday === 'Sun');
      const tfexHolidays = ["2026-01-01","2026-03-03","2026-04-06","2026-04-13","2026-04-14","2026-04-15","2026-05-01","2026-05-04","2026-06-03","2026-07-28","2026-07-29","2026-08-12","2026-10-13","2026-10-23","2026-12-07","2026-12-10","2026-12-31"];
      const isThHoliday = tfexHolidays.indexOf(thDateStr) !== -1;

      let isTfexTrading = false;
      let isTfexBreak = false;
      let isNightSession = false;
      let remainingTfexMinutes = 0;

      const dayOpen = timeToMin("09:45");
      const dayClose = timeToMin("16:55");
      const dayLunchStart = timeToMin("12:30");
      const dayLunchEnd = timeToMin("13:45");
      
      const nightOpen = timeToMin("18:45");
      const nightClose = timeToMin("03:00");

      const tfexFullElem = document.getElementById('name-full-TFEX');
      const tfexShortElem = document.getElementById('name-short-TFEX');

      if (!isThWeekend && !isThHoliday) {
        if (thMin >= nightOpen || thMin < nightClose) {
          isNightSession = true;
          isTfexTrading = true;
          if (thMin >= nightOpen) {
            remainingTfexMinutes = (1440 - thMin) + nightClose;
          } else {
            remainingTfexMinutes = nightClose - thMin;
          }
        } 
        else if (thMin >= dayLunchStart && thMin < dayLunchEnd) {
          isTfexBreak = true;
          remainingTfexMinutes = dayClose - dayLunchEnd;
        } 
        else if (thMin >= dayOpen && thMin < dayClose) {
          isTfexTrading = true;
          if (thMin < dayLunchStart) {
            remainingTfexMinutes = (dayLunchStart - thMin) + (dayClose - dayLunchEnd);
          } else {
            remainingTfexMinutes = dayClose - thMin;
          }
        }
      }

      if (tfexFullElem && tfexShortElem) {
        if (isNightSession || (thMin >= dayClose && thMin < nightOpen)) {
          tfexFullElem.innerText = "TFEX GO/FX";
          tfexShortElem.innerText = "TFEX Night";
        } else {
          tfexFullElem.innerText = "TFEX S50/GO/FX";
          tfexShortElem.innerText = "TFEX Day";
        }
      }

      const count1mElem = document.getElementById('candle-count-1m');
      const count5mElem = document.getElementById('candle-count-5m');
      if (count1mElem && count5mElem) {
        if (isTfexTrading || isTfexBreak) {
          count1mElem.innerText = remainingTfexMinutes;
          count5mElem.innerText = Math.ceil(remainingTfexMinutes / 5);
        } else {
          count1mElem.innerText = "0";
          count5mElem.innerText = "0";
        }
      }

      let closing5mList = [];
      let anyMarketOpen = false;

      markets.forEach(m => {
        const p = getZonedParts(now, m.timezone);
        const localHM = p.hour + ':' + p.minute;
        const localMin = parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10);
        const dateStr = p.year + '-' + p.month + '-' + p.day;

        document.getElementById('time-' + m.code).innerText = localHM;

        // Tomorrow Check
        const tomDate = new Date(now.getTime() + 24 * 60 * 60 * 1000);
        const tomP = getZonedParts(tomDate, m.timezone);
        const tomDateStr = tomP.year + '-' + tomP.month + '-' + tomP.day;
        const isTomWeekend = (tomP.weekday === 'Sat' || tomP.weekday === 'Sun');
        const isTomHoliday = m.holidays.indexOf(tomDateStr) !== -1;
        const tomCell = document.getElementById('tomorrow-' + m.code);

        if (isTomWeekend || isTomHoliday) {
          tomCell.innerText = "Close";
          tomCell.className = "tomorrow-close";
        } else {
          tomCell.innerText = "Normal";
          tomCell.className = "tomorrow-normal";
        }

        // Today Weekend Check
        const isBkkWeekend = (thP.weekday === 'Sat' || thP.weekday === 'Sun');
        const isTodayWeekend = m.isFutures ? isBkkWeekend : (p.weekday === 'Sat' || p.weekday === 'Sun');
        const isTodayHoliday = m.holidays.indexOf(dateStr) !== -1;
        const statusCell = document.getElementById('status-' + m.code);

        if (!marketStateTracker[m.code]) {
          marketStateTracker[m.code] = { state: 'UNKNOWN' };
        }

        const closedWeekendText = isMobile ? 'CLOSED' : 'CLOSED, weekend';
        const closedHolidayText = isMobile ? 'CLOSED' : 'CLOSED, holiday';

        if (isTodayWeekend) {
          statusCell.innerHTML = `<span class="status-close-dark">${closedWeekendText}</span>`;
          setLedState(m.code, 'red');
          marketStateTracker[m.code].state = 'CLOSED';
          return;
        } else if (isTodayHoliday) {
          statusCell.innerHTML = `<span class="status-close-dark">${closedHolidayText}</span>`;
          setLedState(m.code, 'red');
          marketStateTracker[m.code].state = 'CLOSED';
          return;
        }

        // Processing TFEX Row
        if (m.code === 'TFEX') {
          let currentState = 'CLOSED';
          if (isTfexTrading) { currentState = 'OPEN'; anyMarketOpen = true; }
          else if (isTfexBreak) { currentState = 'BREAK'; }

          if (marketStateTracker[m.code].state !== 'UNKNOWN' && marketStateTracker[m.code].state !== currentState) {
            if (currentState === 'OPEN') playMorsePattern('---');
            else if (currentState === 'BREAK') playMorsePattern('...-');
            else if (currentState === 'CLOSED') playMorsePattern('...- ...-');
            if (currentState === 'OPEN' || currentState === 'CLOSED') triggerFlashingAlert(m.code);
          }
          marketStateTracker[m.code].state = currentState;

          if (isTfexTrading) {
            let totalSession = isNightSession ? (1440 - nightOpen + nightClose) : (dayClose - dayOpen);
            let pct = Math.max(0, Math.min(100, (remainingTfexMinutes / totalSession) * 100));
            let isWarning = remainingTfexMinutes <= 30;

            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill ${isWarning ? 'warning' : ''}" style="width: ${pct}%;"></div>
                <div class="ib-overlay-text">Close in ${formatHM(remainingTfexMinutes)}</div>
              </div>
            `;
            setLedState(m.code, 'green');

            if (remainingTfexMinutes <= 5 && remainingTfexMinutes > 0 && !announcedClosingMarkets.includes("TFEX")) {
              closing5mList.push("TFEX");
              announcedClosingMarkets.push("TFEX");
            }
          } else if (isTfexBreak) {
            let remBreak = dayLunchEnd - localMin;
            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill" style="width: 50%;"></div>
                <div class="ib-overlay-text blinking-text">Break, Open in ${formatHM(remBreak)}</div>
              </div>
            `;
            setLedState(m.code, 'orange');
          } else {
            if (localMin >= dayClose && localMin < nightOpen) {
              let diffNight = nightOpen - localMin;
              let colorClass = diffNight <= 60 ? 'status-close' : 'status-close-dark';
              let textNight = isMobile ? ('Night Open in ' + formatHM(diffNight)) : ('Day Closed, Night Open in ' + formatHM(diffNight));
              statusCell.innerHTML = '<span class="' + colorClass + '">' + textNight + '</span>';
            } else {
              let diffDay = 0;
              if (localMin < dayOpen) diffDay = dayOpen - localMin;
              else diffDay = (1440 - localMin) + dayOpen;
              let colorClass = diffDay <= 60 ? 'status-close' : 'status-close-dark';
              let textDay = isMobile ? ('Day Open in ' + formatHM(diffDay)) : ('Closed, Day Open in ' + formatHM(diffDay));
              statusCell.innerHTML = '<span class="' + colorClass + '">' + textDay + '</span>';
            }
            setLedState(m.code, 'red');
          }
          return;
        }

        // Standard Market Processing
        const openMin = timeToMin(m.open);
        const closeMin = timeToMin(m.close);
        const totalSession = closeMin > openMin ? (closeMin - openMin) : (1440 - openMin + closeMin);

        let isTradingNow = false;
        if (closeMin > openMin) isTradingNow = (localMin >= openMin && localMin < closeMin);
        else isTradingNow = (localMin >= openMin || localMin < closeMin);

        let isLunch = false;
        if (m.hasLunch) {
          const lStart = timeToMin(m.lunchStart);
          const lEnd = timeToMin(m.lunchEnd);
          if (localMin >= lStart && localMin < lEnd) isLunch = true;
        }

        let currentState = 'CLOSED';
        if (isTradingNow && !isLunch) { currentState = 'OPEN'; anyMarketOpen = true; }
        else if (isLunch) { currentState = 'BREAK'; }

        if (marketStateTracker[m.code].state !== 'UNKNOWN' && marketStateTracker[m.code].state !== currentState) {
          if (currentState === 'OPEN') playMorsePattern('---');
          else if (currentState === 'BREAK') playMorsePattern('...-');
          else if (currentState === 'CLOSED') playMorsePattern('...- ...-');
          if (currentState === 'OPEN' || currentState === 'CLOSED') triggerFlashingAlert(m.code);
        }
        marketStateTracker[m.code].state = currentState;

        if (!isTradingNow) {
          let diff = 0;
          if (localMin < openMin) diff = openMin - localMin;
          else diff = (1440 - localMin) + openMin;
          const colorClass = diff <= 60 ? 'status-close' : 'status-close-dark';
          const openText = isMobile ? ('Open in ' + formatHM(diff)) : ('Closed, Open in ' + formatHM(diff));
          statusCell.innerHTML = '<span class="' + colorClass + '">' + openText + '</span>';
          setLedState(m.code, 'red');
          announcedClosingMarkets = announcedClosingMarkets.filter(item => item !== m.name);
        } else {
          if (isLunch) {
            const lEnd = timeToMin(m.lunchEnd);
            const remLunch = lEnd - localMin;
            let remainingTotal = closeMin > localMin ? (closeMin - localMin) : (1440 - localMin + closeMin);
            const pct = Math.max(0, Math.min(100, (remainingTotal / totalSession) * 100));

            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill" style="width: ${pct}%;"></div>
                <div class="ib-overlay-text blinking-text">Break, Open in ${formatHM(remLunch)}</div>
              </div>
            `;
            setLedState(m.code, 'orange');
          } else {
            let remaining = closeMin > localMin ? (closeMin - localMin) : (1440 - localMin + closeMin);
            const pct = Math.max(0, Math.min(100, (remaining / totalSession) * 100));
            const isWarning = remaining <= 30;

            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill ${isWarning ? 'warning' : ''}" style="width: ${pct}%;"></div>
                <div class="ib-overlay-text">Close in ${formatHM(remaining)}</div>
              </div>
            `;
            setLedState(m.code, 'green');

            if (remaining <= 5 && remaining > 0 && !announcedClosingMarkets.includes(m.name)) {
              closing5mList.push(m.name);
              announcedClosingMarkets.push(m.name);
            }
          }
        }
      });

      // ==========================================================
      // ⏱ DYNAMIC MARKET STATUS & AUTOMATIC SWITCH LOGIC (v2.5.2)
      // ==========================================================
      if (!anyMarketOpen) {
        // 🛑 ALL MARKETS CLOSED MODE
        utcHeaderElem.classList.add('dimmed');

        if (!isVideoModeActive) {
          // Viewing Exchange Table -> Count up to 3 mins (180s) then switch to Video
          allClosedSeconds++;
          if (allClosedSeconds >= 180 && !isMobile) {
            switchDisplayMode(true);
          }
        }
      } else {
        // 🟢 MARKET ACTIVE MODE
        utcHeaderElem.classList.remove('dimmed');
        allClosedSeconds = 0; // Reset closed timer

        if (isVideoModeActive) {
          // Viewing Video while Markets are Active -> Count up to 3 mins (180s) then switch back to Exchange Table
          videoActiveSeconds++;
          if (videoActiveSeconds >= 180 && !isMobile) {
            switchDisplayMode(false);
          }
        }
      }

      // TFEX SPECIAL CYCLES
      const tfexP = getZonedParts(now, "Asia/Bangkok");
      const currentSec = now.getSeconds();
      const currentMin = now.getMinutes();

      const tfex1Cell = document.getElementById('status-TFEX-1M');
      const tfex5Cell = document.getElementById('status-TFEX-5M');

      if (isTfexBreak || !isTfexTrading) {
        tfex1Cell.innerHTML = '';
        tfex5Cell.innerHTML = '';
        setLedState('TFEX-1M', isTfexBreak ? 'orange' : 'red');
        setLedState('TFEX-5M', isTfexBreak ? 'orange' : 'red');
      } else {
        const remSec1M = 60 - currentSec;
        const pct1M = (remSec1M / 60) * 100;
        
        tfex1Cell.innerHTML = `
          <div class="ib-container">
            <div class="ib-fill ib-gray ${remSec1M <= 10 ? 'warning' : ''}" style="width: ${pct1M}%;"></div>
          </div>
        `;

        const secIn5M = (currentMin % 5) * 60 + currentSec;
        const remSec5M = 300 - secIn5M;
        const pct5M = (remSec5M / 300) * 100;

        tfex5Cell.innerHTML = `
          <div class="ib-container">
            <div class="ib-fill ib-gray ${remSec5M <= 30 ? 'warning' : ''}" style="width: ${pct5M}%;"></div>
          </div>
        `;

        setLedState('TFEX-1M', 'green');
        setLedState('TFEX-5M', 'green');

        if (currentSec === 0 && lastTfex1mSec !== 0) {
          if (currentMin % 5 === 0) playMorsePattern('-');
          else playMorsePattern('.');
        }
      }
      lastTfex1mSec = currentSec;

      // Announce 5-minute closing warnings
      if (closing5mList.length === 1) {
        speakText(`Attention please, attention`);
        setTimeout(() => {
          speakText(`${closing5mList[0]} is closing in 5 minutes`);
        }, 1000);
      } else if (closing5mList.length > 1) {
        speakText(`Attention please, attention`);
        setTimeout(() => {
          speakText(`The ${closing5mList.join(", ")} will be closed within 5 minutes from now`);
        }, 1000);
      }
    }

    initTable();
    initWeather();
    updateEngine();
    setInterval(updateEngine, 1000);
  </script>
</body>
</html>
