<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exchange Times v1.7.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 8px 12px; display: flex; flex-direction: column; justify-content: flex-start; }
    
    /* Top Header */
    .header-panel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 8px 12px; border-radius: 6px; border: 1px solid #333; margin-bottom: 6px; gap: 8px; flex-shrink: 0; }
    .app-title { font-size: 24px; font-weight: bold; color: #00d2ff; }
    .utc-clock { font-size: 22px; font-weight: bold; color: #ffffff; }
    .controls { display: flex; gap: 12px; font-size: 18px; align-items: center; flex-wrap: wrap; }
    .controls label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
    
    /* Dynamic Audio Button Styles */
    .audio-btn { background: #f44336; color: #ffffff; border: none; padding: 6px 14px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 18px; transition: background 0.3s; }
    .audio-btn.active { background: #4caf50; color: #ffffff; }

    /* Table Container */
    .table-container { width: 100%; flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    .market-table { width: 100%; border-collapse: collapse; background: #181818; border-radius: 6px; overflow: hidden; height: 100%; }
    .market-table th, .market-table td { padding: 3px 8px; text-align: left; border-bottom: 1px solid #2a2a2a; vertical-align: middle; }
    .market-table th { background: #252525; color: #888; font-size: 16px; text-transform: uppercase; }
    
    .zone-header { background: #1f2d3d !important; color: #00d2ff !important; font-weight: bold; font-size: 18px; text-transform: uppercase; padding: 2px 8px !important; }
    
    .ex-name-container { display: flex; align-items: center; gap: 8px; }
    .ex-name { font-weight: bold; font-size: 19px; }
    .ex-time { font-size: 18px; color: #aaa; font-weight: 500; }
    .blinking-name { animation: blink-red 1s infinite; color: #ff5252 !important; }

    /* Candle Stick Counter Badge */
    .candle-counter { font-size: 18px; color: #aaa; font-weight: 500; margin-right: 4px; min-width: 32px; display: inline-block; }

    /* LED Status Indicator */
    .led-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .led-green { background-color: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .led-red { background-color: #f44336; box-shadow: 0 0 6px #f44336; }
    .led-orange { background-color: #ff9800; box-shadow: 0 0 6px #ff9800; }

    /* Responsive Display Logic */
    .name-full { display: inline; }
    .name-short { display: none; }

    @media screen and (max-width: 480px) {
      .name-full { display: none; }
      .name-short { display: inline; }
      .market-table th, .market-table td { padding: 2px 4px; }
    }

    /* Indicator Bar (IB) Styles */
    .ib-container { position: relative; width: 100%; height: 33px; background-color: #2a2a2a; border-radius: 4px; overflow: hidden; }
    .ib-fill { height: 100%; background-color: #00d2ff; width: 0%; -webkit-transition: width 0.5s linear; transition: width 0.5s linear; }
    .ib-fill.ib-gray { background-color: #808080 !important; }
    .ib-fill.warning { background-color: #ff9800 !important; }
    
    /* Dynamic Contrast Text Overlay */
    .ib-overlay-text { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: flex-start; 
      padding-left: 10px; 
      font-size: 20px; 
      font-weight: bold; 
      color: #ffffff; 
      mix-blend-mode: difference; 
      white-space: nowrap; 
      z-index: 2; 
    }

    /* Statuses */
    .status-open { color: #4caf50; font-weight: bold; font-size: 19px; }
    .status-close { color: #f44336; font-weight: bold; font-size: 19px; }
    .status-close-dark { color: #7f1d1d; font-weight: bold; font-size: 19px; }

    /* Tomorrow Status Styles */
    .tomorrow-normal { color: #2e7d32; font-weight: bold; font-size: 15px; }
    .tomorrow-close { color: #f44336; font-weight: bold; font-size: 15px; }

    .blinking-text { animation: blink-anim 1s infinite; }

    @keyframes blink-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes blink-red { 0%, 100% { color: #ff5252; } 50% { color: #ffffff; } }
  </style>
</head>
<body>

  <!-- Top Navigation Panel -->
  <div class="header-panel">
    <div class="app-title">Exchange Times <span style="font-size: 15px; color: #888;">v1.7.0</span></div>
    <div class="utc-clock" id="utcClock">UTC Now: --:--:--</div>
    <div class="controls">
      <button id="btnAudio" class="audio-btn" onclick="enableAudio()">Alert?</button>
      <label><input type="checkbox" id="muteExchange" checked> Exchange</label>
      <label><input type="checkbox" id="muteTFEX" checked> TFEX</label>
    </div>
  </div>

  <!-- Market Table Wrapper -->
  <div class="table-container">
    <table class="market-table">
      <thead>
        <tr>
          <th style="width: 15%;">TIME</th>
          <th style="width: 28%;">EXCHANGE</th>
          <th style="width: 42%;">STATUS</th>
          <th style="width: 15%;">TOMORROW</th>
        </tr>
      </thead>
      <tbody id="marketRows">
        <!-- Rows populated dynamically -->
      </tbody>
    </table>
  </div>

  <script>
    const markets = [
      // THAILAND (TOP)
      { zone: "THAILAND", code: "SET", shortName: "SET", name: "Thailand (SET)", timezone: "Asia/Bangkok", open: "10:00", close: "16:30", hasLunch: true, lunchStart: "12:30", lunchEnd: "14:00", holidays: ["2026-01-01","2026-03-03","2026-04-06","2026-04-13","2026-04-14","2026-04-15","2026-05-01","2026-05-04","2026-06-03","2026-07-28","2026-07-29","2026-08-12","2026-10-13","2026-10-23","2026-12-07","2026-12-10","2026-12-31"] },
      { zone: "THAILAND", code: "TFEX", shortName: "TFEX", name: "TFEX (Thailand Futures)", timezone: "Asia/Bangkok", open: "09:45", close: "16:55", hasLunch: true, lunchStart: "12:30", lunchEnd: "13:45", holidays: ["2026-01-01","2026-03-03","2026-04-06","2026-04-13","2026-04-14","2026-04-15","2026-05-01","2026-05-04","2026-06-03","2026-07-28","2026-07-29","2026-08-12","2026-10-13","2026-10-23","2026-12-07","2026-12-10","2026-12-31"] },

      // ASIA
      { zone: "ASIA", code: "ASX", shortName: "ASX", name: "Australia ASX", timezone: "Australia/Sydney", open: "10:00", close: "16:00", hasLunch: false, holidays: ["2026-01-01","2026-01-26","2026-04-03","2026-04-06","2026-04-25","2026-06-08","2026-12-25","2026-12-26"] },
      { zone: "ASIA", code: "TSE", shortName: "NIKKEI", name: "NIKKEI (Tokyo)", timezone: "Asia/Tokyo", open: "09:00", close: "15:00", hasLunch: true, lunchStart: "11:30", lunchEnd: "12:30", holidays: ["2026-01-01","2026-01-12","2026-02-11","2026-02-23","2026-03-20","2026-04-29","2026-05-03","2026-05-04","2026-05-05","2026-07-20","2026-09-21","2026-09-23","2026-10-12","2026-11-03","2026-11-23"] },
      { zone: "ASIA", code: "KRX", shortName: "KOSPI", name: "KOSPI (Korea)", timezone: "Asia/Seoul", open: "09:00", close: "15:30", hasLunch: false, holidays: ["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-03-01","2026-05-05","2026-05-24","2026-06-06","2026-08-15","2026-09-24","2026-09-25","2026-09-26","2026-10-03","2026-10-09","2026-12-25","2026-12-31"] },
      { zone: "ASIA", code: "HKEX", shortName: "HSI", name: "HANG SENG (Hong Kong)", timezone: "Asia/Hong_Kong", open: "09:30", close: "16:00", hasLunch: true, lunchStart: "12:00", lunchEnd: "13:00", holidays: ["2026-01-01","2026-02-17","2026-02-18","2026-02-19","2026-04-03","2026-04-06","2026-04-30","2026-05-01","2026-05-25","2026-07-01","2026-09-26","2026-10-01","2026-10-19","2026-12-25","2026-12-26"] },
      { zone: "ASIA", code: "SSE", shortName: "SSE", name: "Shanghai (China)", timezone: "Asia/Shanghai", open: "09:30", close: "15:00", hasLunch: true, lunchStart: "11:30", lunchEnd: "13:00", holidays: ["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-04-05","2026-05-01","2026-06-19","2026-09-25","2026-10-01","2026-10-02","2026-10-05","2026-10-06","2026-10-07"] },
      { zone: "ASIA", code: "TWSE", shortName: "TWSE", name: "Taiwan Weighted", timezone: "Asia/Taipei", open: "09:00", close: "13:30", hasLunch: false, holidays: ["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-02-28","2026-04-04","2026-04-05","2026-05-01","2026-06-19","2026-09-25","2026-10-10"] },
      { zone: "ASIA", code: "HOSE", shortName: "HOSE", name: "Vietnam (HOSE)", timezone: "Asia/Ho_Chi_Minh", open: "09:00", close: "15:00", hasLunch: true, lunchStart: "11:30", lunchEnd: "13:00", holidays: ["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-04-26","2026-04-30","2026-05-01","2026-09-02"] },
      
      // EUROPE
      { zone: "EUROPE", code: "LSE", shortName: "FTSE", name: "FTSE (London)", timezone: "Europe/London", open: "08:00", close: "16:30", hasLunch: false, holidays: ["2026-01-01","2026-04-03","2026-04-06","2026-05-04","2026-05-25","2026-08-31","2026-12-25","2026-12-28"] },
      { zone: "EUROPE", code: "XETRA", shortName: "DAX", name: "DAX (Frankfurt)", timezone: "Europe/Berlin", open: "09:00", close: "17:30", hasLunch: false, holidays: ["2026-01-01","2026-04-03","2026-04-06","2026-05-01","2026-12-24","2026-12-25","2026-12-26","2026-12-31"] },
      { zone: "EUROPE", code: "PAR", shortName: "CAC", name: "CAC (Euronext Paris)", timezone: "Europe/Paris", open: "09:00", close: "17:30", hasLunch: false, holidays: ["2026-01-01","2026-04-03","2026-04-06","2026-05-01","2026-12-25","2026-12-26"] },
      
      // USA
      { zone: "USA", code: "NYSE", shortName: "NYSE", name: "NYSE (New York)", timezone: "America/New_York", open: "09:30", close: "16:00", hasLunch: false, holidays: ["2026-01-01","2026-01-19","2026-02-16","2026-04-03","2026-05-25","2026-06-19","2026-07-03","2026-09-07","2026-11-26","2026-12-25"] }
    ];

    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function enableAudio() {
      initAudioContext();
      const btn = document.getElementById('btnAudio');
      btn.innerText = "Alert On";
      btn.classList.add('active');
    }

    document.addEventListener('touchstart', function() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
        const btn = document.getElementById('btnAudio');
        btn.innerText = "Alert On";
        btn.classList.add('active');
      }
    }, { once: true });

    function playBeep(count = 1, duration = 0.15, interval = 0.1, isLong = false) {
      initAudioContext();
      if (!audioCtx || audioCtx.state !== 'running') return;
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 520;
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            const dur = isLong ? duration * 2.5 : duration;
            osc.stop(audioCtx.currentTime + dur);
          } catch (e) { console.error(e); }
        }, i * (duration + interval) * 1000);
      }
    }

    function getZonedParts(date, timeZone) {
      try {
        const formatter = new Intl.DateTimeFormat('en-US', {
          timeZone: timeZone,
          hour12: false,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          weekday: 'short'
        });
        const parts = {};
        formatter.formatToParts(date).forEach(p => parts[p.type] = p.value);
        return parts;
      } catch(e) {
        return {
          hour: String(date.getHours()).padStart(2, '0'),
          minute: String(date.getMinutes()).padStart(2, '0'),
          second: String(date.getSeconds()).padStart(2, '0'),
          year: date.getFullYear(),
          month: String(date.getMonth() + 1).padStart(2, '0'),
          day: String(date.getDate()).padStart(2, '0'),
          weekday: 'Mon'
        };
      }
    }

    function timeToMin(timeStr) {
      const parts = timeStr.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function formatHM(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.floor(totalMinutes % 60);
      return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
    }

    function setLedState(code, state) {
      const led = document.getElementById(`led-${code}`);
      if (!led) return;
      led.className = `led-dot led-${state}`;
    }

    function initTable() {
      const tbody = document.getElementById('marketRows');
      tbody.innerHTML = '';
      let currentZone = '';

      markets.forEach(m => {
        if (m.zone !== currentZone) {
          currentZone = m.zone;
          tbody.innerHTML += '<tr><td colspan="4" class="zone-header">' + currentZone + ' MARKETS</td></tr>';
        }

        tbody.innerHTML += `
          <tr id="row-${m.code}">
            <td class="ex-time" id="time-${m.code}">--:--</td>
            <td class="ex-name" id="name-${m.code}">
              <div class="ex-name-container">
                <span class="led-dot led-red" id="led-${m.code}"></span>
                <span class="name-full">${m.name}</span>
                <span class="name-short">${m.shortName}</span>
              </div>
            </td>
            <td id="status-${m.code}">--</td>
            <td id="tomorrow-${m.code}">--</td>
          </tr>
        `;

        if (m.code === 'TFEX') {
          tbody.innerHTML += `
            <tr id="row-TFEX-1M">
              <td class="ex-time" id="time-TFEX-1M">--:--</td>
              <td class="ex-name">
                <div class="ex-name-container">
                  <span class="candle-counter" id="candle-count-1m">--</span>
                  <span class="led-dot led-red" id="led-TFEX-1M"></span>
                  <span class="name-full">TFEX (1 นาที)</span>
                  <span class="name-short">TFEX 1m</span>
                </div>
              </td>
              <td id="status-TFEX-1M">--</td>
              <td class="tomorrow-normal">Normal</td>
            </tr>
            <tr id="row-TFEX-5M">
              <td class="ex-time" id="time-TFEX-5M">--:--</td>
              <td class="ex-name">
                <div class="ex-name-container">
                  <span class="candle-counter" id="candle-count-5m">--</span>
                  <span class="led-dot led-red" id="led-TFEX-5M"></span>
                  <span class="name-full">TFEX (5 นาที)</span>
                  <span class="name-short">TFEX 5m</span>
                </div>
              </td>
              <td id="status-TFEX-5M">--</td>
              <td class="tomorrow-normal">Normal</td>
            </tr>
          `;
        }
      });
    }

    const soundStates = {};
    let lastTfex1mSec = -1;

    function updateEngine() {
      const now = new Date();

      const utcHM = now.toISOString().substr(11, 8);
      document.getElementById('utcClock').innerText = 'UTC Now: ' + utcHM;

      const muteEx = !document.getElementById('muteExchange').checked;
      const muteTfex = !document.getElementById('muteTFEX').checked;

      // Direct calculation for TFEX Trading Status in Thailand Zone
      const thP = getZonedParts(now, "Asia/Bangkok");
      const thMin = parseInt(thP.hour, 10) * 60 + parseInt(thP.minute, 10);
      const thDateStr = thP.year + '-' + thP.month + '-' + thP.day;
      const isThWeekend = (thP.weekday === 'Sat' || thP.weekday === 'Sun');
      const tfexHolidays = ["2026-01-01","2026-03-03","2026-04-06","2026-04-13","2026-04-14","2026-04-15","2026-05-01","2026-05-04","2026-06-03","2026-07-28","2026-07-29","2026-08-12","2026-10-13","2026-10-23","2026-12-07","2026-12-10","2026-12-31"];
      const isThHoliday = tfexHolidays.indexOf(thDateStr) !== -1;

      let isTfexTrading = false;
      let isTfexBreak = false;
      let remainingTfexMinutes = 0;

      const tfexOpenMin = timeToMin("09:45");
      const tfexCloseMin = timeToMin("16:55");
      const tfexLunchStart = timeToMin("12:30");
      const tfexLunchEnd = timeToMin("13:45");

      if (!isThWeekend && !isThHoliday) {
        if (thMin >= tfexLunchStart && thMin < tfexLunchEnd) {
          isTfexBreak = true;
          // ช่วงพักกลางวัน: เหลือนาทีของภาคบ่ายเต็มจำนวน (13:45 - 16:55 = 190 นาที)
          remainingTfexMinutes = tfexCloseMin - tfexLunchEnd;
        } else if (thMin >= tfexOpenMin && thMin < tfexCloseMin) {
          isTfexTrading = true;
          if (thMin < tfexLunchStart) {
            // ช่วงเช้า: เหลือนาทีภาคเช้า + นาทีภาคบ่าย
            remainingTfexMinutes = (tfexLunchStart - thMin) + (tfexCloseMin - tfexLunchEnd);
          } else {
            // ช่วงบ่าย: เหลือนาทีภาคบ่าย
            remainingTfexMinutes = tfexCloseMin - thMin;
          }
        }
      }

      // อัปเดตตัวเลข Candle Stick Countdown
      const count1mElem = document.getElementById('candle-count-1m');
      const count5mElem = document.getElementById('candle-count-5m');
      if (count1mElem && count5mElem) {
        if (isTfexTrading || isTfexBreak) {
          count1mElem.innerText = remainingTfexMinutes;
          count5mElem.innerText = Math.ceil(remainingTfexMinutes / 5);
        } else {
          count1mElem.innerText = "0";
          count5mElem.innerText = "0";
        }
      }

      markets.forEach(m => {
        const p = getZonedParts(now, m.timezone);
        const localHM = p.hour + ':' + p.minute;
        const localMin = parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10);
        const localSec = parseInt(p.second, 10);
        const dateStr = p.year + '-' + p.month + '-' + p.day;

        document.getElementById('time-' + m.code).innerText = localHM;

        // Tomorrow Check
        const tomDate = new Date(now.getTime() + 24 * 60 * 60 * 1000);
        const tomP = getZonedParts(tomDate, m.timezone);
        const tomDateStr = tomP.year + '-' + tomP.month + '-' + tomP.day;
        const isTomWeekend = (tomP.weekday === 'Sat' || tomP.weekday === 'Sun');
        const isTomHoliday = m.holidays.indexOf(tomDateStr) !== -1;
        const tomCell = document.getElementById('tomorrow-' + m.code);

        if (isTomWeekend || isTomHoliday) {
          tomCell.innerText = "Close";
          tomCell.className = "tomorrow-close";
        } else {
          tomCell.innerText = "Normal";
          tomCell.className = "tomorrow-normal";
        }

        // Today Check
        const isTodayWeekend = (p.weekday === 'Sat' || p.weekday === 'Sun');
        const isTodayHoliday = m.holidays.indexOf(dateStr) !== -1;
        const statusCell = document.getElementById('status-' + m.code);
        const nameCell = document.getElementById('name-' + m.code);

        if (isTodayWeekend || isTodayHoliday) {
          statusCell.innerHTML = '<span class="status-close">CLOSED (Holiday/Weekend)</span>';
          nameCell.classList.remove('blinking-name');
          setLedState(m.code, 'red');
          return;
        }

        const openMin = timeToMin(m.open);
        const closeMin = timeToMin(m.close);
        const totalSession = closeMin - openMin;

        if (!soundStates[m.code]) soundStates[m.code] = {};

        if (localMin < openMin) {
          const diff = openMin - localMin;
          const colorClass = diff > 60 ? 'status-close-dark' : 'status-close';
          statusCell.innerHTML = '<span class="' + colorClass + '">Closed, Open in ' + formatHM(diff) + '</span>';
          nameCell.classList.remove('blinking-name');
          setLedState(m.code, 'red');
        } else if (localMin >= openMin && localMin < closeMin) {
          let isLunch = false;
          if (m.hasLunch) {
            const lStart = timeToMin(m.lunchStart);
            const lEnd = timeToMin(m.lunchEnd);
            if (localMin >= lStart && localMin < lEnd) {
              isLunch = true;
              const remLunch = lEnd - localMin;
              const remainingTotal = closeMin - localMin;
              const pct = Math.max(0, Math.min(100, (remainingTotal / totalSession) * 100));

              statusCell.innerHTML = `
                <div class="ib-container">
                  <div class="ib-fill" style="width: ${pct}%;"></div>
                  <div class="ib-overlay-text blinking-text">Break, Open in ${formatHM(remLunch)}</div>
                </div>
              `;
              nameCell.classList.remove('blinking-name');
              setLedState(m.code, 'orange');
            }
          }

          if (!isLunch) {
            const remaining = closeMin - localMin;
            const pct = Math.max(0, Math.min(100, (remaining / totalSession) * 100));
            const isWarning = remaining <= 30;

            if (remaining <= 5) {
              nameCell.classList.add('blinking-name');
            } else {
              nameCell.classList.remove('blinking-name');
            }

            if (localMin === openMin && localSec === 0 && !soundStates[m.code].opened && !muteEx) {
              playBeep(1, 0.6, 0.1, true);
              soundStates[m.code].opened = true;
            }

            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill ${isWarning ? 'warning' : ''}" style="width: ${pct}%;"></div>
                <div class="ib-overlay-text">Close in ${formatHM(remaining)}</div>
              </div>
            `;
            setLedState(m.code, 'green');
          }
        } else {
          const nextDayOpenDiff = (24 * 60 - localMin) + openMin;
          const colorClass = nextDayOpenDiff > 60 ? 'status-close-dark' : 'status-close';
          statusCell.innerHTML = '<span class="' + colorClass + '">Closed, Open in ' + formatHM(nextDayOpenDiff) + '</span>';
          nameCell.classList.remove('blinking-name');
          setLedState(m.code, 'red');
        }
      });

      // TFEX SPECIAL CYCLES (1 Min & 5 Min)
      const tfexP = getZonedParts(now, "Asia/Bangkok");
      const tfexHM = tfexP.hour + ':' + tfexP.minute;
      document.getElementById('time-TFEX-1M').innerText = tfexHM;
      document.getElementById('time-TFEX-5M').innerText = tfexHM;

      const currentSec = now.getSeconds();
      const currentMin = now.getMinutes();

      const tfex1Cell = document.getElementById('status-TFEX-1M');
      const tfex5Cell = document.getElementById('status-TFEX-5M');

      if (isTfexBreak) {
        tfex1Cell.innerHTML = '<span class="status-close blinking-text">Break</span>';
        tfex5Cell.innerHTML = '<span class="status-close blinking-text">Break</span>';
        setLedState('TFEX-1M', 'orange');
        setLedState('TFEX-5M', 'orange');
      } else if (!isTfexTrading) {
        tfex1Cell.innerHTML = '<span class="status-close">Closed</span>';
        tfex5Cell.innerHTML = '<span class="status-close">Closed</span>';
        setLedState('TFEX-1M', 'red');
        setLedState('TFEX-5M', 'red');
      } else {
        // TFEX 1 Min Bar Render (Bar Only)
        const remSec1M = 60 - currentSec;
        const pct1M = (remSec1M / 60) * 100;
        
        tfex1Cell.innerHTML = `
          <div class="ib-container">
            <div class="ib-fill ib-gray ${remSec1M <= 10 ? 'warning' : ''}" style="width: ${pct1M}%;"></div>
          </div>
        `;

        // TFEX 5 Min Bar Render (Bar Only)
        const secIn5M = (currentMin % 5) * 60 + currentSec;
        const remSec5M = 300 - secIn5M;
        const pct5M = (remSec5M / 300) * 100;

        tfex5Cell.innerHTML = `
          <div class="ib-container">
            <div class="ib-fill ib-gray ${remSec5M <= 30 ? 'warning' : ''}" style="width: ${pct5M}%;"></div>
          </div>
        `;

        setLedState('TFEX-1M', 'green');
        setLedState('TFEX-5M', 'green');

        // AUDIO ALERTS TRIGGER FOR TFEX CYCLES
        if (currentSec === 0 && lastTfex1mSec !== 0) {
          if (!muteTfex) {
            if (currentMin % 5 === 0) {
              playBeep(2, 0.15, 0.1, false);
            } else {
              playBeep(1, 0.15, 0.1, false);
            }
          }
        }
      }
      lastTfex1mSec = currentSec;
    }

    initTable();
    updateEngine();
    setInterval(updateEngine, 1000);
  </script>
</body>
</html>
