<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <title>Exchange Times v2.2.1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 8px 12px; }
    
    /* General Hyperlink Styles */
    a { color: inherit; text-decoration: none; transition: opacity 0.2s; }
    a:hover { opacity: 0.8; text-decoration: underline; }

    /* Top Header Default (iPad / PC) */
    .header-panel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #1e1e1e; padding: 10px 14px; border-radius: 6px; border: 1px solid #333; margin-bottom: 8px; gap: 8px; }
    .app-title { font-size: 31px; font-weight: bold; color: #00d2ff; cursor: pointer; user-select: none; }
    .app-title:active { opacity: 0.7; }
    .utc-clock { font-size: 28px; font-weight: bold; color: #ffffff; }
    .utc-clock a { color: #ffffff; }
    .controls { display: flex; gap: 14px; font-size: 23px; align-items: center; flex-wrap: wrap; }
    .controls label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
    
    .audio-btn { background: #f44336; color: #ffffff; border: none; padding: 8px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 23px; transition: background 0.3s; }
    .audio-btn.active { background: #4caf50; color: #ffffff; }

    /* Table Container Default (iPad / PC) */
    .table-container { width: 100%; overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; max-height: calc(100vh - 85px); }
    .market-table { width: 100%; border-collapse: collapse; background: #181818; border-radius: 6px; overflow: hidden; }
    
    .market-table th, .market-table td { padding: 5px 10px; text-align: left; border-bottom: 1px solid #2a2a2a; vertical-align: middle; }
    .market-table th { background: #252525; color: #888; font-size: 21px; text-transform: uppercase; position: sticky; top: 0; z-index: 10; padding: 6px 10px; }
    .market-table th a { color: #888; }

    .zone-header { background: #1f2d3d !important; color: #00d2ff !important; font-weight: bold; font-size: 23px; text-transform: uppercase; padding: 5px 10px !important; }
    .zone-header a { color: #00d2ff !important; }

    .ex-name-container { display: flex; align-items: center; gap: 10px; }
    .ex-name { font-weight: bold; font-size: 25px; }
    .ex-time { font-size: 23px; color: #aaa; font-weight: 500; }
    .blinking-name { animation: blink-red 1s infinite; color: #ff5252 !important; }

    .candle-counter { font-size: 23px; color: #aaa; font-weight: 500; margin-left: 8px; display: inline-block; }

    .led-dot { width: 15px; height: 15px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .led-green { background-color: #4caf50; box-shadow: 0 0 8px #4caf50; }
    .led-red { background-color: #f44336; box-shadow: 0 0 8px #f44336; }
    .led-orange { background-color: #ff9800; box-shadow: 0 0 8px #ff9800; }

    .ib-container { position: relative; width: 100%; height: 38px; background-color: #2a2a2a; border-radius: 4px; overflow: hidden; }
    .ib-fill { height: 100%; background-color: #00d2ff; width: 0%; -webkit-transition: width 0.5s linear; transition: width 0.5s linear; }
    .ib-fill.ib-gray { background-color: #808080 !important; }
    .ib-fill.warning { background-color: #ff9800 !important; }
    
    .ib-overlay-text { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: flex-start; 
      padding-left: 12px; 
      font-size: 25px; 
      font-weight: bold; 
      color: #ffffff; 
      mix-blend-mode: difference; 
      white-space: nowrap; 
      z-index: 2; 
    }

    .status-open { color: #4caf50; font-weight: bold; font-size: 25px; }
    .status-close { color: #f44336; font-weight: bold; font-size: 25px; }
    .status-close-dark { color: #7f1d1d; font-weight: bold; font-size: 25px; }

    .tomorrow-normal { color: #2e7d32; font-weight: bold; font-size: 20px; }
    .tomorrow-close { color: #f44336; font-weight: bold; font-size: 20px; }

    /* Display Responsive Switching */
    .name-full { display: inline; }
    .name-short { display: none; }

    /* 📱 MOBILE / IPHONE OVERRIDE */
    @media screen and (max-width: 600px) {
      body { padding: 6px; }
      .header-panel { padding: 8px 10px; margin-bottom: 6px; }
      
      .app-title { font-size: 20px !important; font-weight: 800 !important; }
      .utc-clock { font-size: 18px !important; font-weight: 800 !important; }
      
      .controls { font-size: 13px; gap: 8px; }
      .audio-btn { font-size: 13px; padding: 4px 8px; }

      .table-container { max-height: calc(100vh - 65px); }
      .market-table th, .market-table td { padding: 4px 6px; }
      .market-table th { font-size: 13px; padding: 4px 6px; }
      
      .zone-header { font-size: 14px; padding: 3px 6px !important; }
      
      .ex-name-container { gap: 5px; }
      .ex-name { font-size: 14px; }
      .ex-time { font-size: 13px; }

      .candle-counter { font-size: 13px; margin-left: 4px; }
      .led-dot { width: 9px; height: 9px; }

      .ib-container { height: 24px; }
      
      .ib-overlay-text { font-size: 16px !important; padding-left: 6px; }
      .status-open, .status-close, .status-close-dark { font-size: 16px !important; }
      .tomorrow-normal, .tomorrow-close { font-size: 12px; }

      .name-full { display: none; }
      .name-short { display: inline; }
    }

    @keyframes blink-anim { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes blink-red { 0%, 100% { color: #ff5252; } 50% { color: #ffffff; } }

    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function enableAudio() {
      initAudioContext();
      const btn = document.getElementById('btnAudio');
      btn.innerText = "Alert On";
      btn.classList.add('active');
    }

    document.addEventListener('touchstart', function() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
        const btn = document.getElementById('btnAudio');
        btn.innerText = "Alert On";
        btn.classList.add('active');
      }
    }, { once: true });

    // Morse Code Engine (Fundamental 1:3 Dit-to-Dash Ratio Standard)
    function playMorsePattern(patternString, callback) {
      initAudioContext();
      if (!audioCtx || audioCtx.state !== 'running') return;

      const dotDuration = 0.08;              // 1 unit (Dit)
      const dashDuration = dotDuration * 3;  // 3 units (Dash = 0.24s)
      const elementSpace = dotDuration;      // 1 unit between elements
      const charSpace = dotDuration * 3;     // 3 units between letters (0.24s)

      let currentTime = audioCtx.currentTime + 0.05;

      for (let i = 0; i < patternString.length; i++) {
        const symbol = patternString[i];
        if (symbol === '.') {
          scheduleTone(currentTime, dotDuration);
          currentTime += dotDuration + elementSpace;
        } else if (symbol === '-') {
          scheduleTone(currentTime, dashDuration);
          currentTime += dashDuration + elementSpace;
        } else if (symbol === ' ') {
          currentTime += charSpace;
        }
      }

      if (callback) {
        const totalDuration = (currentTime - audioCtx.currentTime) * 1000;
        setTimeout(callback, totalDuration);
      }
    }

    function scheduleTone(startTime, duration) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 580; 
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      } catch (e) { console.error(e); }
    }

    // Sound Test Sequence (Title Click Switch): O -> V -> VV -> E -> T
    function runSoundTest() {
      enableAudio();
      // O (Open: ---)
      playMorsePattern('---', () => {
        setTimeout(() => {
          // V (Break: ...-)
          playMorsePattern('...-', () => {
            setTimeout(() => {
              // VV (Close: ...- ...-)
              playMorsePattern('...- ...-', () => {
                setTimeout(() => {
                  // E (1m: .)
                  playMorsePattern('.', () => {
                    setTimeout(() => {
                      // T (5m: -)
                      playMorsePattern('-');
                    }, 350);
                  });
                }, 350);
              });
            }, 350);
          });
        }, 350);
      });
    }

    function getZonedParts(date, timeZone) {
      try {
        const formatter = new Intl.DateTimeFormat('en-US', {
          timeZone: timeZone,
          hour12: false,
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          weekday: 'short'
        });
        const parts = {};
        formatter.formatToParts(date).forEach(p => parts[p.type] = p.value);
        return parts;
      } catch(e) {
        return {
          hour: String(date.getHours()).padStart(2, '0'),
          minute: String(date.getMinutes()).padStart(2, '0'),
          second: String(date.getSeconds()).padStart(2, '0'),
          year: date.getFullYear(),
          month: String(date.getMonth() + 1).padStart(2, '0'),
          day: String(date.getDate()).padStart(2, '0'),
          weekday: 'Mon'
        };
      }
    }

    function timeToMin(timeStr) {
      const parts = timeStr.split(':');
      return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function formatHM(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = Math.floor(totalMinutes % 60);
      return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
    }

      const led = document.getElementById(`led-${code}`);
      if (!led) return;
      led.className = `led-dot led-${state}`;

      const nameElem = document.getElementById('name-' + code);
      if (!nameElem) return;
      nameElem.classList.add('blinking-name');
      setTimeout(() => {
        nameElem.classList.remove('blinking-name');
      }, 60000); // Flashes for 1 minute (60,000ms)

            <td class="ex-name" id="name-${m.code}">
              <div class="ex-name-container">
                <span class="led-dot led-red" id="led-${m.code}"></span>
                <span class="name-full" id="name-full-${m.code}">${nameFullContent}</span>
                <span class="name-short" id="name-short-${m.code}">${nameShortContent}</span>
              </div>
            </td>
            <td id="status-${m.code}">--</td>
            <td id="tomorrow-${m.code}">--</td>
          </tr>
        `;

        if (m.code === 'TFEX') {
          tbody.innerHTML += `
            <tr id="row-TFEX-1M">
              <td class="ex-time" id="time-TFEX-1M">--:--</td>
              <td class="ex-name">
                <div class="ex-name-container">
                  <span class="led-dot led-red" id="led-TFEX-1M"></span>
                  <span class="name-full">TFEX 1 นาที</span>
                  <span class="name-short">TFEX 1m</span>
                  <span class="candle-counter" id="candle-count-1m">--</span>
                </div>
              </td>
              <td id="status-TFEX-1M">--</td>
              <td class="tomorrow-normal">Normal</td>
            </tr>
            <tr id="row-TFEX-5M">
              <td class="ex-time" id="time-TFEX-5M">--:--</td>
              <td class="ex-name">
                <div class="ex-name-container">
                  <span class="led-dot led-red" id="led-TFEX-5M"></span>
                  <span class="name-full">TFEX 5 นาที</span>
                  <span class="name-short">TFEX 5m</span>
                  <span class="candle-counter" id="candle-count-5m">--</span>
                </div>
              </td>
              <td id="status-TFEX-5M">--</td>
              <td class="tomorrow-normal">Normal</td>
            </tr>
          `;
        }
      });
    }

    let lastTfex1mSec = -1;

    function updateEngine() {
      const now = new Date();
      const isMobile = window.innerWidth <= 600;

      const utcHM = now.toISOString().substr(11, 8);
      document.getElementById('utcClock').innerText = 'UTC: ' + utcHM;

      const muteEx = !document.getElementById('muteExchange').checked;
      const muteTfex = !document.getElementById('muteTFEX').checked;

      // Direct calculation for TFEX Day & Night Trading Status
      const thP = getZonedParts(now, "Asia/Bangkok");
      const thMin = parseInt(thP.hour, 10) * 60 + parseInt(thP.minute, 10);
      const thSec = parseInt(thP.second, 10);
      const thDateStr = thP.year + '-' + thP.month + '-' + thP.day;
      const isThWeekend = (thP.weekday === 'Sat' || thP.weekday === 'Sun');
      const tfexHolidays = ["2026-01-01","2026-03-03","2026-04-06","2026-04-13","2026-04-14","2026-04-15","2026-05-01","2026-05-04","2026-06-03","2026-07-28","2026-07-29","2026-08-12","2026-10-13","2026-10-23","2026-12-07","2026-12-10","2026-12-31"];
      const isThHoliday = tfexHolidays.indexOf(thDateStr) !== -1;

      let isTfexTrading = false;
      let isTfexBreak = false;
      let isNightSession = false;
      let remainingTfexMinutes = 0;

      const dayOpen = timeToMin("09:45");
      const dayClose = timeToMin("16:55");
      const dayLunchStart = timeToMin("12:30");
      const dayLunchEnd = timeToMin("13:45");
      
      const nightOpen = timeToMin("18:45");
      const nightClose = timeToMin("03:00");

      const tfexFullElem = document.getElementById('name-full-TFEX');
      const tfexShortElem = document.getElementById('name-short-TFEX');

      if (!isThWeekend && !isThHoliday) {
        if (thMin >= nightOpen || thMin < nightClose) {
          isNightSession = true;
          isTfexTrading = true;
          if (thMin >= nightOpen) {
            remainingTfexMinutes = (1440 - thMin) + nightClose;
          } else {
            remainingTfexMinutes = nightClose - thMin;
          }
        } 
        else if (thMin >= dayLunchStart && thMin < dayLunchEnd) {
          isTfexBreak = true;
          remainingTfexMinutes = dayClose - dayLunchEnd;
        } 
        else if (thMin >= dayOpen && thMin < dayClose) {
          isTfexTrading = true;
          if (thMin < dayLunchStart) {
            remainingTfexMinutes = (dayLunchStart - thMin) + (dayClose - dayLunchEnd);
          } else {
            remainingTfexMinutes = dayClose - thMin;
          }
        }
      }

      if (tfexFullElem && tfexShortElem) {
        if (isNightSession || (thMin >= dayClose && thMin < nightOpen)) {
          tfexFullElem.innerText = "TFEX GO/FX";
          tfexShortElem.innerText = "TFEX Night";
        } else {
          tfexFullElem.innerText = "TFEX S50/GO/FX";
          tfexShortElem.innerText = "TFEX Day";
        }
      }

      const count1mElem = document.getElementById('candle-count-1m');
      const count5mElem = document.getElementById('candle-count-5m');
      if (count1mElem && count5mElem) {
        if (isTfexTrading || isTfexBreak) {
          count1mElem.innerText = remainingTfexMinutes;
          count5mElem.innerText = Math.ceil(remainingTfexMinutes / 5);
        } else {
          count1mElem.innerText = "0";
          count5mElem.innerText = "0";
        }
      }

      markets.forEach(m => {
        const p = getZonedParts(now, m.timezone);
        const localHM = p.hour + ':' + p.minute;
        const localMin = parseInt(p.hour, 10) * 60 + parseInt(p.minute, 10);
        const localSec = parseInt(p.second, 10);
        const dateStr = p.year + '-' + p.month + '-' + p.day;

        document.getElementById('time-' + m.code).innerText = localHM;

        // Tomorrow Check
        const tomDate = new Date(now.getTime() + 24 * 60 * 60 * 1000);
        const tomP = getZonedParts(tomDate, m.timezone);
        const tomDateStr = tomP.year + '-' + tomP.month + '-' + tomP.day;
        const isTomWeekend = (tomP.weekday === 'Sat' || tomP.weekday === 'Sun');
        const isTomHoliday = m.holidays.indexOf(tomDateStr) !== -1;
        const tomCell = document.getElementById('tomorrow-' + m.code);

        if (isTomWeekend || isTomHoliday) {
          tomCell.innerText = "Close";
          tomCell.className = "tomorrow-close";
        } else {
          tomCell.innerText = "Normal";
          tomCell.className = "tomorrow-normal";
        }

        // Today Check
        const isTodayWeekend = (p.weekday === 'Sat' || p.weekday === 'Sun');
        const isTodayHoliday = m.holidays.indexOf(dateStr) !== -1;
        const statusCell = document.getElementById('status-' + m.code);
        const nameCell = document.getElementById('name-' + m.code);

        if (!marketStateTracker[m.code]) {
          marketStateTracker[m.code] = { state: 'UNKNOWN' };
        }

        if (isTodayWeekend || isTodayHoliday) {
          statusCell.innerHTML = '<span class="status-close-dark">CLOSED (Holiday/Weekend)</span>';
          setLedState(m.code, 'red');
          marketStateTracker[m.code].state = 'CLOSED';
          return;
        }

        // Processing TFEX Row
        if (m.code === 'TFEX') {
          let currentState = 'CLOSED';
          if (isTfexTrading) currentState = 'OPEN';
          else if (isTfexBreak) currentState = 'BREAK';

          // AUDIO & FLASHING TRIGGERS FOR TFEX
          if (localSec === 0 && marketStateTracker[m.code].state !== 'UNKNOWN') {
            const prevState = marketStateTracker[m.code].state;
            if (prevState !== currentState) {
              if (!muteEx) {
                if (currentState === 'OPEN') {
                  playMorsePattern('---'); // Morse 'O' for Open
                } else if (currentState === 'BREAK') {
                  playMorsePattern('...-'); // Morse 'V' for Break
                } else if (currentState === 'CLOSED') {
                  playMorsePattern('...- ...-'); // Morse 'V V' for Close
                }
              }
              if (currentState === 'OPEN' || currentState === 'CLOSED') {
                triggerFlashingAlert(m.code);
              }
            }
          }
          marketStateTracker[m.code].state = currentState;

          if (isTfexTrading) {
            let totalSession = isNightSession ? (1440 - nightOpen + nightClose) : (dayClose - dayOpen);
            let pct = Math.max(0, Math.min(100, (remainingTfexMinutes / totalSession) * 100));
            let isWarning = remainingTfexMinutes <= 30;

            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill ${isWarning ? 'warning' : ''}" style="width: ${pct}%;"></div>
                <div class="ib-overlay-text">Close in ${formatHM(remainingTfexMinutes)}</div>
              </div>
            `;
            setLedState(m.code, 'green');
          } else if (isTfexBreak) {
            let remBreak = dayLunchEnd - localMin;
            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill" style="width: 50%;"></div>
                <div class="ib-overlay-text blinking-text">Break, Open in ${formatHM(remBreak)}</div>
              </div>
            `;
            setLedState(m.code, 'orange');
          } else {
            if (localMin >= dayClose && localMin < nightOpen) {
              let diffNight = nightOpen - localMin;
              let colorClass = diffNight <= 60 ? 'status-close' : 'status-close-dark';
              let textNight = isMobile ? ('Night Open in ' + formatHM(diffNight)) : ('Day Closed, Night Open in ' + formatHM(diffNight));
              statusCell.innerHTML = '<span class="' + colorClass + '">' + textNight + '</span>';
            } else {
              let diffDay = 0;
              if (localMin < dayOpen) {
                diffDay = dayOpen - localMin;
              } else {
                diffDay = (1440 - localMin) + dayOpen;
              }
              let colorClass = diffDay <= 60 ? 'status-close' : 'status-close-dark';
              let textDay = isMobile ? ('Day Open in ' + formatHM(diffDay)) : ('Closed, Day Open in ' + formatHM(diffDay));
              statusCell.innerHTML = '<span class="' + colorClass + '">' + textDay + '</span>';
            }
            setLedState(m.code, 'red');
          }
          return;
        }

        // Standard Market Processing
        const openMin = timeToMin(m.open);
        const closeMin = timeToMin(m.close);
        const totalSession = closeMin > openMin ? (closeMin - openMin) : (1440 - openMin + closeMin);

        let isTradingNow = false;
        if (closeMin > openMin) {
          isTradingNow = (localMin >= openMin && localMin < closeMin);
        } else {
          isTradingNow = (localMin >= openMin || localMin < closeMin);
        }

        let isLunch = false;
        if (m.hasLunch) {
          const lStart = timeToMin(m.lunchStart);
          const lEnd = timeToMin(m.lunchEnd);
          if (localMin >= lStart && localMin < lEnd) {
            isLunch = true;
          }
        }

        let currentState = 'CLOSED';
        if (isTradingNow && !isLunch) currentState = 'OPEN';
        else if (isLunch) currentState = 'BREAK';

        // AUDIO & FLASHING TRIGGERS FOR STANDARD MARKETS
        if (localSec === 0 && marketStateTracker[m.code].state !== 'UNKNOWN') {
          const prevState = marketStateTracker[m.code].state;
          if (prevState !== currentState) {
            if (!muteEx) {
              if (currentState === 'OPEN') {
                playMorsePattern('---'); // Morse 'O' for Open
              } else if (currentState === 'BREAK') {
                playMorsePattern('...-'); // Morse 'V' for Break
              } else if (currentState === 'CLOSED') {
                playMorsePattern('...- ...-'); // Morse 'V V' for Close
              }
            }
            if (currentState === 'OPEN' || currentState === 'CLOSED') {
              triggerFlashingAlert(m.code);
            }
          }
        }
        marketStateTracker[m.code].state = currentState;

        if (!isTradingNow) {
          let diff = 0;
          if (localMin < openMin) {
            diff = openMin - localMin;
          } else {
            diff = (1440 - localMin) + openMin;
          }
          const colorClass = diff <= 60 ? 'status-close' : 'status-close-dark';
          const openText = isMobile ? ('Open in ' + formatHM(diff)) : ('Closed, Open in ' + formatHM(diff));
          statusCell.innerHTML = '<span class="' + colorClass + '">' + openText + '</span>';
          setLedState(m.code, 'red');
        } else {
          if (isLunch) {
            const lEnd = timeToMin(m.lunchEnd);
            const remLunch = lEnd - localMin;
            let remainingTotal = closeMin > localMin ? (closeMin - localMin) : (1440 - localMin + closeMin);
            const pct = Math.max(0, Math.min(100, (remainingTotal / totalSession) * 100));

            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill" style="width: ${pct}%;"></div>
                <div class="ib-overlay-text blinking-text">Break, Open in ${formatHM(remLunch)}</div>
              </div>
            `;
            setLedState(m.code, 'orange');
          } else {
            let remaining = closeMin > localMin ? (closeMin - localMin) : (1440 - localMin + closeMin);
            const pct = Math.max(0, Math.min(100, (remaining / totalSession) * 100));
            const isWarning = remaining <= 30;

            statusCell.innerHTML = `
              <div class="ib-container">
                <div class="ib-fill ${isWarning ? 'warning' : ''}" style="width: ${pct}%;"></div>
                <div class="ib-overlay-text">Close in ${formatHM(remaining)}</div>
              </div>
            `;
            setLedState(m.code, 'green');
          }
        }
      });

      // TFEX SPECIAL CYCLES (1 Min & 5 Min)
      const tfexP = getZonedParts(now, "Asia/Bangkok");
      const tfexHM = tfexP.hour + ':' + tfexP.minute;
      document.getElementById('time-TFEX-1M').innerText = tfexHM;
      document.getElementById('time-TFEX-5M').innerText = tfexHM;

      const currentSec = now.getSeconds();
      const currentMin = now.getMinutes();

      const tfex1Cell = document.getElementById('status-TFEX-1M');
      const tfex5Cell = document.getElementById('status-TFEX-5M');

      if (isTfexBreak) {
        tfex1Cell.innerHTML = '<span class="status-close blinking-text">Break</span>';
        tfex5Cell.innerHTML = '<span class="status-close blinking-text">Break</span>';
        setLedState('TFEX-1M', 'orange');
        setLedState('TFEX-5M', 'orange');
      } else if (!isTfexTrading) {
        tfex1Cell.innerHTML = '<span class="status-close-dark">Closed</span>';
        tfex5Cell.innerHTML = '<span class="status-close-dark">Closed</span>';
        setLedState('TFEX-1M', 'red');
        setLedState('TFEX-5M', 'red');
      } else {
        const remSec1M = 60 - currentSec;
        const pct1M = (remSec1M / 60) * 100;
        
        tfex1Cell.innerHTML = `
          <div class="ib-container">
            <div class="ib-fill ib-gray ${remSec1M <= 10 ? 'warning' : ''}" style="width: ${pct1M}%;"></div>
          </div>
        `;

        const secIn5M = (currentMin % 5) * 60 + currentSec;
        const remSec5M = 300 - secIn5M;
        const pct5M = (remSec5M / 300) * 100;

        tfex5Cell.innerHTML = `
          <div class="ib-container">
            <div class="ib-fill ib-gray ${remSec5M <= 30 ? 'warning' : ''}" style="width: ${pct5M}%;"></div>
          </div>
        `;

        setLedState('TFEX-1M', 'green');
        setLedState('TFEX-5M', 'green');

        if (currentSec === 0 && lastTfex1mSec !== 0) {
          if (!muteTfex) {
            if (currentMin % 5 === 0) {
              playMorsePattern('-'); // Morse 'T' (5m Alert)
            } else {
              playMorsePattern('.'); // Morse 'E' (1m Alert)
            }
          }
        }
      }
      lastTfex1mSec = currentSec;
    }

    initTable();
    updateEngine();
    setInterval(updateEngine, 1000);
  </script>
</body>
</html>
