<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exchange Times v2.4.0</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-yellow: #eab308;
      --accent-blue: #38bdf8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Header Structure */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-blue);
      cursor: pointer;
      user-select: none;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .utc-clock {
      font-size: 14px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .speech-btn {
      background: #334155;
      color: #94a3b8;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .speech-btn.active {
      background: #166534;
      color: #4ade80;
      border-color: #22c55e;
    }

    /* Table Styling */
    .table-container {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    th {
      background-color: #0f172a;
      color: var(--text-sub);
      font-size: 11px;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* Status Badges */
    .status-badge {
      font-weight: bold;
      font-size: 12px;
    }
    .status-open { color: var(--accent-green); }
    .status-closed { color: var(--accent-red); }
    .status-break { color: var(--accent-yellow); }

    /* Time Text */
    .time-remaining {
      font-size: 11px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title" id="brandTitle" onclick="triggerScanReport()">Exchange Times <span style="font-size:10px; color:#64748b;">v2.4.0</span></div>
      <div class="header-right">
        <div class="utc-clock" id="utcClock">UTC --:--:--</div>
        <button class="speech-btn" id="speechBtn" onclick="toggleSpeech()">Speech OFF</button>
      </div>
    </header>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Exchange / Asset</th>
            <th>City</th>
            <th>Local Time</th>
            <th>Trading Hours</th>
            <th>Status</th>
            <th>Tomorrow</th>
          </tr>
        </thead>
        <tbody id="exchangeTableBody">
          <!-- Dynamic Content -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // System Speech State
    let speechEnabled = false;
    let synth = window.speechSynthesis;
    let selectedVoice = null;
    let lastAnnounced5Min = []; // Track 5-min warning triggers

    // Holiday Data (Example SET / Bank Holidays)
    const setHolidays = [
      "2026-01-01", "2026-03-03", "2026-04-13", "2026-04-14", "2026-04-15",
      "2026-05-01", "2026-05-04", "2026-07-29", "2026-08-12", "2026-10-13",
      "2026-10-23", "2026-12-07", "2026-12-10", "2026-12-31"
    ];

    // Exchange Matrix Configuration
    const exchanges = [
      { name: "SET Index", city: "Bangkok", tz: "Asia/Bangkok", open: "10:00", close: "16:30", type: "stock", hasBreak: true, breakOpen: "12:30", breakClose: "14:30" },
      { name: "TFEX 1m", city: "Bangkok", tz: "Asia/Bangkok", open: "09:45", close: "16:55", type: "tfex", isSub: true },
      { name: "TFEX 5m", city: "Bangkok", tz: "Asia/Bangkok", open: "09:45", close: "16:55", type: "tfex", isSub: true },
      { name: "Tokyo Stock", city: "Tokyo", tz: "Asia/Tokyo", open: "09:00", close: "15:00", type: "stock", hasBreak: true, breakOpen: "11:30", breakClose: "12:30" },
      { name: "London Stock", city: "London", tz: "Europe/London", open: "08:00", close: "16:30", type: "stock" },
      { name: "New York Stock", city: "New York", tz: "America/New_York", open: "09:30", close: "16:00", type: "stock" },
      { name: "US 10 Year Bond", city: "Chicago", tz: "America/Chicago", open: "07:00", close: "17:00", type: "bond" },
      { name: "Gold / Forex", city: "Global", tz: "UTC", open: "00:00", close: "23:59", type: "24h" }
    ];

    // Initialize Voice Settings
    function initVoices() {
      if (!synth) return;
      let voices = synth.getVoices();
      // Prefer Kanya (Thai) for iPad Gen 5 / Local setup, or Samantha (English)
      selectedVoice = voices.find(v => v.name.includes("Kanya") || v.lang === "th-TH") ||
                      voices.find(v => v.name.includes("Samantha") || v.lang.startsWith("en")) ||
                      voices[0];
    }
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoices;
    }

    // Toggle Speech Button
    function toggleSpeech() {
      speechEnabled = !speechEnabled;
      const btn = document.getElementById('speechBtn');
      if (speechEnabled) {
        btn.innerText = "Speech ON";
        btn.classList.add('active');
        speakText(selectedVoice && selectedVoice.lang.startsWith("th") ? "ระบบเปิดเสียงพูดแล้วค่ะ" : "Speech is On");
      } else {
        btn.innerText = "Speech OFF";
        btn.classList.remove('active');
        speakText(selectedVoice && selectedVoice.lang.startsWith("th") ? "ระบบปิดเสียงพูดแล้วค่ะ" : "Speech is Off");
      }
    }

    // Speak Function Helper
    function speakText(text, pauseBefore = 0) {
      if (!speechEnabled || !synth) return;
      synth.cancel(); // Clear queue

      setTimeout(() => {
        let utterance = new SpeechSynthesisUtterance(text);
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.rate = 0.95;
        synth.speak(utterance);
      }, pauseBefore);
    }

    // Scan Report when clicking "Exchange Times"
    function triggerScanReport() {
      const now = new Date();
      const optionsDay = { weekday: 'long' };
      const optionsDate = { month: 'long', day: 'numeric', year: 'numeric' };
      
      const dayStr = now.toLocaleDateString('en-US', optionsDay);
      const dateStr = now.toLocaleDateString('en-US', optionsDate);
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });

      let openList = [];

      exchanges.forEach(ex => {
        const status = getMarketStatus(ex, now);
        if (status.isOpen) {
          openList.push(`${ex.name} ${ex.city}`);
        }
      });

      let textToSpeak = `Today is ${dayStr}, ${dateStr}. The time is now ${timeStr}. `;

      if (openList.length > 0) {
        textToSpeak += `The remaining open exchange `;
        speakText(textToSpeak);
        // Pause 1 sec before listing assets
        setTimeout(() => {
          let listSpeech = new SpeechSynthesisUtterance(openList.join(", "));
          if (selectedVoice) listSpeech.voice = selectedVoice;
          synth.speak(listSpeech);
        }, 1000);
      } else {
        textToSpeak += `All markets closed.`;
        speakText(textToSpeak);
      }
    }

    // Calculate Market Status & Remaining Time
    function getMarketStatus(ex, now) {
      // Get time in target Timezone
      const localTimeStr = now.toLocaleString("en-US", { timeZone: ex.tz });
      const localDate = new Date(localTimeStr);
      
      const day = localDate.getDay();
      const dateIso = localDate.toISOString().split('T')[0];

      const isWeekend = (day === 0 || day === 6);
      const isHoliday = setHolidays.includes(dateIso);

      if (isWeekend) return { isOpen: false, statusText: "CLOSED, weekend", remainingMin: 0 };
      if (isHoliday) return { isOpen: false, statusText: "CLOSED, holiday", remainingMin: 0 };

      const currentMinutes = localDate.getHours() * 60 + localDate.getMinutes();
      const [openH, openM] = ex.open.split(':').map(Number);
      const [closeH, closeM] = ex.close.split(':').map(Number);
      
      const openMinutes = openH * 60 + openM;
      const closeMinutes = closeH * 60 + closeM;

      // Handle Lunch Break
      if (ex.hasBreak) {
        const [bOpenH, bOpenM] = ex.breakOpen.split(':').map(Number);
        const [bCloseH, bCloseM] = ex.breakClose.split(':').map(Number);
        const bOpenMin = bOpenH * 60 + bOpenM;
        const bCloseMin = bCloseH * 60 + bCloseM;

        if (currentMinutes >= bOpenMin && currentMinutes < bCloseMin) {
          return { isOpen: false, isBreak: true, statusText: "BREAK", remainingMin: 0 };
        }
      }

      if (currentMinutes >= openMinutes && currentMinutes < closeMinutes) {
        const remainingMin = closeMinutes - currentMinutes;
        return { isOpen: true, statusText: "OPEN", remainingMin: remainingMin };
      }

      return { isOpen: false, statusText: "CLOSED", remainingMin: 0 };
    }

    // Main Update Loop
    function updateDashboard() {
      const now = new Date();
      
      // Update UTC Clock
      document.getElementById('utcClock').innerText = "UTC " + now.toISOString().substr(11, 8);

      const tbody = document.getElementById('exchangeTableBody');
      tbody.innerHTML = '';

      let closingSoonList = [];

      exchanges.forEach(ex => {
        const localTimeStr = now.toLocaleTimeString("en-US", { timeZone: ex.tz, hour12: false, hour: '2-digit', minute: '2-digit' });
        const statusInfo = getMarketStatus(ex, now);

        // Check 5-min warning
        if (statusInfo.isOpen && statusInfo.remainingMin > 0 && statusInfo.remainingMin <= 5) {
          if (!lastAnnounced5Min.includes(ex.name)) {
            closingSoonList.push(ex.name);
            lastAnnounced5Min.push(ex.name);
          }
        } else if (!statusInfo.isOpen) {
          // Reset warning trigger if market is no longer open
          lastAnnounced5Min = lastAnnounced5Min.filter(item => item !== ex.name);
        }

        // Row UI Construction
        const tr = document.createElement('tr');

        // Column 1: Exchange
        const tdName = document.createElement('td');
        tdName.innerText = ex.name;
        if (ex.isSub) tdName.style.paddingLeft = "24px";
        tr.appendChild(tdName);

        // Column 2: City
        const tdCity = document.createElement('td');
        tdCity.innerText = ex.city;
        tdCity.style.color = "var(--text-sub)";
        tr.appendChild(tdCity);

        // Column 3: Local Time
        const tdTime = document.createElement('td');
        tdTime.innerText = localTimeStr;
        tr.appendChild(tdTime);

        // Column 4: Hours
        const tdHours = document.createElement('td');
        tdHours.innerText = `${ex.open} - ${ex.close}`;
        tdHours.style.color = "var(--text-sub)";
        tr.appendChild(tdHours);

        // Column 5: Status
        const tdStatus = document.createElement('td');
        if (ex.type === 'tfex' && (!statusInfo.isOpen || statusInfo.isBreak)) {
          tdStatus.innerText = ""; // Hide status for TFEX during break/closed
        } else {
          let badgeClass = statusInfo.isOpen ? "status-open" : (statusInfo.isBreak ? "status-break" : "status-closed");
          tdStatus.innerHTML = `<span class="status-badge ${badgeClass}">${statusInfo.statusText}</span>`;
        }
        tr.appendChild(tdStatus);

        // Column 6: Tomorrow
        const tdTomorrow = document.createElement('td');
        if (ex.type === 'tfex') {
          tdTomorrow.innerText = ""; // Leave blank for TFEX 1m/5m
        } else {
          // Check if tomorrow is weekend/holiday
          const tom = new Date(now);
          tom.setDate(tom.getDate() + 1);
          const tomIso = tom.toISOString().split('T')[0];
          const tomDay = tom.getDay();

          if (tomDay === 0 || tomDay === 6) {
            tdTomorrow.innerText = "CLOSED, weekend";
            tdTomorrow.style.color = "var(--accent-red)";
          } else if (setHolidays.includes(tomIso)) {
            tdTomorrow.innerText = "CLOSED, holiday";
            tdTomorrow.style.color = "var(--accent-red)";
          } else {
            tdTomorrow.innerText = "OPEN";
            tdTomorrow.style.color = "var(--accent-green)";
          }
        }
        tr.appendChild(tdTomorrow);

        tbody.appendChild(tr);
      });

      // Announce 5-minute closing warnings
      if (closingSoonList.length === 1) {
        speakText(`Attention please, attention`);
        setTimeout(() => {
          speakText(`${closingSoonList[0]} is closing in 5 minutes`);
        }, 1000);
      } else if (closingSoonList.length > 1) {
        speakText(`Attention please, attention`);
        setTimeout(() => {
          speakText(`The ${closingSoonList.join(", ")} will be closed within 5 minutes from now`);
        }, 1000);
      }
    }

    // Initialize
    initVoices();
    updateDashboard();
    setInterval(updateDashboard, 1000);
  </script>
</body>
</html>
