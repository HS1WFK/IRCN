<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HS1WFK 4 STREAMS v2.4.1</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --accent-purple: #8b5cf6;
      --accent-teal: #14b8a6;
      --accent-thaipbs: #f97316;
      --header-bg: #161e2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.4rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      z-index: 100;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      color: #ffffff;
      flex-shrink: 0;
    }

    .version-text {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Triple System Toggle Button (1/2/3) */
    .btn-sys-toggle {
      font-weight: 700;
      padding: 0.3rem 0.55rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .btn-sys-toggle.sys3-mode {
      background-color: var(--accent-teal);
      color: #ffffff;
      border: 1px solid var(--accent-teal);
    }

    .btn-sys-toggle.sys1-mode {
      background-color: var(--accent-blue);
      color: #ffffff;
      border: 1px solid var(--accent-blue);
    }

    .btn-sys-toggle.sys2-mode {
      background-color: var(--accent-purple);
      color: #ffffff;
      border: 1px solid var(--accent-purple);
    }

    .btn-page-toggle, .btn-layout-toggle {
      font-weight: 700;
      padding: 0.3rem 0.55rem;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.72rem;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      white-space: nowrap;
    }

    .btn-page-toggle {
      background-color: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
    }

    .btn-page-toggle:hover {
      background-color: var(--accent-green);
      color: #ffffff;
    }

    .btn-layout-toggle {
      background-color: rgba(59, 130, 246, 0.15);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
    }

    .btn-layout-toggle:hover {
      background-color: var(--accent-blue);
      color: #ffffff;
    }

    /* CUE Selector Checkboxes (CH1..CH8) */
    .ch-selector-group {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-color);
      padding: 0.15rem 0.4rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .ch-checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.1rem;
      cursor: pointer;
      color: var(--text-main);
      font-size: 0.7rem;
      font-weight: 600;
    }

    .ch-checkbox-label input[type="checkbox"] {
      accent-color: var(--accent-blue);
      cursor: pointer;
      width: 12px;
      height: 12px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.3rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn:hover {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .btn-thaipbs {
      background-color: var(--accent-thaipbs);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.72rem;
      padding: 0.3rem 0.55rem;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
      white-space: nowrap;
    }

    .btn-thaipbs:hover {
      background-color: #ea580c;
    }

    .live-blink {
      animation: text-blink-animation 1.2s infinite ease-in-out;
      font-weight: 700;
      color: #ffffff;
      margin-left: 0.2rem;
    }

    @keyframes text-blink-animation {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }

    main {
      flex: 1;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .system-container {
      display: none;
      flex: 1;
      width: 100%;
    }

    .system-container.active-system {
      display: flex;
      flex-direction: column;
    }

    .page-view {
      display: none;
      flex: 1;
      width: 100%;
    }

    .page-view.active {
      display: block;
    }

    /* SYSTEM 3: VERTICAL DUAL LAYOUT (2 CHANNELS TOP/BOTTOM) */
    .grid-vertical-2ch {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      height: calc(100vh - 65px);
    }

    .grid-vertical-2ch .screen-card {
      flex: 1;
      height: 50%;
    }

    .grid-vertical-2ch .screen-card.fullscreen-card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
    }

    /* GRID LAYOUT MODES FOR SYS 1 & SYS 2 */
    .grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.5rem;
      height: calc(100vh - 65px);
    }

    .grid-focus {
      display: grid;
      grid-template-columns: 2.8fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      grid-template-areas:
        "focus side1"
        "focus side2"
        "focus side3";
      gap: 0.5rem;
      height: calc(100vh - 65px);
    }

    @media (max-width: 900px) {
      header {
        gap: 0.3rem;
        padding: 0.35rem;
      }
      .grid-2x2, .grid-focus, .grid-vertical-2ch {
        display: flex;
        flex-direction: column;
        height: auto;
      }
      .screen-card {
        height: 260px !important;
      }
    }

    .screen-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transform: translateZ(0);
      will-change: transform;
    }

    .screen-card.solo-active {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 1px var(--accent-green);
    }

    .screen-header {
      background-color: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--border-color);
      padding: 0.35rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      z-index: 10;
    }

    .ch-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .station-name-display {
      font-size: 0.8rem;
      font-weight: 700;
      color: #f3f4f6;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .station-select {
      background-color: #0d121d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 0.2rem 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
      flex: 1;
      max-width: 180px;
      cursor: pointer;
    }

    .station-select optgroup {
      background-color: #111827;
      color: var(--accent-gold);
    }

    .screen-actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .action-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.15);
    }

    .action-btn.solo-btn.active {
      background-color: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
    }

    .video-wrapper {
      flex: 1;
      position: relative;
      background-color: #000;
      width: 100%;
      height: 100%;
    }

    .video-wrapper iframe, .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
      transform: translateZ(0);
    }

    /* Clickable Overlay Layer */
    .swap-overlay {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.001);
      cursor: pointer;
      z-index: 25;
      transition: background-color 0.2s ease;
    }

    .swap-overlay:hover {
      background: rgba(59, 130, 246, 0.2);
    }

    .swap-overlay::after {
      content: '↖ Click to Focus';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(17, 24, 39, 0.9);
      color: var(--accent-gold);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid var(--accent-gold);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .grid-vertical-2ch .swap-overlay::after {
      content: '⤢ Click to Fullscreen / Restore';
    }

    .screen-footer {
      background-color: rgba(10, 15, 25, 0.95);
      border-top: 1px solid var(--border-color);
      padding: 0.3rem 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 10;
    }

    .url-input {
      flex: 1;
      background-color: #05080e;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      color: var(--text-main);
      padding: 0.2rem 0.4rem;
      font-size: 0.7rem;
      font-family: monospace;
      outline: none;
    }

    .timer-badge {
      font-size: 0.72rem;
      font-family: monospace;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.15);
      padding: 0.25rem 0.45rem;
      border-radius: 5px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      font-weight: 700;
      white-space: nowrap;
    }

    .thaipbs-mode-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(11, 15, 25, 0.94);
      backdrop-filter: blur(8px);
      z-index: 500;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
      padding: 1.5rem;
    }

    .thaipbs-mode-overlay.active {
      display: flex;
    }

    .overlay-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-thaipbs);
    }

    .overlay-desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.5;
    }

    .btn-action-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-launch-fallback {
      background-color: var(--accent-thaipbs);
      color: #ffffff;
      font-size: 1rem;
      padding: 0.7rem 1.4rem;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
      animation: pulse-orange 1.5s infinite;
    }

    .btn-resume {
      background-color: var(--accent-green);
      color: #ffffff;
      font-size: 1rem;
      padding: 0.7rem 1.4rem;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="header-left">
      <div class="brand-title">
        HS1WFK 4 STREAMS <span class="version-text">v2.4.1</span>
      </div>

      <!-- Triple System Toggle Button -->
      <button class="btn-sys-toggle sys3-mode" id="btn-single-sys-toggle" onclick="toggleSystem()">
        System 3
      </button>

      <!-- 8-Channel CUE Selector Group -->
      <div class="ch-selector-group" id="container-cue-group" style="display: none;">
        <span>CUE:</span>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-1" checked onclick="handleUserCheckboxClick(1)"> CH1</label>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-2" onclick="handleUserCheckboxClick(2)"> CH2</label>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-3" onclick="handleUserCheckboxClick(3)"> CH3</label>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-4" onclick="handleUserCheckboxClick(4)"> CH4</label>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-5" onclick="handleUserCheckboxClick(5)"> CH5</label>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-6" onclick="handleUserCheckboxClick(6)"> CH6</label>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-7" onclick="handleUserCheckboxClick(7)"> CH7</label>
        <label class="ch-checkbox-label"><input type="checkbox" id="chk-audio-8" onclick="handleUserCheckboxClick(8)"> CH8</label>
      </div>

      <!-- Real-time Hourly Countdown Badge -->
      <div class="timer-badge" id="timer-status" style="display: none;">Next: --:--</div>

      <!-- Global Action: Mute -->
      <button class="btn" onclick="muteAllCurrentPage()" style="border: 1px solid var(--border-color);">
        Mute
      </button>
    </div>

    <div class="header-right">
      <!-- ThaiPBS Button -->
      <button class="btn btn-thaipbs" id="btn-thaipbs-live" onclick="openThaiPBSLive(true)" style="display: none;">
        ThaiPBS
      </button>

      <!-- Single Page Toggle Button -->
      <button class="btn-page-toggle" id="btn-single-page-toggle" onclick="togglePage()" style="display: none;">
        Page 1
      </button>

      <!-- Single Layout Toggle Button -->
      <button class="btn-layout-toggle" id="btn-single-layout-toggle" onclick="toggleLayout()" style="display: none;">
        [ 2x2 ]
      </button>
    </div>
  </header>

  <!-- Main View Area -->
  <main>
    <!-- ThaiPBS Standby Control Overlay -->
    <div class="thaipbs-mode-overlay" id="thaipbs-overlay">
      <div class="overlay-title">📺 ThaiPBS Live News Mode</div>
      <div class="overlay-desc" id="overlay-desc-text">
        4-Streams have been paused to minimize bandwidth & system resource usage.
      </div>

      <div class="btn-action-group">
        <button class="btn-launch-fallback" id="btn-manual-popup" onclick="openThaiPBSLive(true)" style="display: none;">
          ▶ Click to Open ThaiPBS Live Window
        </button>
        <button class="btn-resume" onclick="closeThaiPBSAndResume()">
          ⏹ Close ThaiPBS & Resume 4-Streams
        </button>
      </div>
    </div>

    <!-- SYSTEM 3 CONTAINER -->
    <div id="system-3-container" class="system-container active-system">
      <div class="grid-vertical-2ch">
        <!-- CH 1 Top: CNA -->
        <div class="screen-card" id="sys3-card-1">
          <div class="screen-header">
            <span class="ch-tag">CH 1 (TOP)</span>
            <select class="station-select" id="sys3-select-1" onchange="onSelectStationSys3(1)"></select>
            <div class="screen-actions">
              <button class="action-btn solo-btn" id="sys3-solo-1" onclick="toggleSoloSys3(1)">Solo Audio</button>
              <button class="action-btn" onclick="reloadScreenSys3(1)">Reload</button>
            </div>
          </div>
          <div class="video-wrapper">
            <div id="sys3-player-1"></div>
            <div class="swap-overlay" id="overlay-sys3-1" onclick="toggleCardFullscreenSys3(1)"></div>
          </div>
          <div class="screen-footer">
            <input type="text" class="url-input" id="sys3-input-1" placeholder="Paste YouTube URL or Video ID">
            <button class="action-btn" onclick="applyCustomInputSys3(1)">Set</button>
          </div>
        </div>

        <!-- CH 2 Bottom: Bloomberg -->
        <div class="screen-card" id="sys3-card-2">
          <div class="screen-header">
            <span class="ch-tag">CH 2 (BOTTOM)</span>
            <select class="station-select" id="sys3-select-2" onchange="onSelectStationSys3(2)"></select>
            <div class="screen-actions">
              <button class="action-btn solo-btn" id="sys3-solo-2" onclick="toggleSoloSys3(2)">Solo Audio</button>
              <button class="action-btn" onclick="reloadScreenSys3(2)">Reload</button>
            </div>
          </div>
          <div class="video-wrapper">
            <div id="sys3-player-2"></div>
            <div class="swap-overlay" id="overlay-sys3-2" onclick="toggleCardFullscreenSys3(2)"></div>
          </div>
          <div class="screen-footer">
            <input type="text" class="url-input" id="sys3-input-2" placeholder="Paste YouTube URL or Video ID">
            <button class="action-btn" onclick="applyCustomInputSys3(2)">Set</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SYSTEM 1 CONTAINER -->
    <div id="system-1-container" class="system-container">
      <div id="sys1-page-1" class="page-view active">
        <div class="grid-2x2" id="sys1-grid-p1">
          <!-- CH 1 -->
          <div class="screen-card" id="card-1">
            <div class="screen-header">
              <span class="ch-tag">CH 1</span>
              <select class="station-select" id="select-1" onchange="onSelectStation(1)"></select>
              <div class="screen-actions">
                <button class="action-btn solo-btn" id="solo-1" onclick="toggleSolo(1)">Solo Audio</button>
                <button class="action-btn" onclick="reloadScreen(1)">Reload</button>
              </div>
            </div>
            <div class="video-wrapper">
              <div id="player-1"></div>
              <div class="swap-overlay" id="overlay-sys1-1" onclick="handleCardVideoClick(1)"></div>
            </div>
            <div class="screen-footer">
              <input type="text" class="url-input" id="input-1" placeholder="Paste YouTube URL or Video ID">
              <button class="action-btn" onclick="applyCustomInput(1)">Set</button>
            </div>
          </div>

          <!-- CH 2 -->
          <div class="screen-card" id="card-2">
            <div class="screen-header">
              <span class="ch-tag">CH 2</span>
              <select class="station-select" id="select-2" onchange="onSelectStation(2)"></select>
              <div class="screen-actions">
                <button class="action-btn solo-btn" id="solo-2" onclick="toggleSolo(2)">Solo Audio</button>
                <button class="action-btn" onclick="reloadScreen(2)">Reload</button>
              </div>
            </div>
            <div class="video-wrapper">
              <div id="player-2"></div>
              <div class="swap-overlay" id="overlay-sys1-2" onclick="handleCardVideoClick(2)"></div>
            </div>
            <div class="screen-footer">
              <input type="text" class="url-input" id="input-2" placeholder="Paste YouTube URL or Video ID">
              <button class="action-btn" onclick="applyCustomInput(2)">Set</button>
            </div>
          </div>

          <!-- CH 3 -->
          <div class="screen-card" id="card-3">
            <div class="screen-header">
              <span class="ch-tag">CH 3</span>
              <select class="station-select" id="select-3" onchange="onSelectStation(3)"></select>
              <div class="screen-actions">
                <button class="action-btn solo-btn" id="solo-3" onclick="toggleSolo(3)">Solo Audio</button>
                <button class="action-btn" onclick="reloadScreen(3)">Reload</button>
              </div>
            </div>
            <div class="video-wrapper">
              <div id="player-3"></div>
              <div class="swap-overlay" id="overlay-sys1-3" onclick="handleCardVideoClick(3)"></div>
            </div>
            <div class="screen-footer">
              <input type="text" class="url-input" id="input-3" placeholder="Paste YouTube URL or Video ID">
              <button class="action-btn" onclick="applyCustomInput(3)">Set</button>
            </div>
          </div>

          <!-- CH 4 -->
          <div class="screen-card" id="card-4">
            <div class="screen-header">
              <span class="ch-tag">CH 4</span>
              <select class="station-select" id="select-4" onchange="onSelectStation(4)"></select>
              <div class="screen-actions">
                <button class="action-btn solo-btn" id="solo-4" onclick="toggleSolo(4)">Solo Audio</button>
                <button class="action-btn" onclick="reloadScreen(4)">Reload</button>
              </div>
            </div>
            <div class="video-wrapper">
              <div id="player-4"></div>
              <div class="swap-overlay" id="overlay-sys1-4" onclick="handleCardVideoClick(4)"></div>
            </div>
            <div class="screen-footer">
              <input type="text" class="url-input" id="input-4" placeholder="Paste YouTube URL or Video ID">
              <button class="action-btn" onclick="applyCustomInput(4)">Set</button>
            </div>
          </div>
        </div>
      </div>
