<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad Voice Inspector</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; }
    button { padding: 12px 24px; font-size: 18px; font-weight: bold; background: #00d2ff; border: none; border-radius: 8px; cursor: pointer; }
    ul { background: #1e1e1e; padding: 15px 30px; border-radius: 8px; max-height: 300px; overflow-y: auto; }
    li { margin-bottom: 8px; font-size: 14px; color: #ccc; }
  </style>
</head>
<body>
  <h2>iPad Speech Voices Inspector</h2>
  <button onclick="listVoices()">Inspect Available Voices</button>
  <ul id="voiceList">Click button to inspect...</ul>

  <script>
    function listVoices() {
      const voices = window.speechSynthesis.getVoices();
      const listElem = document.getElementById('voiceList');
      listElem.innerHTML = '';
      
      if (voices.length === 0) {
        listElem.innerHTML = '<li>No voices returned by iPadOS WebEngine yet. Try tapping again.</li>';
        return;
      }

      voices.filter(v => v.lang.startsWith('en')).forEach(v => {
        const li = document.createElement('li');
        li.innerText = `Name: "${v.name}" | Lang: ${v.lang} | Default: ${v.default}`;
        listElem.appendChild(li);
      });
    }
  </script>
</body>
</html>
