<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voice Test - Eddy / Samantha / Narisa</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .toggle-btn {
      background-color: #00d2ff;
      color: #000000;
      border: none;
      padding: 20px 40px;
      font-size: 28px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      min-width: 220px;
      box-shadow: 0 4px 15px rgba(0,210,255,0.3);
      transition: all 0.2s ease;
    }
    .toggle-btn.speaking {
      background-color: #f44336;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(244,67,54,0.4);
    }
    .info-box {
      margin-top: 25px;
      font-size: 16px;
      color: #aaa;
      text-align: center;
      max-width: 90%;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <button id="btnToggle" class="toggle-btn" onclick="toggleSpeech()">Speak</button>
  <div id="voiceStatus" class="info-box">Targeting Voices: Eddy (UK) / Samantha (US) / Narisa (TH)</div>

  <script>
    let isSpeaking = false;
    let cachedVoices = [];

    // Pre-load available voices on iPadOS / macOS
    function loadVoices() {
      if ('speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      if (window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }
    }

    // Target English Voice: Eddy (UK) -> Samantha (US) -> Fallback
    function getEnglishVoice() {
      if (cachedVoices.length === 0 && 'speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }

      // 1. Target "Eddy" (English UK)
      let eddy = cachedVoices.find(v => v.name.includes('Eddy'));
      if (eddy) return eddy;

      // 2. Target "Samantha" (English US)
      let samantha = cachedVoices.find(v => v.name.includes('Samantha'));
      if (samantha) return samantha;

      // 3. Fallback to alternative UK voice
      let ukAlt = cachedVoices.find(v => (v.lang === 'en-GB' || v.lang.startsWith('en_GB')) && !v.name.includes('Daniel'));
      if (ukAlt) return ukAlt;

      // 4. Fallback to alternative US voice
      let usAlt = cachedVoices.find(v => v.lang === 'en-US' || v.lang.startsWith('en_US'));
      if (usAlt) return usAlt;

      // 5. Fallback to any English voice
      return cachedVoices.find(v => v.lang.startsWith('en')) || null;
    }

    // Target Thai Voice: Narisa (Enhanced) -> Fallback
    function getThaiVoice() {
      if (cachedVoices.length === 0 && 'speechSynthesis' in window) {
        cachedVoices = window.speechSynthesis.getVoices();
      }

      // 1. Target "Narisa" (Enhanced / Premium)
      let narisa = cachedVoices.find(v => v.name.includes('Narisa'));
      if (narisa) return narisa;

      // 2. Fallback to any Thai voice
      let thVoice = cachedVoices.find(v => v.lang === 'th-TH' || v.lang.startsWith('th'));
      return thVoice || null;
    }

    function toggleSpeech() {
      const btn = document.getElementById('btnToggle');
      const status = document.getElementById('voiceStatus');

      if (!('speechSynthesis' in window)) {
        alert('Speech Synthesis is not supported on this browser.');
        return;
      }

      // Stop if currently speaking
      if (isSpeaking) {
        window.speechSynthesis.cancel();
        resetButton();
        return;
      }

      // Unlock Speech Engine on iOS/iPadOS
      window.speechSynthesis.resume();

      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      // Prepare text strings
      const englishText = `Hello, it's a beautiful day and wonderful night, time now is ${hh}:${ss}`;
      const thaiText = `ขณะนี้เวลา ${hh}:${mm} นาฬิกา ค่ะ`;

      const engVoice = getEnglishVoice();
      const thVoice = getThaiVoice();

      // Display Status
      let statusLog = [];
      if (engVoice) statusLog.push(`English: ${engVoice.name} (${engVoice.lang})`);
      else statusLog.push('English: Default');

      if (thVoice) statusLog.push(`Thai: ${thVoice.name} (${thVoice.lang})`);
      else statusLog.push('Thai: Default th-TH');

      status.innerHTML = statusLog.join('<br>');

      // Utterance 1: English
      const engUtterance = new SpeechSynthesisUtterance(englishText);
      engUtterance.rate = 0.9;
      engUtterance.pitch = 1.0;
      if (engVoice) {
        engUtterance.voice = engVoice;
        engUtterance.lang = engVoice.lang;
      } else {
        engUtterance.lang = 'en-US';
      }

      // Utterance 2: Thai
      const thaiUtterance = new SpeechSynthesisUtterance(thaiText);
      thaiUtterance.rate = 0.95;
      thaiUtterance.pitch = 1.0;
      if (thVoice) {
        thaiUtterance.voice = thVoice;
        thaiUtterance.lang = thVoice.lang;
      } else {
        thaiUtterance.lang = 'th-TH';
      }

      // Chain Event Handlers
      engUtterance.onstart = function() {
        isSpeaking = true;
        btn.innerText = 'Stop';
        btn.classList.add('speaking');
      };

      engUtterance.onerror = function() {
        resetButton();
      };

      thaiUtterance.onend = function() {
        resetButton();
      };

      thaiUtterance.onerror = function() {
        resetButton();
      };

      // Queue utterances sequentially
      window.speechSynthesis.speak(engUtterance);
      window.speechSynthesis.speak(thaiUtterance);
    }

    function resetButton() {
      isSpeaking = false;
      const btn = document.getElementById('btnToggle');
      btn.innerText = 'Speak';
      btn.classList.remove('speaking');
    }
  </script>
</body>
</html>
