<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International News - Compact Header Meter V.1.5.0</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050a12;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 20px 20px 20px;
      max-width: 820px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image:
        linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 100%),
        url('ert91.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    /* --- Scaled up by 20% --- */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding-top: 19px;
      padding-bottom: 14px;
      padding-left: 14px;
      padding-right: 14px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 0 8px 8px;
    }

    .header-container { text-align: left; padding-left: 6px; }
    
    .callsign { font-size: 31px; font-weight: 700; color: #a0a0a0; letter-spacing: 0.5px; margin-bottom: 5px; }
    .title-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    
    h1.page-title { font-size: 48px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95); margin: 0; line-height: 1.1; }
    
    .utc-time-display {
      font-size: 31px; font-weight: 600; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95); white-space: nowrap;
    }

    .station-info-row { display: flex; align-items: center; margin-bottom: 12px; min-height: 42px; visibility: hidden; width: 100%; }
    .station-ticker-wrapper { display: flex; align-items: center; width: 100%; overflow: hidden; }
    .station-fixed-title { font-size: 24px; font-weight: 700; color: #ff9800; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); white-space: nowrap; margin-right: 10px; flex-shrink: 0; }
    .station-ticker-container { flex-grow: 1; overflow: hidden; white-space: nowrap; position: relative; }
    .station-ticker-text {
      display: inline-block; font-size: 24px; font-weight: 600; color: #ff9800;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); white-space: nowrap;
      animation: ticker-scroll-slow 45s linear infinite;
    }

    @keyframes ticker-scroll-slow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .scope-container {
      position: relative; width: 100%; height: 60px; background-color: rgba(5, 11, 5, 0.92);
      border: 1px solid rgba(28, 59, 28, 0.85); border-radius: 5px; overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.7); margin-bottom: 8px;
    }
    .scope-grid {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: 20px 10px;
      background-image: linear-gradient(to right, rgba(0, 255, 0, 0.08) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
      pointer-events: none;
    }
    canvas#oscilloscope { display: block; width: 100%; height: 100%; }

    .audio-content-stats { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: none; margin-top: 5px; padding-left: 5px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9); color: #a0a0a0; }
    .stats-main-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
    
    .channels-indicator { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    .buf-meter-container { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: #8ab4ff; font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace; white-space: nowrap; width: 50%; }
    
    .buf-bar-bg { flex-grow: 1; height: 12px; background-color: rgba(17, 17, 17, 0.95); border: 1px solid #555555; border-radius: 2px; overflow: hidden; }
    .buf-bar-fill { width: 0%; height: 100%; background-color: #ef4444; transition: width 0.1s linear, background-color 0.2s ease; }
    .buf-bar-fill.green-status { background-color: #22c55e !important; }
    .buf-bar-fill.red-status { background-color: #ef4444 !important; }

    .connection-status-line {
      margin-top: 4px; font-size: 19px; line-height: 1.2; font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      color: #8ab4ff; letter-spacing: 0.5px; display: flex; justify-content: space-between; width: 100%;
    }
    .status-highlight-red { color: #ef4444; font-weight: 700; }

    .time-vu-row { margin-top: 5px; display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
    
    .local-time-display {
      font-size: 31px !important; font-weight: 700; color: #ff9800;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); white-space: nowrap; line-height: 1.1;
    }

    .vu-container-global { --bar-h: 14px; --label-h: 22px; display: flex; align-items: center; gap: 12px; width: 50%; }
    .led-indicator { width: 11px; height: 11px; border-radius: 50%; background-color: #222222; flex-shrink: 0; align-self: flex-end; margin-bottom: calc((var(--bar-h) - 11px) / 2); transition: background-color 0.05s ease, box-shadow 0.05s ease; }
    .vu-meter-panel { flex-grow: 1; display: flex; flex-direction: column; gap: 1px; }
    .vu-scale-labels { display: flex; justify-content: space-between; position: relative; height: var(--label-h); font-size: 18px; color: #e0e0e0; font-weight: 500; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95); }
    .scale-mark { position: absolute; transform: translateX(-50%); }
    .scale-mark.zero-db { color: #ffffff; font-weight: 700; }
    .vu-bar-bg { position: relative; width: 100%; height: var(--bar-h); background-color: rgba(17, 17, 17, 0.95); border: 1px solid #555555; border-radius: 2px; overflow: hidden; }
    .vu-grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background-color: #555555; z-index: 2; }
    .vu-grid-line.zero-line { background-color: #aaaaaa; }
    .vu-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #22c55e 0%, #22c55e 78%, #ff9800 80%, #ef4444 100%); transition: width 0.04s ease-out; z-index: 1; }

    .stat-term { transition: color 0.15s ease; }
    .stat-term.active-red { color: #ef4444 !important; }
    .stat-term.disable-gray { color: #555555; }

    /* --- Playlist Button Grid Redesign --- */
    .playlist-container { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 16px; 
      background: rgba(0, 0, 0, 0.65); 
      padding: 24px; 
      border-radius: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.12); 
      backdrop-filter: blur(10px); 
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8); 
    }
    
    .channel-item { 
      display: flex; 
      align-items: center; 
      justify-content: center;
      cursor: pointer; 
      user-select: none; 
      width: 100%; 
      padding: 16px 10px; 
      min-height: 64px;
      border-radius: 8px; 
      border: 2px solid #555555;
      background: rgba(0, 0, 0, 0.4);
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; 
    }
    
    .channel-item:hover { 
      background: rgba(255, 255, 255, 0.1); 
      border-color: #777777;
    }
    
    .channel-item.active { 
      background: #ff9800; 
      border-color: #ff9800;
    }
    
    .channel-name { 
      font-size: 22px; 
      font-weight: 600; 
      color: #a0a0a0; 
      text-align: center;
      line-height: 1.2;
      white-space: normal;
      word-break: break-word;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95); 
    }
    
    .channel-item.active .channel-name { 
      color: #050a12; 
      font-weight: 800; 
      text-shadow: none;
    }
    
    .page-version-footer { text-align: center; font-size: 14px; color: #666666; margin-top: 20px; letter-spacing: 0.5px; }

    audio, video { display: none; }

    /* --- Mobile Scale Up (approx +20% from old mobile rules) --- */
    @media (max-width: 480px) {
      body { padding: 0 12px 16px 12px; }
      .sticky-header { padding-left: 10px; padding-right: 10px; }
      .callsign { font-size: 19px; }
      h1.page-title { font-size: 30px; }
      
      .utc-time-display, .local-time-display, .station-fixed-title, .station-ticker-text { font-size: 19px !important; }
      
      .channels-indicator { font-size: 17px; }
      .buf-meter-container { font-size: 16px; width: 60%; }
      .connection-status-line { font-size: 14px; letter-spacing: 0px; }
      
      .vu-container-global { --bar-h: 11px; --label-h: 17px; width: 50%; }
      .vu-scale-labels { font-size: 13px; }
      .scope-container { height: 48px; margin-bottom: 8px; }
      
      /* Grid adjustments for narrow screens */
      .playlist-container { padding: 16px; gap: 12px; }
      .channel-item { padding: 14px 6px; min-height: 58px; border-radius: 6px; }
      .channel-name { font-size: 17px; }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <div class="sticky-header">
    <div class="header-container">
      <div class="callsign">HS1WFK</div>

      <div class="title-row">
        <h1 class="page-title">International News</h1>
        <div class="utc-time-display" id="utc-clock">UTC --:--:--</div>
      </div>

      <div class="station-info-row" id="station-info-row">
        <div class="station-ticker-wrapper">
          <div class="station-fixed-title" id="station-fixed-title"></div>
          <div class="station-ticker-container">
            <div class="station-ticker-text" id="station-ticker-text"></div>
          </div>
        </div>
      </div>

      <div class="scope-container">
        <div class="scope-grid"></div>
        <canvas id="oscilloscope"></canvas>
      </div>

      <div class="audio-content-stats" id="audio-content-stats">
        <div class="stats-main-row">
          <div class="channels-indicator">
            CH:
            <span id="stat-mono" class="stat-term disable-gray">Mono</span>
            |
            <span id="stat-stereo" class="stat-term disable-gray">Stereo</span>
          </div>

          <div class="buf-meter-container">
            <span>Buffer: <span id="buf-val" class="status-highlight-red">0.0</span>s</span>
            <div class="buf-bar-bg">
              <div class="buf-bar-fill" id="buf-bar"></div>
            </div>
          </div>
        </div>

        <div class="connection-status-line" id="conn-status">
          <span>CONNECTED</span>
          <span>|</span>
          <span>Bitrate: <span class="status-highlight-red" id="conn-br">-- kbps</span></span>
          <span>|</span>
          <span>Data Received <span class="status-highlight-red" id="conn-rx">0.00 MB</span></span>
        </div>

        <div class="time-vu-row">
          <div class="local-time-display" id="local-clock">Time: --:--:--</div>

          <div class="vu-container-global">
            <div class="led-indicator" id="global-led"></div>
            <div class="vu-meter-panel">
              <div class="vu-scale-labels" id="global-scale-labels"></div>
              <div class="vu-bar-bg">
                <div id="global-grid-lines"></div>
                <div class="vu-bar-fill" id="global-vu-fill"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="playlist-container" id="playlist"></div>

  <div class="page-version-footer">ver.1.5.0</div>

  <!-- Dual Engines: Video for HLS, Audio for Direct Stream -->
  <video id="media-player" crossorigin="anonymous" playsinline webkit-playsinline></video>

  <script>
    const channels = [
      { name: "Al Jazeera", location: "Doha, Qatar", utc: "UTC+3", tz: "Asia/Qatar", about: "Qatar-based state-funded international news television network.", url: "https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8" },
      { name: "ABC Australia", location: "Sydney, Australia", utc: "UTC+10", tz: "Australia/Sydney", about: "Australia’s public broadcasting service.", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { name: "Arirang Korea", location: "Seoul, South Korea", utc: "UTC+9", tz: "Asia/Seoul", about: "South Korean English-language international broadcasting network.", url: "https://amdlive-ch02-ctnd-com.akamaized.net/arirang_2ch/smil:arirang_2ch.smil/playlist.m3u8" },
      { name: "BBC News", location: "London, UK", utc: "UTC+1", tz: "Europe/London", about: "The operational business division of the British Broadcasting Corporation (BBC).", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8" },
      { name: "CGTN", location: "Beijing, China", utc: "UTC+8", tz: "Asia/Shanghai", about: "China Global Television Network, the international division of CCTV.", url: "https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8" },
      { name: "CNA", location: "Singapore", utc: "UTC+8", tz: "Asia/Singapore", about: "Channel NewsAsia, a Singaporean multinational news channel.", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8" },
      { name: "NHK English", location: "Tokyo, Japan", utc: "UTC+9", tz: "Asia/Tokyo", about: "NHK World-Japan, the international broadcasting service of NHK.", url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
      { name: "DW En", location: "Berlin, Germany", utc: "UTC+2", tz: "Europe/Berlin", about: "Deutsche Welle English, Germany's public international broadcaster.", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { name: "France 24 En", location: "Paris, France", utc: "UTC+2", tz: "Europe/Paris", about: "The English-language arm of France's state-owned international news network.", url: "https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8" },
      { name: "France 24 Fr", location: "Paris, France", utc: "UTC+2", tz: "Europe/Paris", about: "The French-language domestic and international channel of France 24.", url: "https://live.france24.com/hls/live/2037179/F24_FR_HI_HLS/master_5000.m3u8" },
      { name: "GB News", location: "London, UK", utc: "UTC+1", tz: "Europe/London", about: "A British free-to-air news and opinion channel.", url: "https://cdn-apse1-prod.tsv2.amagi.tv/linear/amg01076-lightningintern-gbnewsnz-samsungnz/playlist.m3u8" },
      { name: "Tagesschau24", location: "Hamburg, Germany", utc: "UTC+2", tz: "Europe/Berlin", about: "A German specialized news channel operated by ARD.", url: "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8" },
      { name: "TPTV", location: "Bangkok, Thailand", utc: "UTC+7", tz: "Asia/Bangkok", about: "Thai Parliament Television.", url: "https://tv-live.tpchannel.org/live/tv_1080p.m3u8?vhost=tv-live.tpchannel.org" },
      { name: "Classic FM", location: "London, UK", utc: "UTC+1", tz: "Europe/London", about: "UK classic music radio stream based in Leicester Square, London.", url: "http://media-ice.musicradio.com/ClassicFMMP3", kbps: 128 },
      { name: "Klassik-1", location: "Berlin, Germany", utc: "UTC+2", tz: "Europe/Berlin", about: "German classical music online radio station based in Berlin.", url: "http://icepool.silvacast.com/KLASSIK1.mp3", kbps: 128 },
      { name: "บ้านธรรมะ", location: "Bangkok, Thailand", utc: "UTC+7", tz: "Asia/Bangkok", about: "Dhamma media and radio broadcasting operated by the Dhamma Study and Propagation Foundation.", url: "https://radio10.plathong.net/7238/;stream.mp3", kbps: 128 }
    ];

    const dbMarks = [ { db: "-20", pos: 0 }, { db: "-10", pos: 35 }, { db: "-5", pos: 60 }, { db: "0", pos: 80, isZero: true }, { db: "+2", pos: 90 }, { db: "+4", pos: 100 } ];
    const VU_REF_DBFS = -18;
    const SIGNAL_PEAK_MIN = 0.0005;
    const SCOPE_GAIN = 2.5;
    const VU_WINDOW_SEC = 0.3;
    const METER_OFFSET_SEC = 0;
    const LOWEST_QUALITY = true;
    const SEG_KEEP_SEC = 20;
    const AUTO_SWITCH_MS = 4000;
    const METER_ON_IOS = true;

    const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const playlistContainer = document.getElementById('playlist');
    const videoEl = document.getElementById('media-player');
    const canvas = document.getElementById('oscilloscope');
    const canvasCtx = canvas.getContext('2d');

    const utcClockElem = document.getElementById('utc-clock');
    const localClockElem = document.getElementById('local-clock');
    const stationInfoRow = document.getElementById('station-info-row');
    const stationFixedTitle = document.getElementById('station-fixed-title');
    const stationTickerText = document.getElementById('station-ticker-text');
    const statsPanel = document.getElementById('audio-content-stats');
    const statMono = document.getElementById('stat-mono');
    const statStereo = document.getElementById('stat-stereo');
    const bufValElem = document.getElementById('buf-val');
    const bufBarElem = document.getElementById('buf-bar');
    const connBrElem = document.getElementById('conn-br');
    const connRxElem = document.getElementById('conn-rx');
    const globalVuFill = document.getElementById('global-vu-fill');
    const globalLed = document.getElementById('global-led');

    // Dual Engine Vars
    let player = videoEl; // active player pointer
    let audioEl = null;
    let directSrc = null;
    let directAttempt = 0;
    let directRxTimer = null;
    let directBufStart = null;

    let activeIndex = -1;
    let hls = null;
    let usingNative = false;

    let audioCtx = null;
    let analyser = null;
    let analyserL = null;
    let analyserR = null;
    let splitter = null;
    let sourceNodeVideo = null;
    let animFrameId = null;

    let currentLevel = 0;
    let stereoRatio = 0;
    let meterMode = 'none';
    let sessionId = 0;
    let playStartedAt = 0;
    let silentSince = 0;

    let segEntries = [];
    let initSegs = {};
    let offlineCtx = null;
    let decodeQueue = 0;
    let totalRxBytes = 0;
    let currentBitrate = 0;
    const segTimeB = new Uint8Array(2048);

    function initGlobalVuMeterUI() {
      document.getElementById('global-scale-labels').innerHTML = dbMarks.map(m => `<span class="scale-mark ${m.isZero ? 'zero-db' : ''}" style="left: ${m.pos}%;">${m.db}</span>`).join('');
      document.getElementById('global-grid-lines').innerHTML = dbMarks.map(m => `<div class="vu-grid-line ${m.isZero ? 'zero-line' : ''}" style="left: ${m.pos}%;"></div>`).join('');
    }
    initGlobalVuMeterUI();

    function updateClocks() {
      const now = new Date();
      utcClockElem.innerText = `UTC ${String(now.getUTCHours()).padStart(2,'0')}:${String(now.getUTCMinutes()).padStart(2,'0')}:${String(now.getUTCSeconds()).padStart(2,'0')}`;
      if (activeIndex !== -1 && channels[activeIndex]?.tz) {
        try {
          const formatter = new Intl.DateTimeFormat('en-GB', { timeZone: channels[activeIndex].tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
          localClockElem.innerText = `Time: ${formatter.format(now)}`;
        } catch (e) { localClockElem.innerText = "Time: --:--:--"; }
      }
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    function resizeCanvas() { canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1); canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1); }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    channels.forEach((channel, index) => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.dataset.index = index;
      
      // Removed .radio-dot completely, using pure button design
      item.innerHTML = `
        <span class="channel-name">${channel.name}</span>
      `;
      
      item.addEventListener('click', () => toggleChannel(index));
      playlistContainer.appendChild(item);
    });

    function initAudioContext() {
      if (IS_IOS && meterMode !== 'analyser') return;
      if (!audioCtx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AC();
          analyser = audioCtx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0;
          analyserL = audioCtx.createAnalyser(); analyserL.fftSize = 2048;
          analyserR = audioCtx.createAnalyser(); analyserR.fftSize = 2048;
          splitter = audioCtx.createChannelSplitter(2);
          analyser.connect(audioCtx.destination);
          splitter.connect(analyserL, 0);
          splitter.connect(analyserR, 1);

          sourceNodeVideo = audioCtx.createMediaElementSource(videoEl);
          sourceNodeVideo.connect(analyser);
          sourceNodeVideo.connect(splitter);
        } catch (e) { console.log("AudioContext Notice:", e); }
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    videoEl.addEventListener('playing', triggerUIPlay);

    function triggerUIPlay() {
      if (activeIndex !== -1) {
        const ch = channels[activeIndex];
        stationFixedTitle.innerText = `${ch.name} :`;
        const detailText = `${ch.location} | ${ch.utc} | ${ch.about} \u00A0\u00A0•\u00A0\u00A0 `;
        stationTickerText.innerText = detailText + detailText;
        stationTickerText.style.animation = 'none';
        stationTickerText.offsetHeight; 
        stationTickerText.style.animation = 'ticker-scroll-slow 45s linear infinite';
        stationInfoRow.style.visibility = 'visible';
        updateClocks();
      }
    }

    function toggleChannel(index) {
      if (!IS_IOS || METER_ON_IOS) { try { initAudioContext(); } catch(e){} }
      const items = document.querySelectorAll('.channel-item');
      if (activeIndex === index) { stopAudio(); items[index].classList.remove('active'); activeIndex = -1; return; }
      if (activeIndex !== -1) items[activeIndex].classList.remove('active');
      stationInfoRow.style.visibility = 'hidden';
      activeIndex = index;
      items[index].classList.add('active');
      playAudio(channels[index].url);
    }

    function onPlayStarted() {
      if (!IS_IOS || METER_ON_IOS) { try { initAudioContext(); } catch(e){} }
      playStartedAt = performance.now();
      silentSince = 0;
      startVUMeter();
    }

    // --- Media Segments Engine (HLS) ---
    function getOfflineCtx() { if (!offlineCtx) { const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; offlineCtx = new OAC(2, 1, 44100); } return offlineCtx; }
    function decodeBuffer(arrayBuffer) { return new Promise((resolve, reject) => { const p = getOfflineCtx().decodeAudioData(arrayBuffer, resolve, reject); if (p && typeof p.catch === 'function') p.catch(() => {}); }); }
    async function ingestSegment(sid, init, media, start) {
      if (decodeQueue >= 4) return;
      decodeQueue++;
      try {
        const joined = new Uint8Array(init.length + media.length); joined.set(init, 0); joined.set(media, init.length);
        const audio = await decodeBuffer(joined.buffer);
        if (sid !== sessionId) return;
        const n = audio.length, rate = audio.sampleRate;
        const L = audio.getChannelData(0), R = audio.numberOfChannels > 1 ? audio.getChannelData(1) : null;
        const mono = new Float32Array(n);
        let sumDiff = 0, sumTotal = 0;
        for (let i = 0; i < n; i++) {
          const l = L[i], r = R ? R[i] : l; mono[i] = (l + r) * 0.5;
          const d = l - r; sumDiff += d * d; sumTotal += l * l + r * r;
        }
        const stereo = R ? (sumDiff / (sumTotal + 1e-12) > 0.02) : false;
        segEntries.push({ start: start, end: start + n / rate, rate: rate, mono: mono, stereo: stereo });
        segEntries = segEntries.filter(e => e.end > player.currentTime - SEG_KEEP_SEC).slice(-12);
      } catch (e) {} finally { decodeQueue--; }
    }

    function handleBufferAppending(sid, d) {
      if (sid !== sessionId || !d || !d.data || d.type === 'video') return;
      const u8 = (d.data instanceof Uint8Array) ? d.data : new Uint8Array(d.data);
      if (u8.length < 12) return;
      totalRxBytes += u8.length;
      const tag = String.fromCharCode(u8[4], u8[5], u8[6], u8[7]);
      if (tag === 'ftyp' || tag === 'moov') { initSegs[d.type] = u8.slice(); return; }
      if (meterMode !== 'segments') return;
      const init = initSegs[d.type];
      if (!init || !d.frag) return;
      const start = Number.isFinite(d.frag.startPTS) ? d.frag.startPTS : d.frag.start;
      if (Number.isFinite(start)) ingestSegment(sid, init, u8.slice(), start);
    }

    function segmentFrame() {
      const t = player.currentTime + METER_OFFSET_SEC;
      let e = null;
      for (let i = segEntries.length - 1; i >= 0; i--) { if (t >= segEntries[i].start && t < segEntries[i].end) { e = segEntries[i]; break; } }
      if (!e) return null;
      const idx = Math.min(e.mono.length - 1, Math.max(0, Math.floor((t - e.start) * e.rate)));
      const nVU = Math.max(1, Math.floor(VU_WINDOW_SEC * e.rate));
      const a = Math.max(0, idx - nVU);
      let sum = 0;
      for (let i = a; i <= idx; i++) { sum += e.mono[i] * e.mono[i]; }
      for (let k = 0; k < segTimeB.length; k++) {
        const src = idx - segTimeB.length + 1 + k;
        segTimeB[k] = Math.max(0, Math.min(255, Math.round(128 + (src >= 0 ? e.mono[src] : 0) * 127)));
      }
      return { rms: Math.sqrt(sum / (idx - a + 1)), stereo: e.stereo };
    }

    // --- Direct Audio Engine (MP3/Icecast) ---
    function startDirectAudio(url) {
      directAttempt++;
      const sid = directAttempt;
      usingNative = true;

      // สร้างลูปทดลองเชื่อมต่อเผื่อติดเรื่อง HTTPS / CORS
      const cands = [];
      if (location.protocol === 'https:' && /^http:/i.test(url)) cands.push(url.replace(/^http:/i, 'https:')); 
      cands.push(url);
      
      const list = [];
      cands.forEach(u => { list.push({ u: u, cors: true }); list.push({ u: u, cors: false }); });

      audioEl = new Audio();
      audioEl.setAttribute('playsinline', '');
      player = audioEl;

      function attemptAt(i) {
        if (sid !== directAttempt) return;
        if (i >= list.length) {
          const ch = channels[activeIndex];
          if (ch) {
            stationFixedTitle.innerText = ch.name + ' :';
            stationTickerText.style.animation = 'none';
            stationTickerText.innerText = 'Cannot open this stream (Mixed Content / Server offline) \u00A0\u00A0•\u00A0\u00A0 ';
            stationInfoRow.style.visibility = 'visible';
          }
          return;
        }

        const cors = list[i].cors;
        let done = false;
        let tm = null;

        const cleanup = () => {
          done = true; clearTimeout(tm);
          audioEl.removeEventListener('error', onErr);
          audioEl.removeEventListener('playing', onOk);
        };
        const onErr = () => { if (!done) { cleanup(); attemptAt(i + 1); } };
        const onOk = () => { if (!done) { cleanup(); if (sid === directAttempt) onDirectPlaying(cors); } };

        tm = setTimeout(onErr, 10000); // ให้เวลาเชื่อมต่อสูงสุด 10 วินาที
        audioEl.addEventListener('error', onErr);
        audioEl.addEventListener('playing', onOk);
        audioEl.crossOrigin = cors ? 'anonymous' : null;
        audioEl.src = list[i].u;
        const p = audioEl.play();
        if (p && p.catch) p.catch(() => {});
      }
      attemptAt(0);
    }

    function onDirectPlaying(cors) {
      if (cors && (!IS_IOS || METER_ON_IOS)) {
        try {
          initAudioContext();
          directSrc = audioCtx.createMediaElementSource(audioEl);
          directSrc.connect(analyser);
          directSrc.connect(splitter);
          meterMode = 'analyser';
        } catch (e) { meterMode = 'none'; }
      } else {
        meterMode = 'none'; // Fallback เล่นเสียงได้แต่กราฟนิ่ง หากเซิร์ฟเวอร์บล็อก CORS
      }
      
      videoEl.dispatchEvent(new Event('playing')); // ดึงให้ Ticker ทำงาน
      onPlayStarted();
      
      // จำลอง Data Received & Bitrate ให้สตรีมตรง
      clearInterval(directRxTimer);
      directBufStart = null;
      directRxTimer = setInterval(() => {
        try {
          const b = audioEl.buffered;
          if (!b.length) return;
          if (directBufStart === null) directBufStart = b.start(0);
          const sec = Math.max(0, b.end(b.length - 1) - directBufStart);
          const kbps = (channels[activeIndex] && channels[activeIndex].kbps) || 128;
          totalRxBytes = sec * kbps * 125;
          currentBitrate = kbps;
        } catch (e) {}
      }, 500);
    }

    // --- Main Play/Stop Router ---
    function playAudio(url) {
      stopAudio(false);
      
      if (url.includes('.m3u8')) {
        player = videoEl;
        player.disableRemotePlayback = true;
        const sid = sessionId;

        if (window.Hls && Hls.isSupported()) {
          usingNative = false;
          meterMode = IS_IOS ? 'segments' : 'analyser';
          hls = new Hls({ enableWorker: true, startLevel: 0 });
          hls.loadSource(url);
          hls.attachMedia(player);
          hls.on(Hls.Events.MANIFEST_PARSED, () => { if (LOWEST_QUALITY) hls.autoLevelCapping = 0; player.play().then(onPlayStarted).catch(e => console.log("Play error:", e)); });
          hls.on(Hls.Events.LEVEL_LOADED, (event, data) => { if (data.details && data.details.totalduration) currentBitrate = Math.round((data.details.totalduration > 0 ? (data.details.bandwidth || 128000) : 128000) / 1000); });
          hls.on(Hls.Events.BUFFER_APPENDING, (event, data) => handleBufferAppending(sid, data));
        } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
          usingNative = true;
          meterMode = IS_IOS ? 'none' : 'analyser';
          player.src = url;
          player.play().then(onPlayStarted).catch(e => console.log("Play error:", e));
        }
      } else {
        startDirectAudio(url);
      }
    }

    function stopAudio(clearSrc = true) {
      sessionId++;
      directAttempt++;
      clearInterval(directRxTimer);

      if (directSrc) { try { directSrc.disconnect(); } catch(e) {} directSrc = null; }
      if (audioEl) {
        try { audioEl.pause(); } catch(e) {}
        audioEl.removeAttribute('src');
        try { audioEl.load(); } catch(e) {}
        audioEl = null;
      }
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (hls) { hls.destroy(); hls = null; }
      
      player = videoEl;
      player.pause();
      if (clearSrc) { player.removeAttribute('src'); player.load(); }
      
      segEntries = []; initSegs = {}; decodeQueue = 0; totalRxBytes = 0; currentBitrate = 0;
      meterMode = 'none'; silentSince = 0; currentLevel = 0; stereoRatio = 0;
      drawScopeFlat();
      stationInfoRow.style.visibility = 'hidden';
      if (statsPanel) statsPanel.style.display = 'none';
      statMono.className = 'stat-term disable-gray'; statStereo.className = 'stat-term disable-gray';
      globalVuFill.style.width = '0%'; globalLed.style.backgroundColor = '#222222'; globalLed.style.boxShadow = 'none';
    }

    // --- Drawing & Meters ---
    function vuToPercent(vu) {
      const first = parseFloat(dbMarks[0].db), last = parseFloat(dbMarks[dbMarks.length - 1].db);
      if (vu <= first) return 0; if (vu >= last) return 100;
      for (let i = 1; i < dbMarks.length; i++) {
        const d1 = parseFloat(dbMarks[i].db);
        if (vu <= d1) { const d0 = parseFloat(dbMarks[i - 1].db), p0 = dbMarks[i - 1].pos, p1 = dbMarks[i].pos; return p0 + (vu - d0) / (d1 - d0) * (p1 - p0); }
      }
      return 100;
    }

    function drawScope(timeData, isPlaying) {
      const width = canvas.width, height = canvas.height, centerY = height / 2;
      canvasCtx.clearRect(0, 0, width, height); canvasCtx.lineWidth = 1.5 * (window.devicePixelRatio || 1);
      canvasCtx.strokeStyle = '#22c55e'; canvasCtx.shadowColor = '#22c55e'; canvasCtx.shadowBlur = 4;

      if (!isPlaying || activeIndex === -1 || !timeData || timeData.length === 0) { canvasCtx.beginPath(); canvasCtx.moveTo(0, centerY); canvasCtx.lineTo(width, centerY); canvasCtx.stroke(); return; }
      const numBars = 75, barWidth = width / numBars, step = Math.max(1, Math.floor(timeData.length / numBars));

      for (let i = 0; i < numBars; i++) {
        let peak = 0;
        for (let j = 0; j < step; j++) { const v = Math.abs((timeData[i * step + j] - 128) / 128.0); if (v > peak) peak = v; }
        const barHeight = Math.min(peak * SCOPE_GAIN, 1) * (height * 0.85);
        if (barHeight > 1) { canvasCtx.beginPath(); canvasCtx.moveTo(i * barWidth, centerY - barHeight / 2); canvasCtx.lineTo(i * barWidth, centerY + barHeight / 2); canvasCtx.stroke(); }
        else { canvasCtx.beginPath(); canvasCtx.moveTo(i * barWidth, centerY); canvasCtx.lineTo(i * barWidth + 1, centerY); canvasCtx.stroke(); }
      }
    }

    function drawScopeFlat() { drawScope(null, false); }

    function startVUMeter() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      const timeF = analyser ? new Float32Array(analyser.fftSize) : null;
      const timeB = analyser ? new Uint8Array(analyser.fftSize) : null;
      const bufL = analyserL ? new Float32Array(analyserL.fftSize) : null;
      const bufR = analyserR ? new Float32Array(analyserR.fftSize) : null;

      function update() {
        const nowMs = performance.now();
        const playing = !player.paused;
        let targetLevel = 0, hasRealData = false, scopeData = null, stereoState = null, peak = 0;

        if (meterMode === 'analyser' && analyser && timeF) {
          analyser.getFloatTimeDomainData(timeF);
          let sum = 0; for (let i = 0; i < timeF.length; i++) { const v = timeF[i]; sum += v * v; if (Math.abs(v) > peak) peak = Math.abs(v); }
          hasRealData = peak > SIGNAL_PEAK_MIN;

          if (hasRealData) {
            targetLevel = vuToPercent(20 * Math.log10(Math.sqrt(sum / timeF.length) + 1e-9) - VU_REF_DBFS);
            analyser.getByteTimeDomainData(timeB); scopeData = timeB;
            if (bufL && bufR) {
              analyserL.getFloatTimeDomainData(bufL); analyserR.getFloatTimeDomainData(bufR);
              let sumDiff = 0, sumTotal = 0;
              for (let i = 0; i < bufL.length; i++) { const d = bufL[i] - bufR[i]; sumDiff += d * d; sumTotal += bufL[i] * bufL[i] + bufR[i] * bufR[i]; }
              stereoRatio = stereoRatio * 0.97 + (sumDiff / (sumTotal + 1e-12)) * 0.03;
              stereoState = stereoRatio > 0.02;
            }
          }
          if (playing && hls && nowMs - playStartedAt > 2000) {
            if (hasRealData) silentSince = 0;
            else if (!silentSince) silentSince = nowMs;
            else if (nowMs - silentSince > AUTO_SWITCH_MS) { meterMode = 'segments'; silentSince = 0; }
          }
        } else if (meterMode === 'segments') {
          const f = segmentFrame();
          if (f) { hasRealData = true; targetLevel = vuToPercent(20 * Math.log10(f.rms + 1e-9) - VU_REF_DBFS); scopeData = segTimeB; stereoState = f.stereo; }
        }

        currentLevel += (targetLevel - currentLevel) * (targetLevel > currentLevel ? 0.5 : 0.08);

        if (activeIndex !== -1) {
          let bufSec = 0;
          if (player.buffered && player.buffered.length > 0) {
            for (let i = 0; i < player.buffered.length; i++) {
              if (player.currentTime >= player.buffered.start(i) && player.currentTime <= player.buffered.end(i)) { bufSec = player.buffered.end(i) - player.currentTime; break; }
            }
          }
          bufValElem.innerText = bufSec.toFixed(1);
          const bufPercent = Math.min(100, (bufSec / 25) * 100);
          bufBarElem.style.width = bufPercent.toFixed(1) + '%';
          if (bufPercent > 50) { bufBarElem.classList.add('green-status'); bufBarElem.classList.remove('red-status'); }
          else { bufBarElem.classList.add('red-status'); bufBarElem.classList.remove('green-status'); }

          connBrElem.innerText = `${currentBitrate || 128} kbps`;
          connRxElem.innerText = `${(totalRxBytes / (1024 * 1024)).toFixed(2)} MB`;

          globalVuFill.style.width = currentLevel.toFixed(1) + '%';
          if (currentLevel > 10) { globalLed.style.backgroundColor = '#22c55e'; globalLed.style.boxShadow = '0 0 6px #22c55e'; }
          else { globalLed.style.backgroundColor = '#222222'; globalLed.style.boxShadow = 'none'; }

          if (statsPanel) {
            statsPanel.style.display = 'block';
            if (stereoState === true) { statStereo.className = 'stat-term active-red'; statMono.className = 'stat-term disable-gray'; }
            else if (stereoState === false) { statMono.className = 'stat-term active-red'; statStereo.className = 'stat-term disable-gray'; }
            else if (!hasRealData) { statMono.className = 'stat-term disable-gray'; statStereo.className = 'stat-term disable-gray'; }
          }
          drawScope(hasRealData ? scopeData : null, playing);
        }
        animFrameId = requestAnimationFrame(update);
      }
      update();
    }
    drawScopeFlat();
  </script>
</body>
</html>
