<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream News - V1.0.7</title>
  <!-- HLS.js Library for playing .m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow: hidden;
    }

    .grid-page {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    /* ซ่อนหน้าที่ไม่ได้เลือก */
    .grid-page.hidden {
      display: none !important;
    }

    .video-card {
      background-color: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .video-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      border-radius: 4px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls-panel {
      width: 100%;
      padding-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* พื้นที่ซ้ายสุดของ Controls Panel */
    .panel-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow: hidden;
    }

    /* ปุ่ม Switch Page 1 / Page 2 */
    .page-btn {
      background-color: #007bff;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #0056b3;
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .page-btn:hover {
      background-color: #0056b3;
    }

    /* แสดงเวอร์ชันซ้ายล่าง */
    .version-tag {
      font-size: 11px;
      color: #777777;
      font-family: monospace;
      user-select: none;
    }

    /* พื้นที่ขวาสุดของ Controls Panel (Label + Reload + Unmute) */
    .panel-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .channel-title {
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      white-space: nowrap;
    }

    /* ปุ่ม Reload */
    .reload-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      cursor: pointer;
      background-color: #2a2a2a;
      color: #28a745;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      transition: background-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .reload-btn:hover {
      background-color: #3a3a3a;
      color: #34d058;
    }

    .reload-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .reload-btn:active svg {
      transform: rotate(180deg);
    }

    .audio-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      background-color: #2a2a2a;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      transition: background-color 0.2s;
    }

    .audio-toggle:hover {
      background-color: #3a3a3a;
    }

    .audio-toggle input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
      accent-color: #007bff;
    }
  </style>
</head>
<body>

  <!-- ==================== PAGE 1 ==================== -->
  <div id="page1" class="grid-page">
    
    <!-- CH1: Al Jazeera -->
    <div class="video-card">
      <div class="video-wrapper">

            Reload

          <label class="audio-toggle">

  <script>
    const streams = [
      // Page 1
      { id: 'video1', page: 1, url: 'https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8' },
      { id: 'video2', page: 1, url: 'https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8' },
      { id: 'video3', page: 1, url: 'https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8' },
      { id: 'video4', page: 1, url: 'https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8' },
      
      // Page 2
      { id: 'video5', page: 2, url: 'https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8' },
      { id: 'video6', page: 2, url: 'https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8' },
      { id: 'video7', page: 2, url: 'https://thaipbs-mcx0wm.cdn.byteark.com/vtt-live/variant_1080p.m3u8' },
      { id: 'video8', page: 2, url: 'https://tv-live.tpchannel.org/live/tv_1080p.m3u8?vhost=tv-live.tpchannel.org' }
    ];

    // คลังข้อมูล URL สตรีมที่ยังไม่ได้ใช้งาน (สำรองไว้ใช้ในอนาคต)
    const unusedBackupStreams = [
      { name: 'France 24 English', url: 'https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8' },
      { name: 'ThaiPBS ByteArk Backup 1', url: 'https://thaipbs-live.cdn.byteark.com/live/playlist_1080p.m3u8' },
      { name: 'ThaiPBS Official Backup 2', url: 'https://live-cdn.thaipbs.or.th/live/thaipbs/hd/playlist.m3u8' }
    ];

    const hlsInstances = {};
    let currentPage = 1;

    function initVideo(id, url) {
      const video = document.getElementById(id);
      if (!video) return;

      stopVideo(id); // ล้างสตรีมเดิมก่อนดึงใหม่

      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hlsInstances[id] = hls;
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(() => {
            console.log('Autoplay blocked for ' + id);
          });
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function () {
          video.play().catch(() => {
            console.log('Autoplay blocked for ' + id);
          });
        });
      }
    }

    function stopVideo(id) {
      const video = document.getElementById(id);
      if (hlsInstances[id]) {
        hlsInstances[id].destroy();
        delete hlsInstances[id];
      }
      if (video) {
        video.pause();
        video.removeAttribute('src');
        video.load();
      }
    }

    function reloadVideo(videoId) {
      const stream = streams.find(s => s.id === videoId);
      if (stream) {
        initVideo(stream.id, stream.url);
      }
    }

    function toggleAudio(videoId, checkbox) {
      const video = document.getElementById(videoId);
      if (video) {
        video.muted = !checkbox.checked;
      }
    }

    function switchPage(pageNumber) {
      currentPage = pageNumber;

      const page1Elem = document.getElementById('page1');
      const page2Elem = document.getElementById('page2');

      if (pageNumber === 1) {
        page2Elem.classList.add('hidden');
        page1Elem.classList.remove('hidden');

        // หยุด Page 2 เพื่อประหยัด CPU/Bandwidth
        streams.filter(s => s.page === 2).forEach(s => stopVideo(s.id));
        // เล่น Page 1
        streams.filter(s => s.page === 1).forEach(s => initVideo(s.id, s.url));
      } else {
        page1Elem.classList.add('hidden');
        page2Elem.classList.remove('hidden');

        // หยุด Page 1
        streams.filter(s => s.page === 1).forEach(s => stopVideo(s.id));
        // เล่น Page 2
        streams.filter(s => s.page === 2).forEach(s => initVideo(s.id, s.url));
      }
    }

    // เริ่มต้นโหลดสตรีม Page 1 เมื่อเปิดหน้าเว็บครั้งแรก
    window.addEventListener('DOMContentLoaded', () => {
      streams.forEach(stream => {
        const video = document.getElementById(stream.id);
        if (video) video.muted = true; // ตั้งค่าเริ่มต้นให้ Muted
      });

      // โหลดเฉพาะสตรีม Page 1
      streams.filter(s => s.page === 1).forEach(s => initVideo(s.id, s.url));
    });
  </script>
