<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream News</title>
  <!-- HLS.js Library for playing .m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow: hidden;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .video-card {
      background-color: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .video-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      border-radius: 4px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .controls-panel {
      width: 100%;
      padding-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .channel-title {
      font-size: 13px;
      font-weight: 600;
      color: #cccccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* ปุ่ม Reload ตรงกลาง */
    .reload-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      cursor: pointer;
      background-color: #2a2a2a;
      color: #28a745;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      transition: background-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .reload-btn:hover {
      background-color: #3a3a3a;
      color: #34d058;
    }

    .reload-btn svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .reload-btn:active svg {
      transform: rotate(180deg);
    }

    .audio-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      background-color: #2a2a2a;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #444;
      transition: background-color 0.2s;
    }

    .audio-toggle:hover {
      background-color: #3a3a3a;
    }

    .audio-toggle input[type="checkbox"] {
      cursor: pointer;
      width: 15px;
      height: 15px;
      accent-color: #007bff;
    }
  </style>
</head>
<body>

  <div class="grid-container">
    <!-- Channel 1: Al Jazeera -->
    <div class="video-card">
      <div class="video-wrapper">
        <video id="video1" controls muted playsinline></video>
      </div>
      <div class="controls-panel">
        <span class="channel-title">Channel 1 (Al Jazeera)</span>
        
        <!-- ปุ่ม Reload ตรงกลาง -->
        <button class="reload-btn" onclick="reloadVideo('video1')" title="Reload Stream">
          <svg viewBox="0 0 16 16">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 1.05a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5H5a.5.5 0 0 1 0-1h2.5V1.55a.5.5 0 0 1 .5-.5z"/>
          </svg>
          Reload
        </button>

        <label class="audio-toggle">
          <input type="checkbox" id="mute1" onchange="toggleAudio('video1', this)">
          <span>Unmute</span>
        </label>
      </div>
    </div>

    <!-- Channel 2: BBC News -->
    <div class="video-card">
      <div class="video-wrapper">
        <video id="video2" controls muted playsinline></video>
      </div>
      <div class="controls-panel">
        <span class="channel-title">Channel 2 (BBC News)</span>
        
        <!-- ปุ่ม Reload ตรงกลาง -->
        <button class="reload-btn" onclick="reloadVideo('video2')" title="Reload Stream">
          <svg viewBox="0 0 16 16">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 1.05a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5H5a.5.5 0 0 1 0-1h2.5V1.55a.5.5 0 0 1 .5-.5z"/>
          </svg>
          Reload
        </button>

        <label class="audio-toggle">
          <input type="checkbox" id="mute2" onchange="toggleAudio('video2', this)">
          <span>Unmute</span>
        </label>
      </div>
    </div>

    <!-- Channel 3: CGTN -->
    <div class="video-card">
      <div class="video-wrapper">
        <video id="video3" controls muted playsinline></video>
      </div>
      <div class="controls-panel">
        <span class="channel-title">Channel 3 (CGTN)</span>
        
        <!-- ปุ่ม Reload ตรงกลาง -->
        <button class="reload-btn" onclick="reloadVideo('video3')" title="Reload Stream">
          <svg viewBox="0 0 16 16">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 1.05a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5H5a.5.5 0 0 1 0-1h2.5V1.55a.5.5 0 0 1 .5-.5z"/>
          </svg>
          Reload
        </button>

        <label class="audio-toggle">
          <input type="checkbox" id="mute3" onchange="toggleAudio('video3', this)">
          <span>Unmute</span>
        </label>
      </div>
    </div>

    <!-- Channel 4: CNA -->
    <div class="video-card">
      <div class="video-wrapper">
        <video id="video4" controls muted playsinline></video>
      </div>
      <div class="controls-panel">
        <span class="channel-title">Channel 4 (CNA)</span>
        
        <!-- ปุ่ม Reload ตรงกลาง -->
        <button class="reload-btn" onclick="reloadVideo('video4')" title="Reload Stream">
          <svg viewBox="0 0 16 16">
            <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
            <path d="M8 1.05a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-.5.5H5a.5.5 0 0 1 0-1h2.5V1.55a.5.5 0 0 1 .5-.5z"/>
          </svg>
          Reload
        </button>

        <label class="audio-toggle">
          <input type="checkbox" id="mute4" onchange="toggleAudio('video4', this)">
          <span>Unmute</span>
        </label>
      </div>
    </div>
  </div>

  <script>
    const streams = [
      { id: 'video1', url: 'https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8' },
      { id: 'video2', url: 'https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8' },
      { id: 'video3', url: 'https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8' },
      { id: 'video4', url: 'https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8' }
    ];

    // เก็บอ้างอิง HLS Instance ของแต่ละวิดีโอ
    const hlsInstances = {};

    function initVideo(id, url) {
      const video = document.getElementById(id);
      
      // ทำลาย HLS Instance เดิมหากมีอยู่
      if (hlsInstances[id]) {
        hlsInstances[id].destroy();
        delete hlsInstances[id];
      }

      if (Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hlsInstances[id] = hls;
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(() => {
            console.log('Autoplay blocked for ' + id);
          });
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // รองรับ Safari / iOS Native HLS
        video.src = url;
        video.addEventListener('loadedmetadata', function () {
          video.play().catch(() => {
            console.log('Autoplay blocked for ' + id);
          });
        });
      }
    }

    function reloadVideo(videoId) {
      const stream = streams.find(s => s.id === videoId);
      if (stream) {
        initVideo(stream.id, stream.url);
      }
    }

    function toggleAudio(videoId, checkbox) {
      const video = document.getElementById(videoId);
      video.muted = !checkbox.checked;
    }

    // เริ่มต้นโหลดสตรีมเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', () => {
      streams.forEach(stream => {
        const video = document.getElementById(stream.id);
        video.muted = true; // ปิดเสียงเป็นค่าเริ่มต้น
        initVideo(stream.id, stream.url);
      });
    });
  </script>
</body>
</html>
