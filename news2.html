<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International News Desktop V1.0.0</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050a12;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 20px 20px 20px;
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0) 100%),
        url('ert92.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    /* Sticky Fixed Header Section */
    .sticky-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 12px 12px 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 0 0 8px 8px;
    }

    .header-container {
      text-align: left;
      padding-left: 6px;
    }

    .callsign {
      font-size: 26px;
      font-weight: 700;
      color: #a0a0a0;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    h1.page-title {
      font-size: 40px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
      margin: 0;
      line-height: 1.1;
    }

    .utc-time-display {
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      white-space: nowrap;
    }

    .station-info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 10px;
      min-height: 36px;
      visibility: hidden;
      width: 100%;
    }

    .station-location-text {
      font-size: 26px !important;
      font-weight: 700;
      color: #ff9800;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .local-time-display {
      font-size: 26px !important;
      font-weight: 700;
      color: #ff9800;
      font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", monospace;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.2;
    }

    .scope-container {
      position: relative;
      width: 100%;
      height: 50px;
      background-color: rgba(5, 11, 5, 0.92);
      border: 1px solid rgba(28, 59, 28, 0.85);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.05), 0 4px 12px rgba(0, 0, 0, 0.7);
      margin-bottom: 6px;
    }

    .scope-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 20px 10px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 0, 0.08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 0, 0.08) 1px, transparent 1px);
      pointer-events: none;
    }

    canvas#oscilloscope {
      display: block;
      width: 100%;
      height: 100%;
    }

    .audio-content-stats {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: none;
      margin-top: 4px;
      padding-left: 4px;
      transition: display 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      color: #a0a0a0;
    }

    .channels-indicator {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stat-term {
      transition: color 0.15s ease;
    }

    .stat-term.active-red {
      color: #ef4444 !important;
    }

    .stat-term.disable-gray {
      color: #555555;
    }

    /* Layout แบบ Split Grid สำหรับ Desktop */
    .main-desktop-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    .playlist-container {
      display: flex;
      flex-direction: column;
      gap: 12px; 
      background: rgba(0, 0, 0, 0.65);
      padding: 18px 20px 24px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .channel-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .radio-dot {
      width: 18px;
      height: 18px;
      border: 2px solid #777777;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: border-color 0.2s ease;
    }

    .radio-dot::after {
      content: "";
      width: 8px;
      height: 8px;
      background-color: #ff9800;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .channel-item.active .radio-dot {
      border-color: #ff9800;
    }

    .channel-item.active .radio-dot::after {
      opacity: 1;
      transform: scale(1);
    }

    .channel-name {
      font-size: 20px;
      font-weight: 400;
      color: #d0d0d0;
      white-space: nowrap;
      transition: color 0.2s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    .channel-item.active .channel-name {
      color: #ff9800;
      font-weight: 700;
    }

    /* Live Caption Box Panel */
    .caption-container {
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      height: 620px;
      display: flex;
      flex-direction: column;
    }

    .caption-header {
      font-size: 20px;
      font-weight: 700;
      color: #ff9800;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .caption-status {
      font-size: 13px;
      font-weight: 600;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      letter-spacing: 0.5px;
    }

    .caption-content {
      flex-grow: 1;
      overflow-y: auto;
      font-size: 18px;
      line-height: 1.6;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-right: 8px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .caption-content::-webkit-scrollbar {
      width: 6px;
    }

    .caption-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .page-version-footer {
      text-align: center;
      font-size: 12px;
      color: #666666;
      margin-top: 24px;
      letter-spacing: 0.5px;
    }

    audio, video {
      display: none;
    }

    @media (max-width: 850px) {
      .main-desktop-grid {
        grid-template-columns: 1fr;
      }
      .caption-container {
        height: 380px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Fixed Section -->
  <div class="sticky-header">
    <div class="header-container">
      <div class="callsign">HS1WFK</div>
      
      <!-- Title Row + Realtime UTC Time -->
      <div class="title-row">
        <h1 class="page-title">International News Desktop</h1>
        <div class="utc-time-display" id="utc-clock">UTC --:--:--</div>
      </div>

      <!-- Station Location Row + Realtime Local Time -->
      <div class="station-info-row" id="station-info-row">
        <div class="station-location-text" id="station-location-text"></div>
        <div class="local-time-display" id="local-clock">Local Time --:--:--</div>
      </div>

      <!-- Oscilloscope Scope Under Title -->
      <div class="scope-container">
        <div class="scope-grid"></div>
        <canvas id="oscilloscope"></canvas>
      </div>

      <!-- ส่วนแสดงผล Mono | Stereo ใต้ Header Scope -->
      <div class="audio-content-stats" id="audio-content-stats">
        <div class="channels-indicator">
          CH: 
          <span id="stat-mono" class="stat-term disable-gray">Mono</span> 
          | 
          <span id="stat-stereo" class="stat-term disable-gray">Stereo</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Split Grid Section -->
  <div class="main-desktop-grid">
    <!-- Left Column: Playlist -->
    <div class="playlist-container" id="playlist"></div>

    <!-- Right Column: Live Caption Box Panel -->
    <div class="caption-container">
      <div class="caption-header">
        <span>LIVE CAPTION</span>
        <span class="caption-status" id="caption-status">READY</span>
      </div>
      <div class="caption-content" id="caption-box">Select a station to start live speech-to-text captions...</div>
    </div>
  </div>

  <!-- Footer Version Text -->
  <div class="page-version-footer">ver 1.0.0</div>

  <video id="media-player" crossorigin="anonymous" playsinline webkit-playsinline></video>

  <script>
    const channels = [
      { name: "Al Jazeera", location: "Doha Qatar", tz: "Asia/Qatar", lang: "en-US", url: "https://live-hls-web-aje-gcp.thehlive.com/AJE/02.m3u8" },
      { name: "ABC Australia", location: "Sydney Australia", tz: "Australia/Sydney", lang: "en-US", url: "https://abc-news-dmd-streams-1.akamaized.net/out/v1/701126012d044971b3fa89406a440133/index.m3u8" },
      { name: "Arirang Korea", location: "Seoul South Korea", tz: "Asia/Seoul", lang: "en-US", url: "https://amdlive-ch02-ctnd-com.akamaized.net/arirang_2ch/smil:arirang_2ch.smil/playlist.m3u8" },
      { name: "BBC News", location: "London UK", tz: "Europe/London", lang: "en-US", url: "https://vs-hls-push-ww-live.akamaized.net/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8" },
      { name: "Bloomberg", location: "New York USA", tz: "America/New_York", lang: "en-US", url: "https://bloomberg.com/media-manifest/streams/phoenix-us.m3u8" },
      { name: "CGTN", location: "Beijing China", tz: "Asia/Shanghai", lang: "en-US", url: "https://amg00405-rakutentv-cgtn-rakuten-i9tar.amagi.tv/master.m3u8" },
      { name: "CNA", location: "Singapore", tz: "Asia/Singapore", lang: "en-US", url: "https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index.m3u8" },
      { name: "NHK English", location: "Tokyo Japan", tz: "Asia/Tokyo", lang: "en-US", url: "https://media-tyo.hls.nhkworld.jp/hls/w/live/master.m3u8" },
      { name: "DW En", location: "Berlin Germany", tz: "Europe/Berlin", lang: "en-US", url: "https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/index.m3u8" },
      { name: "France 24 En", location: "Paris France", tz: "Europe/Paris", lang: "en-US", url: "https://live.france24.com/hls/live/2037218/F24_EN_HI_HLS/master_5000.m3u8" },
      { name: "France 24 Fr", location: "Paris France", tz: "Europe/Paris", lang: "fr-FR", url: "https://live.france24.com/hls/live/2037179/F24_FR_HI_HLS/master_5000.m3u8" },
      { name: "GB News", location: "London UK", tz: "Europe/London", lang: "en-US", url: "https://cdn-apse1-prod.tsv2.amagi.tv/linear/amg01076-lightningintern-gbnewsnz-samsungnz/playlist.m3u8" },
      { name: "Tagesschau24", location: "Hamburg Germany", tz: "Europe/Berlin", lang: "de-DE", url: "https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8" },
      { name: "TPTV", location: "Bangkok Thailand", tz: "Asia/Bangkok", lang: "th-TH", url: "https://tv-live.tpchannel.org/live/tv_1080p.m3u8?vhost=tv-live.tpchannel.org" }
    ];

    const playlistContainer = document.getElementById('playlist');
    const player = document.getElementById('media-player');
    const canvas = document.getElementById('oscilloscope');
    const canvasCtx = canvas.getContext('2d');

    const utcClockElem = document.getElementById('utc-clock');
    const localClockElem = document.getElementById('local-clock');
    const stationInfoRow = document.getElementById('station-info-row');
    const stationLocationText = document.getElementById('station-location-text');

    const statsPanel = document.getElementById('audio-content-stats');
    const statMono = document.getElementById('stat-mono');
    const statStereo = document.getElementById('stat-stereo');

    const captionBox = document.getElementById('caption-box');
    const captionStatus = document.getElementById('caption-status');

    let activeIndex = -1;
    let hls = null;

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let animFrameId = null;

    let currentLevel = 0;
    let recognition = null;
    let fullTranscriptHistory = "";

    function updateClocks() {
      const now = new Date();

      const utcHours = String(now.getUTCHours()).padStart(2, '0');
      const utcMinutes = String(now.getUTCMinutes()).padStart(2, '0');
      const utcSeconds = String(now.getUTCSeconds()).padStart(2, '0');
      utcClockElem.innerText = `UTC ${utcHours}:${utcMinutes}:${utcSeconds}`;

      if (activeIndex !== -1 && channels[activeIndex]?.tz) {
        try {
          const options = {
            timeZone: channels[activeIndex].tz,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          };
          const formatter = new Intl.DateTimeFormat('en-GB', options);
          localClockElem.innerText = `Local Time ${formatter.format(now)}`;
        } catch (e) {
          localClockElem.innerText = "Local Time --:--:--";
        }
      }
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    function resizeCanvas() {
      canvas.width = canvas.clientWidth * (window.devicePixelRatio || 1);
      canvas.height = canvas.clientHeight * (window.devicePixelRatio || 1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    channels.forEach((channel, index) => {
      const item = document.createElement('div');
      item.className = 'channel-item';
      item.dataset.index = index;

      item.innerHTML = `
        <div class="radio-dot"></div>
        <span class="channel-name">${channel.name}</span>
      `;

      item.addEventListener('click', () => toggleChannel(index));
      playlistContainer.appendChild(item);
    });

    function initAudioContext() {
      if (!audioCtx) {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          analyser = audioCtx.createAnalyser();
          
          analyser.fftSize = 128;
          analyser.smoothingTimeConstant = 0.55; 

          sourceNode = audioCtx.createMediaElementSource(player);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
        } catch (e) {
          console.log("AudioContext Notice:", e);
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    /* Web Speech Recognition Engine แบบสะสมข้อความยาวไม่จำกัด + Auto Scroll */
    function initSpeechRecognition(langCode = 'en-US') {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        captionBox.innerText = "Web Speech Recognition API is not supported in this browser. Please use Google Chrome on Mac.";
        captionStatus.innerText = "UNSUPPORTED";
        captionStatus.style.color = "#ef4444";
        return;
      }

      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = langCode;

      recognition.onstart = () => {
        captionStatus.innerText = "LISTENING (" + langCode.toUpperCase() + ")";
        captionStatus.style.color = "#22c55e";
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let newFinalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            newFinalTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        if (newFinalTranscript !== '') {
          fullTranscriptHistory += newFinalTranscript + '\n\n';
        }

        captionBox.innerText = fullTranscriptHistory + interimTranscript;
        captionBox.scrollTop = captionBox.scrollHeight;
      };

      recognition.onerror = (event) => {
        console.log("Speech Recog Error:", event.error);
      };

      recognition.onend = () => {
        if (activeIndex !== -1 && !player.paused) {
          try { recognition.start(); } catch(e) {}
        }
      };

      try {
        recognition.start();
      } catch(e) {}
    }

    function clearCaptionBox() {
      fullTranscriptHistory = "";
      captionBox.innerText = "Listening to live audio stream...";
    }

    player.addEventListener('playing', () => {
      if (activeIndex !== -1) {
        const currentChannel = channels[activeIndex];
        stationLocationText.innerText = `${currentChannel.name} - ${currentChannel.location}`;
        stationInfoRow.style.visibility = 'visible';
        updateClocks();
      }
    });

    function toggleChannel(index) {
      initAudioContext();

      const items = document.querySelectorAll('.channel-item');

      if (activeIndex === index) {
        stopAudio();
        items[index].classList.remove('active');
        activeIndex = -1;
        return;
      }

      if (activeIndex !== -1) {
        items[activeIndex].classList.remove('active');
      }

      stationInfoRow.style.visibility = 'hidden';

      activeIndex = index;
      items[index].classList.add('active');
      
      // Clear Live Caption Box เมื่อเปลี่ยนสถานี
      clearCaptionBox();
      playAudio(channels[index].url);
      
      // เลือกภาษาตามคอนฟิกสถานี (th-TH สำหรับ TPTV, fr-FR สำหรับ France 24 Fr, en-US สำหรับช่องสากล)
      initSpeechRecognition(channels[index].lang || 'en-US');
    }

    function playAudio(url) {
      stopAudio(false);

      if (player.canPlayType('application/vnd.apple.mpegurl')) {
        player.src = url;
        player.play().then(() => {
          initAudioContext();
          startScopeVisualizer();
        }).catch(e => console.log("Play error:", e));
      } else if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(player);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          player.play().then(() => {
            initAudioContext();
            startScopeVisualizer();
          }).catch(e => console.log("Play error:", e));
        });
      }
    }

    function stopAudio(clearSrc = true) {
      player.pause();
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (hls) { hls.destroy(); hls = null; }
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      if (clearSrc) {
        player.removeAttribute('src');
        player.load();
        captionBox.innerText = "Select a station to start live speech-to-text captions...";
        captionStatus.innerText = "READY";
        captionStatus.style.color = "#22c55e";
      }
      currentLevel = 0;
      drawScopeFlat();

      stationInfoRow.style.visibility = 'hidden';
      if (statsPanel) statsPanel.style.display = 'none';
      statMono.className = 'stat-term disable-gray';
      statStereo.className = 'stat-term disable-gray';
    }

    /* Oscilloscope Visualizer Engine */
    function drawScope(timeData, isPlaying) {
      const width = canvas.width;
      const height = canvas.height;
      const centerY = height / 2;

      canvasCtx.clearRect(0, 0, width, height);
      canvasCtx.lineWidth = 1.5 * (window.devicePixelRatio || 1);
      canvasCtx.strokeStyle = '#22c55e';
      canvasCtx.shadowColor = '#22c55e';
      canvasCtx.shadowBlur = 4;

      if (!isPlaying || activeIndex === -1) {
        canvasCtx.beginPath();
        canvasCtx.moveTo(0, centerY);
        canvasCtx.lineTo(width, centerY);
        canvasCtx.stroke();
      } else if (timeData && timeData.length > 0) {
        const numBars = 75;
        const barWidth = width / numBars;

        for (let i = 0; i < numBars; i++) {
          const sampleIndex = Math.floor((i / numBars) * timeData.length);
          const v = Math.abs((timeData[sampleIndex] - 128) / 128.0);
          const barHeight = v * (height * 0.85);

          if (barHeight > 1) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY - barHeight / 2);
            canvasCtx.lineTo(i * barWidth, centerY + barHeight / 2);
            canvasCtx.stroke();
          }
        }
      } else {
        const time = performance.now() * 0.006;
        const numBars = 75;
        const barWidth = width / numBars;

        for (let i = 0; i < numBars; i++) {
          let wordEnvelope = Math.sin(i * 0.18 + time) * Math.sin(i * 0.08 - time * 0.4);
          wordEnvelope = Math.max(0, wordEnvelope);

          let voiceDetail = Math.sin(i * 1.5 + time * 3) * 0.5 + 0.5;
          let amp = (currentLevel / 100) * (height * 0.45) * Math.pow(wordEnvelope, 2) * voiceDetail;

          if (amp > 1) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY - amp);
            canvasCtx.lineTo(i * barWidth + 1, centerY + amp);
            canvasCtx.stroke();
          } else {
            canvasCtx.beginPath();
            canvasCtx.moveTo(i * barWidth, centerY);
            canvasCtx.lineTo(i * barWidth + 1, centerY);
            canvasCtx.stroke();
          }
        }
      }
    }

    function drawScopeFlat() {
      drawScope(null, false);
    }

    function startScopeVisualizer() {
      const freqData = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
      const timeData = analyser ? new Uint8Array(analyser.fftSize) : null;
      let simPhase = 0;

      function update() {
        let targetLevel = 0;
        let hasRealData = false;

        if (analyser && freqData) {
          analyser.getByteFrequencyData(freqData);
          let sumSquares = 0;
          for (let i = 0; i < freqData.length; i++) {
            let norm = freqData[i] / 255;
            sumSquares += norm * norm;
          }
          let rms = Math.sqrt(sumSquares / freqData.length);

          if (rms > 0.008) {
            hasRealData = true;
            targetLevel = Math.min(100, Math.pow(rms * 2.65, 0.85) * 100);
            if (timeData) analyser.getByteTimeDomainData(timeData);
          }
        }

        if (!hasRealData && !player.paused && player.currentTime > 0) {
          simPhase += 0.12;
          let speechEnvelope = Math.max(0, Math.sin(simPhase) * 35 + Math.sin(simPhase * 2.7) * 25);
          let randomPeak = Math.random() > 0.5 ? Math.random() * 30 : 0;
          targetLevel = Math.min(95, Math.max(0, 18 + speechEnvelope + randomPeak));
        }

        if (targetLevel > currentLevel) {
          currentLevel += (targetLevel - currentLevel) * 0.65;
        } else {
          currentLevel += (targetLevel - currentLevel) * 0.30;
        }

        if (activeIndex !== -1) {
          if (statsPanel && analyser) {
            statsPanel.style.display = 'block';
            const channelCount = analyser.channelCount;
            if (channelCount >= 2) {
              statStereo.className = 'stat-term active-red';
              statMono.className = 'stat-term disable-gray';
            } else {
              statMono.className = 'stat-term active-red';
              statStereo.className = 'stat-term disable-gray';
            }
          }

          drawScope(hasRealData ? timeData : null, !player.paused);
        }

        animFrameId = requestAnimationFrame(update);
      }

      update();
    }

    drawScopeFlat();
  </script>
</body>
</html>
