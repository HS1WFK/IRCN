<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 4 Streams (YouTube Edition) - Version 1.0.9</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            darkBg: '#090d16',
            panelBg: '#111827',
            panelHeader: '#1e293b',
            panelBorder: '#334155',
            accentRed: '#ef4444',
            accentBlue: '#3b82f6',
            accentGreen: '#10b981',
            accentAmber: '#f59e0b',
            accentCyan: '#06b6d4',

  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      user-select: none;
      overflow-x: hidden;
    }
    
    /* Dynamic Grid Layout Modes */
    .grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.75rem;
      height: calc(100vh - 4.5rem);
    }

    .grid-focus {
      display: grid;
      grid-template-columns: 3.2fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: 0.75rem;
      height: calc(100vh - 4.5rem);
    }

    .grid-focus #screen-slot-0 {
      grid-column: 1 / 2;
      grid-row: 1 / 4;
    }

    .grid-focus #screen-slot-1 { grid-column: 2 / 3; grid-row: 1 / 2; }
    .grid-focus #screen-slot-2 { grid-column: 2 / 3; grid-row: 2 / 3; }
    .grid-focus #screen-slot-3 { grid-column: 2 / 3; grid-row: 3 / 4; }

    @media (max-width: 1024px) {
      .grid-2x2, .grid-focus {
        display: flex;
        flex-direction: column;
        height: auto;
      }
      .screen-card {
        min-height: 320px;
      }
    }

    /* Live Pulsing Dot Animation */
    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #ef4444;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 12px #ef4444; }
      100% { transform: scale(0.85); opacity: 0.8; }
    }

    /* Active Solo Audio Glow Animation */
    .card-audio-active {
      border-color: #10b981 !important;
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.35);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }

    /* Video Frame Overlay Controls */
    .iframe-overlay {
      pointer-events: none;
    }
    .iframe-overlay * {
      pointer-events: auto;
    }
  </style>
</head>

  <script>
    /* ===================================================================
       1. MASTER STATION REGISTRY (12 STATIONS)
       =================================================================== */
    const MASTER_STATIONS = [
      { id: "gCNeDWCI0vo", name: "Al Jazeera" },
      { id: "xDWQ3LkccY8", name: "Sky News" },
      { id: "XWq5kBlakcQ", name: "CNA (Channel NewsAsia)" },
      { id: "QB5BNdBFujE", name: "Bloomberg Business News" },
      { id: "LuKwFajn37U", name: "DW English" },
      { id: "0i7n3r01L2U", name: "CGTN English" },
      { id: "HvZt-nh9sGg", name: "France 24 English" },
      { id: "hADDeXdg_lk", name: "ANN news (Japan)" },
      { id: "pykpO5kQJ98", name: "Euronews" },
      { id: "O9s2TMny6KQ", name: "GB News" },
      { id: "KQp-e_XQnDE", name: "Yahoo Finance 24/7" },
      { id: "qBe59l6p_EU", name: "TRT World" }
    ];

    /* Default Mapping for Pages */
    const DEFAULT_PAGE_1 = ["gCNeDWCI0vo", "xDWQ3LkccY8", "XWq5kBlakcQ", "QB5BNdBFujE"];
    const DEFAULT_PAGE_2 = ["LuKwFajn37U", "0i7n3r01L2U", "HvZt-nh9sGg", "hADDeXdg_lk"];

    /* ===================================================================
       2. GLOBAL STATE VARIABLES
       =================================================================== */
    let currentPage = 1;
    let page1Channels = [...DEFAULT_PAGE_1];
    let page2Channels = [...DEFAULT_PAGE_2];
    let currentLayout = '2x2'; // '2x2' or 'focus'
    
    // YouTube Players Array for active 4 slots
    let players = [null, null, null, null];
    let activeSoloSlot = null; // Currently soloed slot index
    let currentTargetModalSlot = 0;
    let isApiReady = false;

    /* ===================================================================
       3. STORAGE MANAGEMENT
       =================================================================== */
    function loadSavedState() {
      try {
        const savedPage1 = localStorage.getItem("p4s_yt_page1");
        const savedPage2 = localStorage.getItem("p4s_yt_page2");
        const savedPage = localStorage.getItem("p4s_yt_active_page");
        const savedLayout = localStorage.getItem("p4s_yt_layout");

        if (savedPage1) page1Channels = JSON.parse(savedPage1);
        if (savedPage2) page2Channels = JSON.parse(savedPage2);
        if (savedPage) currentPage = parseInt(savedPage, 10);
        if (savedLayout) currentLayout = savedLayout;
      } catch (e) {
        console.warn("LocalStorage access issue, fallback to defaults.", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem("p4s_yt_page1", JSON.stringify(page1Channels));
        localStorage.setItem("p4s_yt_page2", JSON.stringify(page2Channels));
        localStorage.setItem("p4s_yt_active_page", currentPage.toString());
        localStorage.setItem("p4s_yt_layout", currentLayout);
      } catch (e) {
        console.warn("Unable to save to LocalStorage.", e);
      }
    }

    /* ===================================================================
       4. YOUTUBE IFRAME PLAYER API INTEGRATION
       =================================================================== */
    function onYouTubeIframeAPIReady() {
      isApiReady = true;
      initAllPlayers();
    }

    function getActiveChannels() {
      return currentPage === 1 ? page1Channels : page2Channels;
    }

    function initAllPlayers() {
      if (!isApiReady) return;
      const channels = getActiveChannels();

      for (let i = 0; i < 4; i++) {
        initPlayerSlot(i, channels[i]);
      }
      updateUIElements();
    }

    function initPlayerSlot(slotIndex, videoId) {
      // Destroy existing player if present
      if (players[slotIndex]) {
        try { players[slotIndex].destroy(); } catch (e) {}
        players[slotIndex] = null;
      }

      // Re-create DOM placeholder
      const container = document.getElementById(`screen-slot-${slotIndex}`).querySelector('.bg-black');
      container.innerHTML = `<div id="player-${slotIndex}" class="w-full h-full"></div>`;

      players[slotIndex] = new YT.Player(`player-${slotIndex}`, {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 1, // Must be muted for autoplay policy
          controls: 1,
          modestbranding: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          'onReady': (event) => {
            event.target.playVideo();
            // If this slot was previously soloed, unmute it
            if (activeSoloSlot === slotIndex) {
              event.target.unMute();
            } else {
              event.target.mute();
            }
          }
        }
      });
    }

    /* ===================================================================
       5. AUDIO SOLO MANAGEMENT & CONTROLS
       =================================================================== */
    function toggleSoloAudio(slotIndex) {
      const cardEl = document.getElementById(`screen-slot-${slotIndex}`);

      if (activeSoloSlot === slotIndex) {
        // Toggle OFF solo mode -> Mute all
        activeSoloSlot = null;
        players.forEach(p => { if (p && p.mute) p.mute(); });
      } else {
        // Toggle ON solo mode for selected slot
        activeSoloSlot = slotIndex;
        players.forEach((p, idx) => {
          if (p && p.mute && p.unMute) {
            if (idx === slotIndex) {
              p.unMute();
            } else {
              p.mute();
            }
          }
        });
      }
      updateSoloButtonStyles();
    }

    function updateSoloButtonStyles() {
      for (let i = 0; i < 4; i++) {
        const cardEl = document.getElementById(`screen-slot-${i}`);
        const btnEl = document.getElementById(`solo-btn-${i}`);
        
        if (activeSoloSlot === i) {
          cardEl.classList.add("card-audio-active");
          btnEl.className = "px-2 py-0.5 rounded bg-emerald-600 text-white border border-emerald-400 text-[11px] font-sans transition-colors flex items-center gap-1 font-semibold";
          btnEl.innerHTML = `<i class="fa-solid fa-volume-high text-white"></i><span class="hidden sm:inline">SOLO ON</span>`;
        } else {
          cardEl.classList.remove("card-audio-active");
          btnEl.className = "px-2 py-0.5 rounded bg-slate-800 hover:bg-emerald-600/80 text-slate-300 hover:text-white border border-slate-700 text-[11px] font-sans transition-colors flex items-center gap-1";
          btnEl.innerHTML = `<i class="fa-solid fa-volume-xmark text-slate-400"></i><span class="hidden sm:inline">Solo</span>`;
        }
      }
    }

    /* ===================================================================
       6. PAGE SWITCHING & LAYOUT MANAGEMENT
       =================================================================== */
    function switchPage(pageNumber) {
      if (currentPage === pageNumber) return;
      currentPage = pageNumber;
      activeSoloSlot = null; // Reset audio solo on page switch
      
      saveState();
      updatePageNavUI();
      initAllPlayers();
      updateSoloButtonStyles();
    }

    function updatePageNavUI() {
      const btn1 = document.getElementById("btn-page-1");
      const btn2 = document.getElementById("btn-page-2");

      if (currentPage === 1) {
        btn1.className = "px-3 py-1.5 rounded-md text-xs font-semibold transition-all flex items-center gap-2 bg-blue-600 text-white shadow-md";
        btn2.className = "px-3 py-1.5 rounded-md text-xs font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800";
      } else {
        btn2.className = "px-3 py-1.5 rounded-md text-xs font-semibold transition-all flex items-center gap-2 bg-blue-600 text-white shadow-md";
        btn1.className = "px-3 py-1.5 rounded-md text-xs font-semibold transition-all flex items-center gap-2 text-slate-400 hover:text-white hover:bg-slate-800";
      }

      // Update slot badge labels
      for (let i = 0; i < 4; i++) {
        const badge = document.getElementById(`badge-${i}`);
        const chNum = currentPage === 1 ? (i + 1) : (i + 5);
        badge.innerText = `CH${chNum}`;
      }
    }

    function setLayout(layoutType) {
      currentLayout = layoutType;
      const container = document.getElementById("grid-container");
      const btnGrid = document.getElementById("layout-grid-btn");
      const btnFocus = document.getElementById("layout-focus-btn");

      if (layoutType === 'focus') {
        container.className = "grid-focus transition-all duration-300";
        btnFocus.className = "px-2.5 py-1 rounded text-xs text-blue-400 bg-blue-500/20 font-mono font-bold";
        btnGrid.className = "px-2.5 py-1 rounded text-xs text-slate-400 hover:text-white font-mono";
      } else {
        container.className = "grid-2x2 transition-all duration-300";
        btnGrid.className = "px-2.5 py-1 rounded text-xs text-blue-400 bg-blue-500/20 font-mono font-bold";
        btnFocus.className = "px-2.5 py-1 rounded text-xs text-slate-400 hover:text-white font-mono";
      }
      saveState();
    }

    /* ===================================================================
       7. PRESETS DROPDOWN & MANUAL CUSTOM URL CONFIG
       =================================================================== */
    function populatePresetDropdowns() {
      for (let slot = 0; slot < 4; slot++) {
        const selectEl = document.getElementById(`preset-select-${slot}`);
        selectEl.innerHTML = "";

        MASTER_STATIONS.forEach(station => {
          const opt = document.createElement("option");
          opt.value = station.id;
          opt.textContent = station.name;
          selectEl.appendChild(opt);
        });

        // Add Option for custom URL if set
        const customOpt = document.createElement("option");
        customOpt.value = "CUSTOM";
        customOpt.textContent = "⚙ Custom ID / URL";
        selectEl.appendChild(customOpt);
      }
    }

    function updateUIElements() {
      const activeChannels = getActiveChannels();
      for (let slot = 0; slot < 4; slot++) {
        const selectEl = document.getElementById(`preset-select-${slot}`);
        const currentId = activeChannels[slot];

        // Check if current ID exists in preset list
        const exists = MASTER_STATIONS.some(s => s.id === currentId);
        if (exists) {
          selectEl.value = currentId;
        } else {
          selectEl.value = "CUSTOM";
        }
      }
      updatePageNavUI();
      setLayout(currentLayout);
    }

    function onPresetChange(slotIndex, selectedValue) {
      if (selectedValue === "CUSTOM") {
        openConfigModal(slotIndex);
        return;
      }

      const activeChannels = getActiveChannels();
      activeChannels[slotIndex] = selectedValue;
      saveState();

      initPlayerSlot(slotIndex, selectedValue);
    }

    function reloadScreen(slotIndex) {
      const activeChannels = getActiveChannels();
      initPlayerSlot(slotIndex, activeChannels[slotIndex]);
    }

    /* ===================================================================
       8. MODAL FOR CUSTOM VIDEO ID OR FULL URL
       =================================================================== */
    function openConfigModal(slotIndex) {
      currentTargetModalSlot = slotIndex;
      const activeChannels = getActiveChannels();
      
      document.getElementById("modal-slot-num").innerText = currentPage === 1 ? (slotIndex + 1) : (slotIndex + 5);
      document.getElementById("modal-input-id").value = activeChannels[slotIndex];
      document.getElementById("config-modal").classList.remove("hidden");
    }

    function closeConfigModal() {
      document.getElementById("config-modal").classList.add("hidden");
    }

    function parseYouTubeVideoId(input) {
      if (!input) return "";
      input = input.trim();
      
      // Direct 11-char ID
      if (input.length === 11 && !input.includes("/")) return input;

      // Regular expressions for various YouTube URL forms
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|live\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = input.match(regExp);

      return (match && match[2].length === 11) ? match[2] : input;
    }

    function saveConfigModal() {
      const rawInput = document.getElementById("modal-input-id").value;
      const extractedId = parseYouTubeVideoId(rawInput);

      if (!extractedId) return;

      const activeChannels = getActiveChannels();
      activeChannels[currentTargetModalSlot] = extractedId;
      saveState();

      closeConfigModal();
      initPlayerSlot(currentTargetModalSlot, extractedId);
      updateUIElements();
    }

    /* ===================================================================
       9. FULLSCREEN HELPERS & RESET
       =================================================================== */
    function toggleScreenFullscreen(slotIndex) {
      const cardEl = document.getElementById(`screen-slot-${slotIndex}`);
      if (!document.fullscreenElement) {
        if (cardEl.requestFullscreen) cardEl.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleGlobalFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function resetDefaults() {
      if (confirm("Reset all channel slots and layout to factory defaults?")) {
        page1Channels = [...DEFAULT_PAGE_1];
        page2Channels = [...DEFAULT_PAGE_2];
        currentPage = 1;
        currentLayout = '2x2';
        activeSoloSlot = null;
        
        saveState();
        initAllPlayers();
        updateSoloButtonStyles();
      }
    }

    /* ===================================================================
       10. INITIALIZATION ON WINDOW LOAD
       =================================================================== */
    window.onload = function() {
      loadSavedState();
      populatePresetDropdowns();
      
      // If YouTube API loaded before window.onload triggered
      if (window.YT && window.YT.Player) {
        isApiReady = true;
        initAllPlayers();
      }
    };
  </script>
</body>
</html>
