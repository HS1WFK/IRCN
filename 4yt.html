<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 4 Streams - YouTube Edition v1.1.2</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --header-bg: #161e2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Navigation Bar */
    header {
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #ffffff;
    }

    .brand-badge {
      background-color: var(--accent-red);
      color: white;
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .controls-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      background-color: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      padding: 2px;
      border: 1px solid var(--border-color);
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .btn:hover {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .btn.active {
      background-color: var(--accent-blue);
      color: white;
    }

    /* Main Container */
    main {
      flex: 1;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
    }

    .page-view {
      display: none;
      flex: 1;
      width: 100%;
    }

    .page-view.active {
      display: block;
    }

    /* Grid Layout Modes */
    .grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 0.75rem;
      height: calc(100vh - 75px);
    }

    .grid-focus {
      display: grid;
      grid-template-columns: 2.8fr 1fr;
      grid-template-rows: repeat(3, 1fr);
      gap: 0.75rem;
      height: calc(100vh - 75px);
    }

    .grid-focus .screen-card:nth-child(1) {
      grid-row: span 3;
    }

    @media (max-width: 900px) {
      .grid-2x2, .grid-focus {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        height: auto;
      }
      .grid-focus .screen-card:nth-child(1) {
        grid-row: auto;
      }
      .screen-card {
        height: 280px;
      }
    }

    /* Screen Card UI */
    .screen-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .screen-card.solo-active {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 1px var(--accent-green);
    }

    .screen-header {
      background-color: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid var(--border-color);
      padding: 0.35rem 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .ch-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.1);
      padding: 0.1rem 0.4rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .station-select {
      background-color: #0d121d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 0.2rem 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
      flex: 1;
      max-width: 180px;
      cursor: pointer;
    }

    .station-select optgroup {
      background-color: #111827;
      color: var(--accent-gold);
    }

    .screen-actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.7rem;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .action-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.15);
    }

    .action-btn.solo-btn {
      color: #9ca3af;
    }

    .action-btn.solo-btn.active {
      background-color: var(--accent-green);
      color: white;
      border-color: var(--accent-green);
    }

    /* Video Frame Container */
    .video-wrapper {
      flex: 1;
      position: relative;
      background-color: #000;
      width: 100%;
      height: 100%;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Screen Footer Overlay for Manual URL Input */
    .screen-footer {
      background-color: rgba(10, 15, 25, 0.95);
      border-top: 1px solid var(--border-color);
      padding: 0.3rem 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .url-input {
      flex: 1;
      background-color: #05080e;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      color: var(--text-main);
      padding: 0.2rem 0.4rem;
      font-size: 0.7rem;
      font-family: monospace;
      outline: none;
    }

    .url-input:focus {
      border-color: var(--accent-blue);
    }

    /* Timer Status Countdown Badge UI */
    .timer-badge {
      font-size: 0.75rem;
      font-family: monospace;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.15);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(245, 158, 11, 0.3);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 700;
    }
  </style>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand-title">
      PROJECT 4 STREAMS <span class="brand-badge">v1.1.2</span>
    </div>

    <div class="controls-main">
      <!-- Page Switcher -->
      <div class="btn-group">
        <button class="btn active" id="btn-page1" onclick="switchPage(1)">Page 1 (CH1-4)</button>
        <button class="btn" id="btn-page2" onclick="switchPage(2)">Page 2 (CH5-8)</button>
      </div>

      <!-- Layout Switcher -->
      <div class="btn-group">

      <!-- Real-time Hourly Countdown Badge -->
      <div class="timer-badge" id="timer-status">⏳ Next Alert: --:--</div>

      <!-- Global Actions -->
      <button class="btn" onclick="muteAllCurrentPage()" style="border: 1px solid var(--border-color);">

  </header>

  <!-- Main View Area -->
  <main>
    <!-- PAGE 1 -->
    <div id="page-1" class="page-view active">

          <div class="screen-footer">

            <button class="action-btn" onclick="applyCustomInput(2)">Set</button>

        </div>

        <!-- CH 3 -->

          <div class="screen-header">

            <div class="screen-actions">
              <button class="action-btn solo-btn" id="solo-3" onclick="toggleSolo(3)">Solo Audio</button>
              <button class="action-btn" onclick="reloadScreen(3)">Reload</button>
            </div>
          </div>
          <div class="video-wrapper">
            <div id="player-3"></div>
          </div>
          <div class="screen-footer">
            <input type="text" class="url-input" id="input-3" placeholder="Paste YouTube URL or Video ID">
            <button class="action-btn" onclick="applyCustomInput(3)">Set</button>
          </div>
        </div>

        <!-- CH 4 -->
        <div class="screen-card" id="card-4">
          <div class="screen-header">
            <span class="ch-tag">CH 4</span>
            <select class="station-select" id="select-4" onchange="onSelectStation(4)"></select>
            <div class="screen-actions">
              <button class="action-btn solo-btn" id="solo-4" onclick="toggleSolo(4)">Solo Audio</button>
              <button class="action-btn" onclick="reloadScreen(4)">Reload</button>

          </div>
          <div class="video-wrapper">

          <div class="screen-footer">

  </main>

  <script>
    // Master Registry of Stations (News & Music)
    const STATION_REGISTRY = [
      // --- NEWS STATIONS ---
      { id: 'aljazeera', name: 'Al Jazeera', videoId: 'gCNeDWCI0vo', category: 'News' },
      { id: 'skynews', name: 'Sky News', videoId: 'xDWQ3LkccY8', category: 'News' },
      { id: 'cna', name: 'CNA', videoId: 'XWq5kBlakcQ', category: 'News' },
      { id: 'bloomberg', name: 'Bloomberg Business', videoId: 'QB5BNdBFujE', category: 'News' },
      { id: 'dw', name: 'DW English', videoId: 'LuKwFajn37U', category: 'News' },
      { id: 'cgtn', name: 'CGTN English', videoId: '0i7n3r01L2U', category: 'News' },
      { id: 'france24', name: 'France 24 English', videoId: 'HvZt-nh9sGg', category: 'News' },
      { id: 'ann', name: 'ANN news (Jp)', videoId: 'hADDeXdg_lk', category: 'News' },
      { id: 'euronews', name: 'Euro News', videoId: 'pykpO5kQJ98', category: 'News' },
      { id: 'gbnews', name: 'GB News', videoId: 'O9s2TMny6KQ', category: 'News' },
      { id: 'yahoofinance', name: 'Yahoo Finance 24/7', videoId: 'KQp-e_XQnDE', category: 'News' },
      { id: 'trtworld', name: 'TRT World', videoId: 'qBe59l6p_EU', category: 'News' },

      // --- MUSIC & AUDIO RELAXATION ---
      { id: 'native_flute', name: 'Rain & Native American Flute', videoId: 'Unbi1YfQfBU', category: 'Music' },
      { id: 'beethoven_triple', name: 'Beethoven Triplekonzert', videoId: 'jkD6XuJaj_E', category: 'Music' },
      { id: 'smooth_jazz', name: 'Smooth Jazz & R&B 90s', videoId: 'oNPKYDvJ6VY', category: 'Music' }
    ];

    // Default Configurations for Screens
    const DEFAULT_CONFIGS = {
      1: { stationId: 'aljazeera', videoId: 'gCNeDWCI0vo' },
      2: { stationId: 'skynews', videoId: 'xDWQ3LkccY8' },
      3: { stationId: 'cna', videoId: 'XWq5kBlakcQ' },
      4: { stationId: 'bloomberg', videoId: 'QB5BNdBFujE' },
      5: { stationId: 'dw', videoId: 'LuKwFajn37U' },
      6: { stationId: 'cgtn', videoId: '0i7n3r01L2U' },
      7: { stationId: 'france24', videoId: 'HvZt-nh9sGg' },
      8: { stationId: 'ann', videoId: 'hADDeXdg_lk' }
    };

    let currentPage = 1;
    let currentLayout = 'grid';
    let players = {};
    let playerReadyStatus = {};
    let screenConfigs = JSON.parse(JSON.stringify(DEFAULT_CONFIGS));

    // YouTube API Ready Callback
    function onYouTubeIframeAPIReady() {
      populateDropdowns();
      for (let i = 1; i <= 8; i++) {
        initPlayer(i);
      }
      startHourlyTimer(); // Launch Real-time Hourly Timer System
    }

    // Populate Dropdowns with Grouping
    function populateDropdowns() {
      const newsStations = STATION_REGISTRY.filter(s => s.category === 'News');
      const musicTracks = STATION_REGISTRY.filter(s => s.category === 'Music');

      for (let i = 1; i <= 8; i++) {
        const select = document.getElementById(`select-${i}`);
        select.innerHTML = '';

        // News Group
        const newsGroup = document.createElement('optgroup');
        newsGroup.label = '--- NEWS CHANNELS ---';
        newsStations.forEach(st => {
          const opt = document.createElement('option');
          opt.value = st.id;
          opt.textContent = st.name;
          newsGroup.appendChild(opt);
        });
        select.appendChild(newsGroup);

        // Music Group
        const musicGroup = document.createElement('optgroup');
        musicGroup.label = '--- MUSIC & RELAXATION ---';
        musicTracks.forEach(st => {
          const opt = document.createElement('option');
          opt.value = st.id;
          opt.textContent = st.name;
          musicGroup.appendChild(opt);
        });
        select.appendChild(musicGroup);

        // Custom Choice Option
        const customOpt = document.createElement('option');
        customOpt.value = 'custom';
        customOpt.textContent = 'Custom Video ID';
        select.appendChild(customOpt);

        select.value = screenConfigs[i].stationId;
      }
    }

    // Initialize YouTube Player Instance
    function initPlayer(ch) {
      const videoId = screenConfigs[ch].videoId;
      players[ch] = new YT.Player(`player-${ch}`, {
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          mute: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: (e) => {
            playerReadyStatus[ch] = true;
            e.target.playVideo();
            e.target.mute();
          }
        }
      });
    }

    // Handle Dropdown Selection Change
    function onSelectStation(ch) {
      const select = document.getElementById(`select-${ch}`);
      const selectedValue = select.value;

      if (selectedValue === 'custom') return;

      const station = STATION_REGISTRY.find(s => s.id === selectedValue);
      if (station) {
        screenConfigs[ch].stationId = station.id;
        screenConfigs[ch].videoId = station.videoId;
        document.getElementById(`input-${ch}`).value = station.videoId;
        loadVideoToScreen(ch, station.videoId);
      }
    }

    // Load Video by ID into Specific Screen
    function loadVideoToScreen(ch, videoId) {
      if (players[ch] && typeof players[ch].loadVideoById === 'function') {
        players[ch].loadVideoById(videoId);
        players[ch].mute();
        updateSoloButtonUI(ch, false);
      }
    }

    // Helper: Parse Video ID from YouTube URL or Plain ID
    function extractVideoId(input) {
      const trimmed = input.trim();
      const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|live)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = trimmed.match(regex);
      return match ? match[1] : (trimmed.length === 11 ? trimmed : null);
    }

    // Apply Custom Input (URL/ID)
    function applyCustomInput(ch) {
      const inputVal = document.getElementById(`input-${ch}`).value;
      const vid = extractVideoId(inputVal);

      if (vid) {
        screenConfigs[ch].stationId = 'custom';
        screenConfigs[ch].videoId = vid;
        document.getElementById(`select-${ch}`).value = 'custom';
        loadVideoToScreen(ch, vid);
      } else {
        alert('Invalid YouTube URL or Video ID. Please check and try again.');
      }
    }

    // Reload Screen Stream
    function reloadScreen(ch) {
      if (players[ch] && typeof players[ch].loadVideoById === 'function') {
        players[ch].loadVideoById(screenConfigs[ch].videoId);
      }
    }

    // Toggle Audio Solo Mode
    function toggleSolo(ch) {
      const isSoloActive = document.getElementById(`solo-${ch}`).classList.contains('active');
      const targetPage = ch <= 4 ? 1 : 2;
      const startCh = targetPage === 1 ? 1 : 5;
      const endCh = targetPage === 1 ? 4 : 8;

      if (isSoloActive) {
        // Mute this screen
        if (players[ch] && playerReadyStatus[ch]) players[ch].mute();
        updateSoloButtonUI(ch, false);
      } else {
        // Mute all other screens in this page & Unmute target screen
        for (let i = startCh; i <= endCh; i++) {
          if (players[i] && playerReadyStatus[i]) {
            if (i === ch) {
              players[i].unMute();
              updateSoloButtonUI(i, true);
            } else {
              players[i].mute();
              updateSoloButtonUI(i, false);
            }
          }
        }
      }
    }

    // Update Solo Button Visual State
    function updateSoloButtonUI(ch, active) {
      const btn = document.getElementById(`solo-${ch}`);
      const card = document.getElementById(`card-${ch}`);
      if (active) {
        btn.classList.add('active');
        card.classList.add('solo-active');
      } else {
        btn.classList.remove('active');
        card.classList.remove('solo-active');
      }
    }

    // Mute All Screens on Active Page
    function muteAllCurrentPage() {
      const startCh = currentPage === 1 ? 1 : 5;
      const endCh = currentPage === 1 ? 4 : 8;
      for (let i = startCh; i <= endCh; i++) {
        if (players[i] && playerReadyStatus[i]) {
          players[i].mute();
          updateSoloButtonUI(i, false);
        }
      }
    }

    // Switch Active Page (Page 1 vs Page 2)
    function switchPage(pageNum) {
      currentPage = pageNum;
      document.getElementById('page-1').classList.toggle('active', pageNum === 1);
      document.getElementById('page-2').classList.toggle('active', pageNum === 2);

      document.getElementById('btn-page1').classList.toggle('active', pageNum === 1);
      document.getElementById('btn-page2').classList.toggle('active', pageNum === 2);

      // Mute the page being hidden
      const inactiveStart = pageNum === 1 ? 5 : 1;
      const inactiveEnd = pageNum === 1 ? 8 : 4;
      for (let i = inactiveStart; i <= inactiveEnd; i++) {
        if (players[i] && playerReadyStatus[i]) {
          players[i].mute();
          updateSoloButtonUI(i, false);
        }
      }
    }

    // Set Layout Mode (Grid vs Focus)
    function setLayout(mode) {
      currentLayout = mode;
      const gridP1 = document.getElementById('grid-p1');
      const gridP2 = document.getElementById('grid-p2');

      const targetClass = mode === 'grid' ? 'grid-2x2' : 'grid-focus';

      gridP1.className = targetClass;
      gridP2.className = targetClass;

      document.getElementById('btn-grid').classList.toggle('active', mode === 'grid');
      document.getElementById('btn-focus').classList.toggle('active', mode === 'focus');
    }

    /* ==========================================================================
       PHASE 1: REAL-TIME HOURLY TIMER WITH EARLY TRIGGER (-10s) (v1.1.2)
       ========================================================================== */

    let audioCtx = null;
    let timerInterval = null;
    let lastTriggerKey = null;

    // Web Audio API Engine for Generating Beep Sounds
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq = 880, type = 'sine', duration = 0.15, delay = 0) {
      initAudioContext();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      const startTime = audioCtx.currentTime + delay;
      gain.gain.setValueAtTime(0.3, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function playTripleBeep() {
      playBeep(880, 'sine', 0.12, 0);     // Beep 1
      playBeep(880, 'sine', 0.12, 0.2);   // Beep 2
      playBeep(1200, 'sine', 0.25, 0.4);  // Beep 3 (Higher Pitch Ending)
    }

    // Main Timer System: Real-Time Clock Sync & Early Trigger (-10 sec)
    function startHourlyTimer() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const now = new Date();
        
        // Target trigger time is XX:59:50 (10 seconds before top of the hour)
        let target = new Date(now);
        if (now.getMinutes() > 59 || (now.getMinutes() === 59 && now.getSeconds() >= 50)) {
          // If current time is past XX:59:50, set target to next hour's 59:50
          target.setHours(target.getHours() + 1);
        }
        target.setMinutes(59);
        target.setSeconds(50);
        target.setMilliseconds(0);

        // Calculate remaining seconds until next trigger
        const diffMs = target - now;
        const totalDiffSec = Math.floor(diffMs / 1000);

        const remMins = Math.floor(totalDiffSec / 60);
        const remSecs = totalDiffSec % 60;

        const formattedMins = remMins < 10 ? `0${remMins}` : remMins;
        const formattedSecs = remSecs < 10 ? `0${remSecs}` : remSecs;

        // Update real-time countdown display
        const statusEl = document.getElementById('timer-status');
        statusEl.textContent = `⏳ Next Alert: ${formattedMins}:${formattedSecs}`;

        // Trigger condition: Exactly at minute 59, second 50 (XX:59:50)
        if (now.getMinutes() === 59 && now.getSeconds() === 50) {
          const triggerKey = `${now.getHours()}:59:50`;
          if (lastTriggerKey !== triggerKey) {
            lastTriggerKey = triggerKey;
            executeTopOfTheHourActions();
          }
        }
      }, 1000);
    }

    // Action Trigger Function for Top-of-the-Hour Event (-10s Offset)
    function executeTopOfTheHourActions() {
      console.log(`[Hourly Alert Triggered at XX:59:50] Time: ${new Date().toLocaleTimeString()}`);

      const isCh1Unmuted = players[1] && playerReadyStatus[1] && !players[1].isMuted();
      const isSolo1Active = document.getElementById('solo-1').classList.contains('active');

      // Check Scenario: Is CH1 currently playing audio and visible on Page 1?
      if (currentPage === 1 && isCh1Unmuted && isSolo1Active) {
        console.log('[Timer] CH1 is already active & unmuted. Continuing seamless playback.');
        return; // Continue playing seamlessly without interruption or beep
      }

      // Scenario B: CH1 is muted, another CH is selected, or user is on Page 2
      playTripleBeep(); // Play Beep Alert

      // Switch back to Page 1 if currently viewing Page 2
      if (currentPage !== 1) {
        switchPage(1);
      }

      // Unmute CH1 (Al Jazeera English) and Mute other channels
      toggleSolo(1);
    }

    // Global Listener to Wake AudioContext on First Interaction
    document.addEventListener('click', () => {
      initAudioContext();
    }, { once: true });
  </script>
</body>
