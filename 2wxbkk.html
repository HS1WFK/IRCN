<!DOCTYPE html>
<html lang="th" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bangkok BMA Radar Live Monitor - ระบบติดตามเรดาร์สภาพอากาศกรุงเทพมหานคร</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Kanit', sans-serif;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            /* iOS Safari fix for 100vh */
            height: -webkit-fill-available;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            background-color: #0b0f17;
            color: #f8fafc;
        }

        /* Radar container wrapper */
        .radar-box {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0f172a;
            border-radius: 0.75rem;
        }

        /* Responsive Wrapper Scaling Container */
        .scaler-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Container for scaling */
        .iframe-crop-left, .iframe-crop-right {
            position: absolute;
            transform-origin: center center;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), width 0.2s, height 0.2s;
            pointer-events: auto;
            /* Force Hardware Acceleration to fix iOS blank render */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            opacity: 0.99; 
        }

        /* THE FIX FOR iOS IFRAME BUG */
        .radar-iframe {
            position: absolute;
            top: 0;
            left: 0;
            /* iOS Safari Workaround: Forces iframe to respect container width */
            width: 1px;
            min-width: 100%;
            height: 100%;
            border: none;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* Custom Radio Button styling */
        .radar-radio input[type="radio"] {
            display: none;
        }
        .radar-radio label {
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s ease;
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.8);
            color: #94a3b8;
        }
        .radar-radio input[type="radio"]:checked + label {
            background-color: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        /* Pulse animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-live {
            animation: pulse-ring 2s infinite ease-in-out;
        }

        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid #38bdf8;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen bg-slate-950 text-slate-100 select-none overflow-hidden">

    <!-- Top Navigation Header Bar -->
    <header class="h-12 md:h-14 bg-slate-900/95 border-b border-slate-800 px-3 md:px-5 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center space-x-2 md:space-x-3">
            <div class="p-1.5 md:p-2 bg-sky-500/10 text-sky-400 rounded-lg border border-sky-500/20">
                <i class="fa-solid fa-radar text-base md:text-lg"></i>
            </div>
            <div>
                <h1 class="text-xs md:text-sm font-semibold text-slate-100 flex items-center gap-2">
                    <span class="truncate max-w-[150px] sm:max-w-none">ศูนย์เรดาร์ กทม.</span>
                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] md:text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-live"></span>
                        Auto Fit
                    </span>
                </h1>
                <p class="text-[10px] md:text-xs text-slate-400 hidden sm:block">ระบบติดตามสภาพอากาศแบบเรียลไทม์ (รองรับมือถือ)</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-3">
            
            <!-- Zoom Controls (Restored) -->
            <div class="hidden md:flex items-center gap-1 bg-slate-950/80 p-1 rounded-lg border border-slate-800 text-xs mr-2">
                <button onclick="adjustScale(-0.03)" class="px-2 py-1 hover:bg-slate-800 rounded text-slate-300 transition-colors"><i class="fa-solid fa-minus"></i></button>
                <button onclick="resetScale()" class="px-2 py-1 hover:bg-slate-800 rounded text-slate-300 font-mono text-[11px] transition-colors">Reset Fit</button>
                <button onclick="adjustScale(0.03)" class="px-2 py-1 hover:bg-slate-800 rounded text-slate-300 transition-colors"><i class="fa-solid fa-plus"></i></button>
            </div>

            <div class="flex items-center gap-2 bg-slate-950/80 px-2.5 py-1.5 rounded-lg border border-slate-800">
                <i class="fa-regular fa-clock text-sky-400 text-xs"></i>
                <div class="text-[11px] md:text-xs font-mono flex items-center gap-1.5">
                    <span id="countdown-timer" class="text-sky-400 font-bold">03:00</span>
                </div>
                <div class="w-8 md:w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden ml-1">
                    <div id="progress-bar" class="h-full bg-sky-400 transition-all duration-1000 ease-linear w-full"></div>
                </div>
            </div>

            <button id="refresh-btn" onclick="manualRefresh()" 
                class="flex items-center gap-1.5 px-3 py-1.5 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white text-xs font-medium rounded-lg transition-colors shadow-sm focus:outline-none">
                <i id="refresh-icon" class="fa-solid fa-arrows-rotate text-xs"></i>
                <span class="hidden sm:inline">รีเฟรช</span>
            </button>
        </div>
    </header>

    <!-- Main Split Screen -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-2 p-2 bg-slate-950 overflow-hidden relative">
        
        <!-- ================= LEFT COLUMN ================= -->
        <section class="flex flex-col h-full bg-slate-900 rounded-xl border border-slate-800 overflow-hidden relative">
            <div class="h-9 bg-slate-800/90 border-b border-slate-700/60 px-3 flex items-center justify-between text-xs font-medium z-20 shrink-0">
                <div class="flex items-center gap-2 text-sky-400 truncate">
                    <i class="fa-solid fa-circle-play"></i>
                    <span class="text-slate-200 font-semibold truncate">ภาพเคลื่อนไหว</span>
                    
                    <div class="flex items-center gap-1 ml-2">
                        <div class="radar-radio">
                            <input type="radio" id="radio-left-nk" name="radar-left" value="nk" checked onchange="changeLeftRadar('nk')">
                            <label for="radio-left-nk">NK</label>
                        </div>
                        <div class="radar-radio">
                            <input type="radio" id="radio-left-nj" name="radar-left" value="nj" onchange="changeLeftRadar('nj')">
                            <label for="radio-left-nj">NJ</label>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <a id="link-left" href="https://weather.bangkok.go.th/Radar/RadarAnimationNk.aspx" target="_blank" rel="noopener" 
                       class="text-slate-400 hover:text-sky-300 text-[11px] flex items-center gap-1 transition-colors">
                        <span>เปิดเว็บตรง</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                    </a>
                </div>
            </div>

            <div id="box-left" class="radar-box flex-1">
                <div id="loader-left" class="absolute inset-0 bg-slate-900/90 z-20 flex flex-col items-center justify-center gap-2 transition-opacity duration-300">
                    <div class="spinner"></div>
                    <p class="text-xs text-slate-400">กำลังโหลดภาพเรดาร์...</p>
                </div>

                <div class="scaler-wrapper">
                    <div id="scaler-left" class="iframe-crop-left">
                        <iframe 
                            id="iframe-left"
                            src="https://weather.bangkok.go.th/Radar/RadarAnimationNk.aspx" 
                            class="radar-iframe"
                            title="BMA Radar Animation Left"
                            scrolling="no"
                            onload="onIframeLoaded('loader-left')"
                            onerror="onIframeError('error-left', 'loader-left')">
                        </iframe>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= RIGHT COLUMN ================= -->
        <section class="flex flex-col h-full bg-slate-900 rounded-xl border border-slate-800 overflow-hidden relative">
            <div class="h-9 bg-slate-800/90 border-b border-slate-700/60 px-3 flex items-center justify-between text-xs font-medium z-20 shrink-0">
                <div class="flex items-center gap-2 text-indigo-400 truncate">
                    <i class="fa-solid fa-crosshairs"></i>
                    <span class="text-slate-200 font-semibold truncate">High Res - Fit</span>
                    
                    <div class="flex items-center gap-1 ml-2">
                        <div class="radar-radio">
                            <input type="radio" id="radio-right-bkk" name="radar-right" value="bkk" checked onchange="changeRightRadar('bkk')">
                            <label for="radio-right-bkk">BKK</label>
                        </div>
                        <div class="radar-radio">
                            <input type="radio" id="radio-right-svp" name="radar-right" value="svp" onchange="changeRightRadar('svp')">
                            <label for="radio-right-svp">SVP240</label>
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                    <a id="link-right" href="https://weather.bangkok.go.th/Radar/RadarHighResolutionNk.aspx" target="_blank" rel="noopener" 
                       class="text-slate-400 hover:text-indigo-300 text-[11px] flex items-center gap-1 transition-colors">
                        <span>เปิดเว็บตรง</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                    </a>
                </div>
            </div>

            <div id="box-right" class="radar-box flex-1">
                <div id="loader-right" class="absolute inset-0 bg-slate-900/90 z-20 flex flex-col items-center justify-center gap-2 transition-opacity duration-300">
                    <div class="spinner"></div>
                    <p class="text-xs text-slate-400">กำลังย่อและปรับสเกลภาพเรดาร์...</p>
                </div>

                <div class="scaler-wrapper">
                    <div id="scaler-right" class="iframe-crop-right">
                        <iframe 
                            id="iframe-right"
                            src="https://weather.bangkok.go.th/Radar/RadarHighResolutionNk.aspx" 
                            class="radar-iframe"
                            title="BMA Radar Right"
                            scrolling="no"
                            onload="onIframeLoaded('loader-right')"
                            onerror="onIframeError('error-right', 'loader-right')">
                        </iframe>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer Status Bar -->
    <footer class="h-7 bg-slate-900 border-t border-slate-800 px-4 flex items-center justify-between text-[11px] text-slate-400 shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-arrows-rotate text-sky-400 text-[10px]"></i>
            <span>รีเฟรชข้อมูลอัตโนมัติทุก 3 นาที</span>
            <span class="text-slate-600 hidden sm:inline">|</span>
            <span class="hidden sm:inline">อัปเดตล่าสุด: <span id="last-updated-time" class="text-slate-300 font-mono">-</span></span>
        </div>
        <div class="text-slate-400 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
            <span>สำนักการระบายน้ำ กทม.</span>
        </div>
    </footer>

    <script>
        const REFRESH_SECONDS = 180;
        let countdown = REFRESH_SECONDS;
        let timerId = null;
        let rightScaleUserOffset = 0; // Restored user zoom state

        const radarSources = {
            left: {
                nk: "https://weather.bangkok.go.th/Radar/RadarAnimationNk.aspx",
                nj: "https://weather.bangkok.go.th/Radar/RadarAnimation.aspx"
            },
            right: {
                bkk: "https://weather.bangkok.go.th/Radar/RadarHighResolutionNk.aspx",
                svp: "https://weather.tmd.go.th/svp240loop.php"
            }
        };

        let currentLeftType = 'nk';
        let currentRightType = 'bkk';

        /**
         * Dynamic scaling engine calculating screen dimensions
         */
        function applyDynamicTransforms() {
            const boxLeft = document.getElementById('box-left');
            const boxRight = document.getElementById('box-right');
            const scalerLeft = document.getElementById('scaler-left');
            const scalerRight = document.getElementById('scaler-right');

            if (!boxLeft || !boxRight || !scalerLeft || !scalerRight) return;

            const isMobile = window.innerWidth < 768;

            // --- Left Pane Scaling ---
            // Set static pixel container size so iOS knows exactly how to render before scaling
            scalerLeft.style.width = '1000px';
            scalerLeft.style.height = '900px';

            const leftW = boxLeft.clientWidth;
            const leftH = boxLeft.clientHeight;
            
            // Allow slight user offset on left too if desired, but kept simple here
            let leftScale = Math.min(leftW / 920, leftH / 850) * (isMobile ? 1.05 : 1.15) + rightScaleUserOffset;
            let leftYOffset = isMobile ? -60 : -90;
            scalerLeft.style.transform = `scale(${leftScale}) translate(0px, ${leftYOffset}px)`;

            // --- Right Pane Scaling ---
            const rightW = boxRight.clientWidth;
            const rightH = boxRight.clientHeight;
            
            let baseRightScale, rightYOffset, rightXOffset;

            if (currentRightType === 'bkk') {
                scalerRight.style.width = '1850px';
                scalerRight.style.height = '1650px';
                
                baseRightScale = Math.min(rightW / 1850, rightH / 1650) * (isMobile ? 1.85 : 1.0);
                rightYOffset = isMobile ? -140 : -120;
                rightXOffset = 0;
            } else {
                scalerRight.style.width = '850px';
                scalerRight.style.height = '850px';
                
                baseRightScale = Math.min(rightW / 850, rightH / 850) * (isMobile ? 0.95 : 1.0);
                rightYOffset = isMobile ? 0 : 20;
                rightXOffset = 0;
            }

            const finalRightScale = Math.max(0.15, baseRightScale + rightScaleUserOffset);
            scalerRight.style.transform = `scale(${finalRightScale}) translate(${rightXOffset}px, ${rightYOffset}px)`;
        }

        // Restored Zoom functions
        function adjustScale(delta) {
            rightScaleUserOffset += delta;
            applyDynamicTransforms();
        }

        function resetScale() {
            rightScaleUserOffset = 0;
            applyDynamicTransforms();
        }

        function changeLeftRadar(type) {
            currentLeftType = type;
            const url = radarSources.left[type];
            document.getElementById('link-left').href = url;
            showLoader('loader-left');
            document.getElementById('iframe-left').src = `${url}?t=${new Date().getTime()}`;
            applyDynamicTransforms();
        }

        function changeRightRadar(type) {
            currentRightType = type;
            const url = radarSources.right[type];
            document.getElementById('link-right').href = url;
            rightScaleUserOffset = 0; // Reset user zoom on change
            applyDynamicTransforms();
            showLoader('loader-right');
            document.getElementById('iframe-right').src = `${url}?t=${new Date().getTime()}`;
        }

        function updateTimerUI() {
            const minutes = Math.floor(countdown / 60);
            const seconds = countdown % 60;
            const timeStr = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            const timerEl = document.getElementById('countdown-timer');
            if (timerEl) timerEl.textContent = timeStr;
            
            const progressPercent = (countdown / REFRESH_SECONDS) * 100;
            const progressBar = document.getElementById('progress-bar');
            if (progressBar) progressBar.style.width = `${progressPercent}%`;
        }

        function startCountdown() {
            clearInterval(timerId);
            timerId = setInterval(() => {
                countdown--;
                updateTimerUI();
                if (countdown <= 0) executeRefresh();
            }, 1000);
        }

        function executeRefresh() {
            countdown = REFRESH_SECONDS;
            updateTimerUI();
            const timestamp = new Date().getTime();
            
            showLoader('loader-left');
            showLoader('loader-right');

            const ifLeft = document.getElementById('iframe-left');
            const ifRight = document.getElementById('iframe-right');

            if (ifLeft) ifLeft.src = `${radarSources.left[currentLeftType]}?t=${timestamp}`;
            if (ifRight) ifRight.src = `${radarSources.right[currentRightType]}?t=${timestamp}`;

            updateTimestamp();
        }

        function manualRefresh() {
            const icon = document.getElementById('refresh-icon');
            if (icon) icon.classList.add('fa-spin');
            executeRefresh();
            setTimeout(() => {
                if (icon) icon.classList.remove('fa-spin');
            }, 800);
        }

        function updateTimestamp() {
            const now = new Date();
            const timeElement = document.getElementById('last-updated-time');
            if (timeElement) {
                timeElement.textContent = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            }
        }

        function onIframeLoaded(loaderId) {
            hideLoader(loaderId);
            applyDynamicTransforms();
        }

        function onIframeError(errorId, loaderId) {
            hideLoader(loaderId);
        }

        function hideLoader(loaderId) {
            const loader = document.getElementById(loaderId);
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        function showLoader(loaderId) {
            const loader = document.getElementById(loaderId);
            if (loader) {
                loader.style.display = 'flex';
                loader.style.opacity = '1';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateTimestamp();
            updateTimerUI();
            startCountdown();
            applyDynamicTransforms();

            // Fallback to hide loaders after 4s
            setTimeout(() => {
                hideLoader('loader-left');
                hideLoader('loader-right');
            }, 4000);
        });

        window.addEventListener('resize', applyDynamicTransforms);
        window.addEventListener('orientationchange', () => {
            setTimeout(applyDynamicTransforms, 200);
        });
    </script>
</body>
</html>
